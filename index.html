add({id:'lead1', g:'P0 — Parcours acquéreur', n:'04', title:'Mise en relation — étape 1 : coordonnées',
  intro:"Ce formulaire EST le produit vendu à l'agence. Sa qualité perçue conditionne le prix qu'une agence acceptera de payer. Deux étapes courtes valent mieux qu'un formulaire long : l'étape 1 ne demande que le strict nécessaire. **Le visiteur y entre sans compte** — la vérification n'arrive qu'au moment de l'envoi.",
  notes:[
    ['Rappel du bien en permanence','l’utilisateur contacte UN bien précis. Le sortir du contexte fait chuter la complétion.'],
    ['Le visiteur remplit AVANT de créer son compte','l’app est ouverte : on ne demande un compte que pour deux choses, voir le cashflow et envoyer la demande. Mettre le mur à l’entrée du tunnel faisait payer l’inscription avant d’avoir rien reçu en échange ; le mettre à l’envoi la fait payer une fois le travail fait et l’intention formée. Le formulaire lui-même EST l’inscription — ces quatre champs sont exactement ceux d’un compte.'],
    ['Le téléphone n’est vérifié qu’une fois','pour un compte existant, le champ affiche « déjà vérifié » et rien n’est redemandé (F-072). Pour un visiteur, l’OTP arrive à l’envoi, une seule fois, et vaut pour toutes les mises en relation suivantes.'],
    ['Deux étapes, plus trois','le tunnel s’est raccourci en même temps que l’OTP est remonté hors du parcours de contact.']
  ],
  render:()=>{
    /* L'app est ouverte : le visiteur remplit le tunnel sans compte.
       Le compte + l'OTP se déclenchent à l'ENVOI (fin du funnel), pas à l'entrée. */
    const anon = AUTH==='out';
    return `${appnav('Recherche')}
  <div class="sec"><div style="max-width:760px;margin:0 auto">
    ${stepper(['Coordonnées','Votre projet'],0)}
    <div class="card mt20">
      <div class="pad" style="border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:center">
        ${ph('photo',52).replace('height:52px','height:52px;width:74px;flex:none')}
        <div class="grow"><div class="txt" style="font-weight:500;color:var(--ink)">${BIENS[0].t}${pin(1)}</div>
        <div class="sub num">${nbsp('289 000 €')} · ${BIENS[0].ags.length} agences détiennent un mandat</div></div>
      </div>
      <div class="pad">
        <h4 class="wt">Vos coordonnées</h4>
        <p class="txt" style="margin-top:5px">Transmises aux agences que vous retiendrez à l'étape suivante, pour ce bien.</p>
        ${anon?`<div class="bandeau mt14">${pin(2)}
          <div class="row gap8" style="align-items:flex-start">
            <div class="ph solid" style="width:16px;height:16px;flex:none;margin-top:1px"></div>
            <div>Ces quatre champs créent votre compte au passage — <b>rien à remplir deux fois</b>.
            Un code SMS vous sera demandé au moment de l'envoi, <b>une seule fois</b> : ensuite vous
            contactez autant d'agences que vous voulez sans jamais reconfirmer.</div>
          </div></div>`:''}
        <div class="grid2 mt20">
          ${inp('Prénom',anon?'':'Marc')}${inp('Nom',anon?'':'D.')}
        </div>
        <div class="grid2 mt14">
          ${inp('Email',anon?'':'marc.d@…')}
          ${inp('Téléphone mobile',anon?'':'06 •• •• •• 42',
            {hint: anon?'Vérifié par SMS à l\'envoi — une seule fois, puis plus jamais.'
                       :'Déjà vérifié par SMS à votre inscription — rien à reconfirmer.'})}
        </div>
        <div class="row mid mt20" style="justify-content:space-between">
          <button class="btn ghost hot" onclick="go('fiche')">← Annuler</button>
          <button class="btn hot" onclick="go('lead2')">Continuer${pin(3)}</button>
        </div>
      </div>
    </div>
  </div></div>`;
  }
});

add({id:'lead2', g:'P0 — Parcours acquéreur', n:'05', title:'Mise en relation — étape 2 : votre projet',
  states:['Votre projet','Bien à mandat unique','Demande envoyée'],
  intro:"L'étape qui donne à l'agence de quoi répondre utilement. Tout ce qui est rempli ici part **avec la demande, gratuitement pour l'agence** — c'est la promesse « gratuit = vraiment gratuit » vue de l'autre côté. C'est aussi ici que se choisissent les **destinataires** : la demande part à toutes les agences qui détiennent un mandat sur le bien, l'acquéreur décoche celles qu'il ne veut pas. Et c'est ici que vit **l'écran de consentement du catalogue** : la case, jamais pré-cochée, qui permet d'être proposé à d'autres agences.",
  notes:[
    ['Tout ce qui est rempli part avec la demande, gratuitement','budget, financement, délai arrivent chez l\'agence AVEC le contact — rien n\'est retenu pour lui être vendu. Les questions doivent donc se justifier par une seule chose : aider l\'agence à répondre utilement dès le premier échange.'],
    ['Formulé côté acquéreur','« pour que l’agence vous propose des biens pertinents », jamais « pour mieux vous vendre ». La transparence est aussi une exigence RGPD.'],
    ['Toutes les agences par défaut, décocher est le geste','un bien porte N mandats ; envoyer à une seule obligerait l’acquéreur à choisir entre des agences qu’il ne connaît pas, sur un critère qu’il n’a pas — et à recommencer si elle ne répond pas. On envoie donc aux N, et on lui laisse la main pour en retirer. Cocher n’est pas un geste ; décocher en est un — le défaut doit être le cas utile.'],
    ['La liste montre POURQUOI on peut vouloir décocher','le prix demandé par chacune et la nature du mandat sont affichés : ce sont les deux seules informations dont l’acquéreur dispose pour trancher, et elles sont factuelles. Aucun tri, aucun classement, aucune recommandation — nous sommes le partenaire des agences, pas leur arbitre.'],
    ['La dernière case se verrouille','une demande sans destinataire n’est pas une demande. Plutôt que d’échouer à l’envoi, la dernière agence cochée refuse d’être décochée et le dit.'],
    ['Consentement explicite et NOMMÉ','le bandeau liste les destinataires retenus, pas « nos partenaires ». Sur un bien à trois mandats, nommer qui reçoit quoi n’est pas une formalité — c’est la seule façon de tenir la promesse.'],
    ['Le consentement catalogue est un 2ᵉ oui, jamais fusionné avec l’envoi','envoyer sa demande aux mandataires du bien et accepter d’être proposé à D’AUTRES agences sont deux choses différentes — une seule case pour les deux serait un consentement forcé. La case catalogue est séparée, jamais pré-cochée, révocable depuis les paramètres, et son bénéfice est réel côté acquéreur : des propositions correspondant à sa recherche, y compris des biens off-market, avant leur publication. Obligation légale stricte, et condition de tout le modèle.'],
    ['Champs facultatifs assumés','un lead partiel vaut mieux qu’un abandon. Le marquage « facultatif » est visible.']
  ],
  render:(st)=>{
    const solo = st==='Bien à mandat unique';
    /* mandat unique : on emprunte un autre bien du jeu de données plutôt que d'inventer un cas */
    const B    = solo ? BIENS[2] : BIENS[0];
    const sel  = solo ? B.ags : leadAgList();
    const noms = sel.map(a=>a[0]);
    const liste = noms.length===1 ? `<b>${noms[0]}</b>`
      : noms.slice(0,-1).map(n=>`<b>${n}</b>`).join(', ') + ` et <b>${noms[noms.length-1]}</b>`;

    if (st==='Demande envoyée') return `${appnav('Recherche')}
    <div class="sec"><div style="max-width:600px;margin:0 auto">
      ${stepper(['Coordonnées','Votre projet'],1)}
      <div class="card mt20"><div class="empty">
        <div class="ico"></div>
        <h4 class="wt">C'est parti.</h4>
        <p>${noms.length>1?`<b>${noms.length} agences</b> ont reçu`:`${noms[0]} a reçu`} vos coordonnées et votre projet${noms.length>1?', en même temps':''}.<br>
        Temps de réponse moyen constaté : <b>8 h</b>.</p>
        <div class="col gap6 mt14" style="text-align:left">
          ${sel.map(([ag,px,mand])=>`
            <div class="card flat pad">
              <div class="row mid agrow" style="justify-content:space-between;gap:10px">
                <div style="min-width:0">
                  <div class="txt" style="font-weight:600;color:var(--ink)">${ag}</div>
                  <div class="sub">${mand}</div>
                </div>
                <div class="row mid gap8" style="flex:none">
                  <div class="mid2 num">${nbsp(px)}</div>
                  <span class="chip">Envoyée</span>
                </div>
              </div>
            </div>`).join('')}
        </div>
        ${noms.length>1?`<div class="sub" style="margin-top:12px;text-align:left">${pin(7)}
          Chacune répond de son côté — vous suivez les ${noms.length} réponses au même endroit,
          et vous coupez le contact avec l'une sans couper les autres.</div>`:''}
        <div class="row gap8 mt14">
          <button class="btn hot" onclick="goState('accueil','Demande envoyée')">Suivre ma demande</button>
          <button class="btn sec2 hot" onclick="go('recherche')">Continuer ma recherche</button>
        </div>
        <div class="sub" style="margin-top:14px">Votre numéro est vérifié une fois pour toutes :
        les prochaines demandes partiront sans aucune étape de vérification.</div>
      </div></div>
    </div></div>`;
    return `${appnav('Recherche')}
  <div class="sec"><div style="max-width:760px;margin:0 auto">
    ${stepper(['Coordonnées','Votre projet'],1)}
    <div class="card mt20"><div class="pad">
      <h4 class="wt">Votre projet${pin(1)}</h4>
      <p class="txt" style="margin-top:5px">${pin(2)} Ces éléments permettent à l'agence de vous répondre utilement dès le premier échange.
        <span class="more" onclick="POP.questions()">Pourquoi ces questions ?</span></p>

      <div class="field mt20"><div class="lbl">Type de projet</div>
        <div class="row gap6 wrap">
          <span class="chip k">Investissement locatif</span><span class="chip">Résidence principale</span>
          <span class="chip">Résidence secondaire</span><span class="chip">Revente / marchand</span>
        </div></div>

      <div class="grid2 mt14">
        ${inp('Budget maximum','320 000 €')}
        ${inp('Apport disponible','45 000 €',{hint:'facultatif'})}
      </div>

      <div class="field mt14"><div class="lbl">Financement</div>
        <div class="row gap6 wrap">
          <span class="chip k">J'ai un pré-accord bancaire</span><span class="chip">Je cherche un financement</span>
          <span class="chip">Achat comptant</span>
        </div>
        <div class="hint">${pin(4)} Facultatif — un projet financé se traite différemment d'un achat comptant.</div></div>

      <div class="grid2 mt14">
        ${inp('Délai d\'acquisition','moins de 3 mois')}
        ${inp('Acquisitions déjà réalisées','2 biens',{hint:'facultatif'})}
      </div>

      <div class="field mt14"><div class="lbl">Message à l'agence</div>
        <div class="inp" style="min-height:74px;align-items:flex-start">
          <span class="v">Disponible pour visiter en semaine, y compris en journée.</span></div>
        <div class="hint">facultatif</div></div>

      <div class="field mt20" style="border-top:1px solid var(--line-2);padding-top:18px">
        <h4 class="wt">Qui reçoit votre demande${pin(3)}</h4>
        <p class="txt" style="margin-top:5px">${
          solo
          ? `Une seule agence détient un mandat sur ce bien — c'est elle qui vous répondra.`
          : `<b>${B.ags.length} agences</b> détiennent un mandat sur ce bien. Votre demande part
             aux ${B.ags.length===3?'trois':B.ags.length}, en même temps.
             ${pin(4)} Décochez celles que vous ne souhaitez pas solliciter.`}</p>

        <div class="col gap6 mt14">
          ${B.ags.map(([ag,px,mand,vit],i)=>{
            const on = solo ? true : leadAgs().has(i);
            const last = !solo && on && leadAgs().size===1;
            return `
            <div class="card flat pad ${solo?'':'hot'}" ${solo?'':`onclick="toggleLeadAg(${i})"`}
                 style="${on?'':'opacity:.55'}">
              <div class="row mid agrow" style="justify-content:space-between;gap:10px">
                <div class="row mid gap8" style="min-width:0">
                  <div style="width:17px;height:17px;flex:none;border-radius:4px;
                       border:1.5px solid ${on?'var(--ink)':'var(--line)'};
                       background:${on?'var(--ink)':'transparent'};color:#fff;
                       font-size:11px;line-height:15px;text-align:center;font-weight:700">${on?'✓':''}</div>
                  <div style="min-width:0">
                    <div class="row mid gap6"><span class="txt" style="font-weight:600;color:var(--ink)">${ag}</span>
                      ${vit?'<span class="chip k">En tête de liste</span>':''}</div>
                    <div class="sub">${mand}</div>
                  </div>
                </div>
                <div class="mid2 num" style="flex:none">${nbsp(px)}</div>
              </div>
              ${last?`<div class="hint" style="margin-top:7px">${pin(5)} Au moins une agence doit rester sélectionnée —
                celle-ci ne peut pas être décochée.</div>`:''}
            </div>`;}).join('')}
        </div>

        ${solo?'':`<div class="sub mt8">${sel.length} agence${sel.length>1?'s':''} retenue${sel.length>1?'s':''}
          sur ${B.ags.length}. Les écarts de prix peuvent provenir des honoraires d'agence : nous ne les
          classons pas et ne les commentons pas — le choix vous appartient.</div>`}
      </div>

      <div class="field mt20" style="border-top:1px solid var(--line-2);padding-top:18px">
        <h4 class="wt">Et pour la suite de votre recherche${pin(7)}</h4>
        <div class="card flat pad hot mt14" onclick="toggleOptin()" style="${OPTIN?'border-color:var(--ink)':''}">
          <div class="row gap8" style="align-items:flex-start">
            <div style="width:17px;height:17px;flex:none;margin-top:2px;border-radius:4px;
                 border:1.5px solid ${OPTIN?'var(--ink)':'var(--line)'};
                 background:${OPTIN?'var(--ink)':'transparent'};color:#fff;
                 font-size:11px;line-height:15px;text-align:center;font-weight:700">${OPTIN?'✓':''}</div>
            <div style="min-width:0">
              <div class="txt" style="font-weight:600;color:var(--ink)">Recevoir des propositions d'agences
              correspondant à ma recherche — y compris des biens off-market, avant leur publication.</div>
              <div class="sub" style="margin-top:4px">Des agences dont les biens correspondent à vos
              critères pourront vous appeler. Elles voient d'abord votre recherche sans votre identité —
              vos coordonnées ne leur sont transmises que si elles s'engagent auprès de vous.</div>
              <div class="sub" style="margin-top:4px">Facultatif, jamais coché d'avance, révocable à tout
              moment depuis vos paramètres. Ni obligatoire pour envoyer cette demande, ni lié à elle.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="bandeau mt20">${pin(6)}
        <div class="row gap8" style="align-items:flex-start">
          <div class="ph solid" style="width:16px;height:16px;flex:none;margin-top:1px"></div>
          <div>En envoyant ce formulaire, vous acceptez que vos coordonnées et votre projet soient transmis à
          ${liste}${sel.length>1?', qui détiennent chacune un mandat sur ce bien':", l'agence que vous contactez sur ce bien"}.
          Rien d'autre, à personne d'autre${OPTIN?' — et, parce que vous l\'avez coché, les agences dont les biens correspondent à votre recherche'
          :''}.</div>
        </div>
      </div>

      <div class="row mid mt20" style="justify-content:space-between">
        <button class="btn ghost hot" onclick="go('lead1')">← Retour</button>
        <button class="btn hot" onclick="${AUTH==='out'?"otpFromLead()":"setState('Demande envoyée')"}">${
          AUTH==='out'
            ? `Vérifier mon numéro et envoyer${sel.length>1?` aux ${sel.length} agences`:''}`
            : `Envoyer ma demande${sel.length>1?` aux ${sel.length} agences`:''}`}</button>
      </div>
    </div></div>

});

add({id:'otp', g:'P0 — Parcours acquéreur', n:'06', title:'Vérification SMS — une seule fois, à l\'inscription',
  intro:"L'OTP n'est pas un péage de mise en relation : c'est la **dernière étape avant l'envoi**, et elle n'a lieu qu'une fois dans la vie du compte. L'app étant ouverte, un visiteur traverse tout le tunnel sans compte et n'arrive ici qu'au moment d'envoyer — le formulaire qu'il vient de remplir a créé son compte au passage. Un numéro vérifié une fois vaut pour toutes les mises en relation futures (F-072).",
  states:['Saisie','Code erroné','Vérifié'],
  notes:[
    ['Vérifier une fois, pas à chaque contact','le numéro ne change pas entre deux biens. L’OTP est donc une porte d’entrée au compte, pas un péage de mise en relation — le parcours de contact retombe à deux étapes.'],
    ['Justifier avant de demander','« ce code protège la qualité des mises en relation » transforme un contrôle en bénéfice partagé. Ici l’argument est encore plus fort : c’est la seule fois où on le demandera.'],
    ['Numéro masqué et modifiable','une faute de frappe ne doit pas coûter toute l’inscription.'],
    ['Erreur sans culpabilisation','on annonce les tentatives restantes et le renvoi, pas un blâme.'],
    ['Renvoi avec compte à rebours','évite le pilonnage SMS (qui nous coûte de l’argent chez Brevo) sans bloquer l’utilisateur.'],
    ['La sortie mène à la recherche, pas à un tableau de bord vide','un compte fraîchement créé n’a rien à afficher. On renvoie sur le geste qui a amené l’utilisateur.']
  ],
  render:(st)=>{
    /* deux entrées : inscription classique, ou fin du tunnel de mise en relation d'un visiteur */
    const nAg  = leadAgList().length;
    const pas  = FROMLEAD ? ['Coordonnées','Votre projet','Vérification'] : ['Compte','Téléphone','Vérification'];
    if (st==='Vérifié') return `${appnav('Recherche')}
      <div class="sec"><div style="max-width:560px;margin:0 auto">
        ${stepper(pas,2)}
        <div class="card mt20"><div class="empty">
          <div class="ico"></div>
          <h4 class="wt">${FROMLEAD?'Votre numéro est vérifié.':'Votre compte est prêt.'}</h4>
          <p>${FROMLEAD
            ? `Votre compte est créé au passage. Il ne reste qu'à envoyer votre demande
               ${nAg>1?`aux <b>${nAg} agences</b> retenues`:'à l\'agence retenue'}.`
            : 'Votre numéro est vérifié.'}
          <b>Vous n'aurez plus jamais à le confirmer</b> — ni pour contacter
          une agence, ni sur un autre bien.</p>
          <div class="row gap8 mt8">
            ${FROMLEAD
              ? `<button class="btn hot" onclick="sendFromOtp()">Envoyer ma demande${nAg>1?` aux ${nAg} agences`:''}</button>
                 <button class="btn sec2 hot" onclick="go('lead2')">← Revoir ma demande</button>`
              : `<button class="btn hot" onclick="goState('accueil','Compte neuf')">Commencer</button>
                 <button class="btn sec2 hot" onclick="go('recherche')">Lancer une recherche</button>`}
          </div>
          <div class="sub" style="margin-top:14px">${pin(6)} Les agences rappellent en priorité les profils
          vérifiés : c'est ce que cette minute vous achète.</div>
        </div></div>
      </div></div>`;
    const bad = st==='Code erroné';
    return `${appnav('Recherche')}
      <div class="sec"><div style="max-width:560px;margin:0 auto">
        ${stepper(pas,2)}
        <div class="card mt20"><div class="pad" style="text-align:center;padding:30px 26px">
          <h4 class="wt">Confirmez votre numéro${pin(1)}</h4>
          <p class="txt mt8">Un code à 6 chiffres vient d'être envoyé au <b class="num">06 •• •• •• 42</b>.
          <b>Une seule fois</b> : ensuite vous contactez autant d'agences que vous voulez sans jamais
          reconfirmer votre numéro.</p>
          <div class="row gap8" style="justify-content:center;margin:22px 0">
            ${[0,1,2,3,4,5].map(i=>`<div class="inp ${bad?'bad':''}" style="width:44px;height:52px;justify-content:center;font-size:19px">
              <span class="v num">${bad?['4','8','1','0','3','9'][i]:(i<3?['4','8','1'][i]:'')}</span></div>`).join('')}
          </div>
          ${bad?`<div class="bandeau" style="text-align:left">${pin(4)} <b>Ce code ne correspond pas.</b> Il vous reste 2 tentatives, ou demandez un nouveau code.</div>`:''}
          <button class="btn full mt20 hot" onclick="setState('Vérifié')">Vérifier</button>
          <div class="row mid gap8" style="justify-content:center;margin-top:14px">
            <span class="sub">${pin(5)} Renvoyer le code dans <b class="num">0:42</b></span>
            <span>·</span><span class="linkish sub">${pin(3)} Modifier le numéro</span>
          </div>
        </div></div>
      </div></div>`;

});

add({id:'recherches', g:'P0 — Parcours acquéreur', n:'08', title:'Mes recherches — enregistrées & récentes',
  intro:"Le moteur de rétention. Une recherche enregistrée avec alerte, c'est un utilisateur qui revient sans qu'on paie pour le faire revenir. Mais la majorité des retours passe par une recherche qu'il n'a JAMAIS enregistrée — d'où les deux onglets, et l'étoile comme seul passage de l'un à l'autre.",
  states:['Enregistrées','Récentes','Aucune recherche'],
  notes:[
    ['Le compteur de nouveautés est le CTA','« 4 nouvelles » est plus efficace que n’importe quel bouton.'],
    ['Fréquence d’alerte choisie par l’utilisateur','instantané pour les chasseurs, hebdomadaire pour les tièdes — c’est aussi ce qui limite notre coût d’envoi.'],
    ['Critères modifiables sur place','sans repasser par l’écran de recherche.'],
    ['Deux onglets, parce que ce sont deux objets','les enregistrées sont un engagement — nommées, alertées, permanentes. Les récentes sont un historique passif que personne n’a demandé et que personne ne veut ranger. Les mélanger obligerait l’utilisateur à faire le ménage dans une liste qu’il n’a pas créée.'],
    ['L’étoile est la seule frontière','un clic fait passer une récente en enregistrée, et ouvre le choix de fréquence dans la foulée. C’est le seul moment où demander une alerte n’est pas intrusif : il vient de dire qu’il tenait à cette recherche.'],
    ['Les récentes expirent, et on le dit','30 jours, écrit dans l’écran. Sans compte, elles ne quittent pas l’appareil — c’est aussi l’argument le plus concret pour créer un compte, et il est vrai.'],
    ['Le nombre de résultats est celui du MOMENT de la recherche','« 0 bien » sur une recherche d’il y a six jours ne dit pas qu’il n’y a rien aujourd’hui. On date le chiffre plutôt que de le rafraîchir en silence : un compteur qui change tout seul fait douter de tous les autres.'],
    ['L’état vide distingue les deux cas','aucune recherche du tout, ou aucune enregistrée alors qu’il y a des récentes. Le second propose l’action évidente — enregistrer celle d’hier — au lieu de renvoyer vers un formulaire vide.']
  ],
  render:(st)=>{
    const rec = st==='Récentes';
    const vide = st==='Aucune recherche';
    const onglets = `
      <div class="sidetabs" style="margin-top:14px">
        ${[['Enregistrées',`Enregistrées (${RECENTES.filter(r=>r.sauv).length})`],
           ['Récentes',`Récentes (${RECENTES.length})`]]
          .map(([k,l])=>`<button class="${(rec?'Récentes':'Enregistrées')===k?'on':''}"
            onclick="setState('${k}')">${l}</button>`).join('')}
      </div>`;

    if (vide) return `${appnav('Mes recherches')}
      <div class="sec">
        <h4 class="wt">Mes recherches</h4>
        <div class="card mt20"><div class="empty">
          <div class="ico"></div>
          <h5 class="wt">Aucune recherche pour l'instant</h5>
          <p>Dès que vous lancez une recherche, elle apparaît ici — sans rien avoir à enregistrer.
          L'étoile ne sert qu'à celles que vous voulez garder et suivre.</p>
          <button class="btn hot" onclick="go('recherche')">Lancer une recherche</button>
        </div></div>
      </div>`;

    const liste = rec ? RECENTES : RECENTES.filter(r=>r.sauv);
    const ALERTES = {0:'Instantané', 1:'Quotidien', 3:'Désactivée'};

    return `${appnav('Mes recherches')}
    <div class="sec">
      <div class="row mid" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div><h4 class="wt">Mes recherches</h4>
          <div class="sub">${rec
            ? `<b class="num">${RECENTES.length}</b> lancées ces 30 derniers jours`
            : `<b class="num">${RECENTES.filter(r=>r.sauv).length}</b> enregistrées · 2 alertes actives`}</div></div>
        <button class="btn sec2 hot" onclick="HASQ=false;go('recherche')">Nouvelle recherche</button>
      </div>
      ${onglets}

      <div class="col gap8 mt20">
        ${liste.map((r,i)=>{
          const idx = RECENTES.indexOf(r);
          const freq = ALERTES[idx] || 'Quotidien';
          return `
          <div class="card flat pad">
            <div class="row mid stackm" style="justify-content:space-between;gap:12px">
              <div class="grow" style="min-width:0">
                <div class="row mid gap6 wrap">
                  <span class="linkish hot" style="font-weight:500;color:var(--ink)"
                    onclick="POP.localisation()" title="Modifier les zones">${r.q}</span>
                  <span class="chip">${r.mode==='home'?"J'habite":"J'investis"}</span>
                </div>
                <div class="row mid gap8" style="margin-top:7px;flex-wrap:wrap">
                  ${r.n
                    ? `<span class="chip k">${pin(1)} ${nbsp(r.n+' biens')}</span>`
                    : '<span class="chip">Aucun résultat</span>'}
                  ${r.sauv
                    ? `<span class="chip">${pin(2)} Alerte : ${freq}</span>`
                    : `<span class="chip o">${pin(5)} Non enregistrée</span>`}
                  <span class="sub">${pin(7)} ${rec?'lancée':'dernière exécution'} ${r.d}</span>
                </div>
              </div>
              <div class="row gap8" style="flex:none;flex-wrap:wrap">
                <button class="btn sm ${r.n?'':'sec2'} hot" onclick="go('recherche')">Voir les résultats</button>
                <button class="btn sm sec2 hot" onclick="${r.sauv
                  ? `RECENTES[${idx}].sauv=false;show(cur,true)`
                  : `POP.sauvegarder(${idx})`}">${r.sauv?'★ Enregistrée':'☆ Enregistrer'}</button>
                <button class="btn sm ghost hot" onclick="POP.recherche()">${pin(3)} Modifier</button>
              </div>
            </div>
          </div>`;}).join('')}
      </div>

      ${rec
        ? `<div class="disc mt14">${pin(6)} Vos recherches récentes sont conservées <b>30 jours</b>.
           Sans compte, elles ne quittent pas cet appareil — les enregistrer (★) les rend permanentes,
           les synchronise et permet de recevoir les nouveautés.</div>`
        : (RECENTES.some(r=>!r.sauv)
          ? `<div class="bandeau mt14">${pin(8)}
             <b>${RECENTES.filter(r=>!r.sauv).length} recherches récentes ne sont pas enregistrées.</b>
             Elles disparaîtront dans 30 jours et ne déclenchent aucune alerte.
             <div class="row gap8 mt8"><button class="btn sm sec2 hot" onclick="setState('Récentes')">Les voir</button></div></div>`
          : '')}
    </div>`;
  }
});

add({id:'compte', g:'P0 — Parcours acquéreur', n:'09', title:'Paramètres du compte',
  intro:"Écran standard, avec une spécificité produit : les charges par défaut saisies ici pré-remplissent tous les calculs de rendement. C'est un réglage produit déguisé en préférence.",
  notes:[
    ['Hypothèses de calcul par défaut','déplacées du bloc analyse vers le compte : on ne demande pas ces réglages à chaque fiche.'],
    ['Complétude du profil','85/100 débloque le badge « Profil sérieux », qui augmente la valeur perçue du lead côté agence. Le lien effort → bénéfice doit être explicite.'],
    ['RGPD actionnable','export et suppression accessibles en deux clics, pas enterrés dans les CGU.'],
    ['La révocation du consentement catalogue vit ici','le oui s’est donné dans le tunnel ou le profil ; le non doit être aussi simple — un bouton dans les paramètres, effet dans l’heure, jamais un email au support. C’est la condition légale du modèle, et elle se prouve par l’UI.']

add({id:'analyse-avancee', g:'P0+ — Cachet & IA (scope v2)', n:'', scope:'v2', title:'Estimation, score et avis First Mundi',
  intro:"Le bloc qui fait passer la fiche de « portail efficace » à « produit à cachet ». **Les deux profils y ont droit** — l'estimation, le quartier et l'avis IA répondent à la peur n°1 de l'acquéreur (« et si on achète trop cher ? ») autant qu'au besoin de vérification de l'investisseur. Seules les unités changent. Règle transverse non négociable : toute estimation affiche sa méthode, son indice de confiance et la mention « indicatif, non contractuel ».",
  states:['Cas nominal','Confiance faible','Données insuffisantes'],
  notes:[
    ['Le même bloc sert les deux profils','l’estimation de prix, les données de quartier et l’avis IA ne sont pas des outils d’investisseur : ce sont des outils de décision. Seules les unités changent — loyer et rendement d’un côté, coût énergétique et mensualité de l’autre.'],
    ['La confiance se lit avant le chiffre','l’indice de confiance est placé à côté de l’estimation, pas en note de bas de page. C’est ce qui autorise à s’appuyer dessus — ou pas.'],
    ['Fourchette, jamais un chiffre unique','basse / médiane / haute avec le prix affiché positionné dessus. Une valeur seule serait lue comme une vérité.'],
    ['La méthode est consultable','« 24 mutations DVF comparables, rayon 600 m, 18 derniers mois ». Sans ça, l’estimation n’est qu’une opinion — et les deux avatars rejettent les estimations « qui ne connaissent pas leur quartier ».'],
    ['Le quartier sort de DVF, pas d’une nouvelle source','prix médian au m², volume de ventes, tendance : ces chiffres sont un sous-produit gratuit de l’ingestion DVF déjà prévue pour l’estimation. Zéro coût data supplémentaire.'],
    ['Score décomposé, critères adaptés au profil','les 4 critères et leur poids sont visibles ligne à ligne, et ils changent selon le profil — le rendement ne dit rien à un acquéreur, le coût énergétique ne dit rien à un investisseur qui reloue.'],
    ['L’avis IA est sourcé sur des champs réels','3 points forts / 3 vigilances, chacun rattaché à une donnée du bien. Prompt contraint, vocabulaire adapté au profil — aucun « rendement » ni « cash-flow » côté acquéreur.'],
    ['Le repli « données insuffisantes » est un état de premier rang','sur un marché peu liquide il sera fréquent. Mieux vaut ne rien afficher que d’afficher faux.'],
    ['Aucune donnée que nous n’ingérons pas','écoles, transports, commerces, temps de trajet : écartés le 07/08. Tout ce qui exigerait une nouvelle source reste dehors — le quartier ne dit que ce que les ventes DVF disent.']
  ],
  render:(st)=>{
    const faible = st==='Confiance faible';
    const vide = st==='Données insuffisantes';
    const acq = MODE==='home';

    if (vide) return `${appnav('Recherche')}
      <div class="sec"><div style="max-width:880px;margin:0 auto">
        <div class="row mid gap8 sub"><span class="linkish hot" onclick="go('fiche')">← Fiche du bien</span>
          <span>·</span><span>Maison 5 pièces · Mérignac</span></div>
        <div class="card mt14"><div class="empty">
          <div class="ico"></div>
          <h5 class="wt">${pin(8)} Pas assez de comparables pour estimer ce bien</h5>
          <p>Nous avons trouvé 3 mutations comparables sur 18 mois dans un rayon de 600 m — en dessous du seuil
          de fiabilité que nous nous imposons (12 minimum). Nous préférons ne rien afficher plutôt qu'un chiffre trompeur.</p>
          <div class="row gap8">
            <button class="btn sec2 sm">Élargir le rayon à 2 km</button>
            <button class="btn sec2 sm">Voir les 3 mutations trouvées</button>
          </div>
          <div class="disc" style="margin-top:6px">Le score du bien et l'avis First Mundi sont également indisponibles :
          tous deux s'appuient sur l'estimation.</div>
        </div></div>
      </div></div>`;

    return `${appnav('Recherche')}
    <div class="sec"><div style="max-width:880px;margin:0 auto">
      <div class="row mid gap8 sub"><span class="linkish hot" onclick="go('fiche')">← Fiche du bien</span>
        <span>·</span><span>T3 · 62 m² · Lyon 7ᵉ · ${nbsp('289 000 €')}</span></div>

      <div class="card mt14">
        <div class="pad" style="border-bottom:1px solid var(--line-2)">
          <div class="row mid" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
            <div><h5 class="wt">${acq?'Ce bien est-il au bon prix ?':'Estimation de prix'}${pin(2)}</h5>
              <div class="sub">${acq
                ? 'Comparé aux ventes réellement conclues autour de lui — pas aux prix affichés'
                : 'Comparables DVF · mutations notariales'}</div></div>
            ${conf(faible?2:4, faible?'confiance faible':'confiance élevée')}
          </div>
        </div>
        <div class="pad">
          <div class="range">
            <div class="track"></div>
            <div class="band" style="left:${faible?'8%':'22%'};right:${faible?'8%':'22%'}"></div>
            <div class="mk" style="left:46%"></div>
            <div class="lab" style="left:${faible?'8%':'22%'}">${faible?nbsp('232 000 €'):nbsp('268 000 €')}</div>
            <div class="lab" style="left:50%">médiane ${nbsp('284 000 €')}</div>
            <div class="lab" style="left:${faible?'92%':'78%'}">${faible?nbsp('336 000 €'):nbsp('301 000 €')}</div>
          </div>
          <div class="row mid mt14" style="justify-content:space-between;gap:10px;flex-wrap:wrap">

add({id:'profil-completude', g:'P0+ — Cachet & IA (scope v2)', n:'', scope:'v2c', title:'Complétude du profil acquéreur (F-160)',
  intro:"Tout le design tient dans une équation à rendre évidente : ce que je remplis ici, l'agence le voit, et elle me répond plus vite. Sans cette contrepartie visible, personne ne complète. Et pour qui a coché la case catalogue, ce profil **est** la fiche anonymisée que les agences découvrent : le remplir, c'est recevoir de meilleures propositions.",
  states:['En cours (60 / 100)','Complété (100 / 100)'],
  notes:[
    ['Montrer la contrepartie, pas la jauge','un pourcentage seul ne motive personne. L’aperçu « ce que l’agence voit » est placé à côté de la jauge : c’est lui qui fait remplir.'],
    ['Le profil complet est aussi la fiche du catalogue','pour l’acquéreur qui a donné son accord, les agences voient cette fiche SANS l’identité — critères, commune, score, financement oui/non. La jauge et le score de sérieux servent donc les deux faces : réponses plus rapides sur ses demandes, meilleures propositions entrantes.'],
    ['Progression par blocs, pas par champs','cinq blocs identifiables, chacun complétable en moins d’une minute. Une longue liste de champs se lit comme une corvée.'],
    ['Jamais bloquant','le profil incomplet n’empêche ni la recherche ni la mise en relation. C’est un accélérateur, pas un péage — le seuil « sérieux » est à 80.'],
    ['Le badge est nommé côté agence','« Profil sérieux » apparaît sur la fiche lead. La promesse faite ici doit être exactement celle tenue là-bas.'],
    ['Financement déclaratif assumé','au MVP on déclare, on ne prouve pas. Le dossier structuré avec pièces est post-MVP — le vocabulaire doit rester « déclaré » pour ne pas survendre.']
  ],
  render:(st)=>{
    const plein = st==='Complété (100 / 100)';
    const pct = plein?100:60;
    const blocs = [
      ['Identité','Prénom, nom, email','fait'],
      ['Téléphone vérifié','Code SMS confirmé','fait'],
      ['Votre projet','Type d\'investissement, délai','fait'],
      ['Budget','Budget maximum et apport', plein?'fait':'todo'],
      ['Financement déclaré','Pré-accord bancaire ou achat comptant', plein?'fait':'todo']
    ];
    return `${appnav('')}
    <div class="sec"><div class="row stackm gap20" style="max-width:960px;margin:0 auto">
      <div class="grow col gap20">
        <div class="card"><div class="pad">
          <div class="row mid" style="justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div><h4 class="wt">Votre profil${pin(2)}</h4>
              <div class="sub">${plein
                ? 'Profil complet — vos demandes partent avec le badge « Profil sérieux ».'
                : 'Deux blocs à compléter pour débloquer le badge « Profil sérieux » (seuil : 80).'}</div></div>
            <div class="big num">${pct} / 100</div>
          </div>
          <div style="height:7px;background:var(--fill);border-radius:4px;margin-top:12px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:var(--ink-2)"></div></div>
          ${!plein?`<div class="sub" style="margin-top:7px">${pin(3)} Rien n'est obligatoire : vous pouvez contacter une agence dès maintenant.</div>`:''}
        </div></div>

        <div class="col gap8">
          ${blocs.map(([t,d,s])=>`
            <div class="card flat pad">
              <div class="row mid" style="justify-content:space-between;gap:12px">
                <div class="row mid gap8 grow" style="min-width:0">
                  <div class="ph solid" style="width:20px;height:20px;flex:none">${s==='fait'?'✓':''}</div>
                  <div style="min-width:0"><div class="txt" style="font-weight:500;color:var(--ink)">${t}</div>
                  <div class="sub">${d}</div></div>
                </div>
                ${s==='fait'
                  ? '<span class="chip">Complété</span>'
                  : `<button class="btn sm hot" onclick="setState('Complété (100 / 100)')">Compléter · 40 s</button>`}
              </div>
            </div>`).join('')}
        </div>

        ${!plein?`<div class="bandeau">${pin(5)} Le financement est <b>déclaratif</b> : vous indiquez où vous en êtes,
        aucun justificatif ne vous est demandé au moment de la mise en relation.</div>`:''}

        <div class="card"><div class="pad">
          <div class="row mid" style="justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div style="min-width:0"><h5 class="wt">Recevoir des propositions d'agences${pin(2)}</h5>
              <div class="sub" style="margin-top:3px">Des agences dont les biens correspondent à votre
              recherche peuvent vous contacter — y compris pour des biens off-market, avant leur
              publication. Elles voient ce profil <b>sans votre identité</b> ; vos coordonnées ne leur
              sont transmises que si elles s'engagent auprès de vous.</div></div>
            <span class="chip ${OPTIN?'k':'o'}" style="flex:none">${OPTIN?'Activé':'Désactivé'}</span>
          </div>
          <div class="row gap8 mt14 wrap">
            <button class="btn sec2 sm hot" onclick="toggleOptin()">${OPTIN?'Ne plus être proposé aux agences':'Activer — révocable à tout moment'}</button>
          </div>
          <div class="disc mt8">Jamais activé sans votre geste. Se coupe d'un clic, ici ou dans les
          paramètres — vous sortez alors des propositions dans l'heure.</div>
        </div></div>
      </div>

      <div class="side">
        <div class="card" style="position:sticky;top:14px">
          <div class="pad" style="border-bottom:1px solid var(--line-2)">
            <div class="lbl">${pin(1)} Ce que l'agence voit de vous</div>
            <div class="sub" style="margin-top:4px">Aperçu réel de la fiche transmise</div>
          </div>
          <div class="pad">
            <div class="row mid gap8">
              <div class="avatar"></div>
              <div><div class="txt" style="font-weight:600;color:var(--ink)">Marc D.</div>
                <div class="sub">Téléphone vérifié ✓</div></div>
            </div>
            <div class="row gap6 wrap mt14">
              <span class="chip ${plein?'k':''}">${pin(4)} ${plein?'Profil sérieux':'Profil sérieux — non atteint'}</span>
              <span class="chip">${pct} / 100</span>
            </div>
            <div class="hr"></div>
            <div class="col gap6">
              ${[['Projet','Investissement locatif'],['Délai','moins de 3 mois'],
                 ['Budget', plein?'320 000 €':'non renseigné'],
                 ['Apport', plein?'45 000 €':'non renseigné'],
                 ['Financement', plein?'pré-accord bancaire':'non renseigné']]
                .map(([k,v])=>`<div class="row mid" style="justify-content:space-between">
                  <span class="sub">${k}</span>
                  <span class="num ${v.includes('non renseigné')?'sub':''}" style="${v.includes('non renseigné')?'':'font-weight:600'}">${nbsp(v)}</span></div>`).join('')}
            </div>
            <div class="hr"></div>
            <div class="sub">${plein
              ? 'Les agences répondent en priorité aux profils complets — délai moyen constaté : 4 h contre 8 h.'
              : 'Un profil incomplet reçoit une réponse, mais plus tard : les agences traitent d\'abord les dossiers renseignés.'}</div>
          </div>
        </div>
      </div>
    </div></div>`;
  }
});

add({id:'pro-leads', g:'P2 — Monétisation', n:'15', title:'Mes leads — tout est là, gratuitement',

    ['« Nouveau » côté agence = « Envoyée » côté acquéreur','les deux statuts sont les deux faces du même événement. Ouvrir le lead fait passer l’acquéreur à « Consultée par l’agence » sur sa page d’accueil — c’est la seule chose que nous savons vraiment, et elle est donc affichée des deux côtés à l’identique.'],

add({id:'pro-lead', g:'P2 — Monétisation', n:'14', title:'Fiche lead — la même, reçue ou achetée',

    const plein = st==='Tout est renseigné';

add({id:'pro-acheteurs', g:'P2 — Monétisation', n:'15', title:'Catalogue d\'acheteurs — la demande que vous ne voyiez pas',
  intro:"Le produit payant : des **acheteurs qui n'ont contacté personne** — inscrits, en recherche active, d'accord pour être proposés aux agences. Le flow est **une liste, point** : tous les acheteurs qui correspondent à vos biens en ligne, et des **filtres** pour la travailler — le bien, le budget, le financement, le projet. Venir d'une annonce pose le filtre « bien », rien d'autre ne change. L'achat multiple est une **sélection en place** — on coche, une barre fait le total **en crédits** et débite le solde ; s'il ne suffit pas, elle emmène au paywall (packs dès 150 crédits). Partout, la même règle d'or : assez pour donner envie, pas assez pour contourner le déblocage.",
  states:['Liste','Filtrée sur un bien','Sélection — 3','Sélection — 10 · solde insuffisant','Solde à 0','Alerte créée','Aucun résultat'],
  notes:[
    ['Une liste et des filtres — pas des vues','l’ancien flow multipliait les habillages du même contenu : groupé par bien, « depuis une annonce », recherche libre, puis un toggle Par bien / Tous. Il n’y a qu’un objet : la liste. Tout le reste est un filtre dans la même barre — posé, retiré, combiné. Le filtre « Bien » est un vrai menu : chacun de vos biens avec son nombre d’acheteurs, ou tous — un clic pour isoler la demande d’un mandat, un clic pour revenir à tout. On sait toujours où on est : au même endroit.'],
    ['Le panier est mort, vive la sélection','un panier persistant est un objet à gérer : il se remplit sur un écran, s’affiche en badge sur un autre, survit à la navigation — l’ancien proto montrait « Panier · 3 » sur une vue où rien ne permettait d’ajouter. La sélection vit dans la liste : on coche, la barre totalise, on paie, elle meurt. Aucun état à retrouver, un seul tunnel d’achat.'],
    ['Le prix est fixé par le profil — et ne s’affiche plus ligne par ligne','recherche seule = 20 crédits, financement seul = 30, les deux = 40, rien à configurer. Mais la liste n’affiche aucun prix : le tag de type et le score font juger le profil, la somme n’apparaît que là où elle compte — la barre de sélection, et le CTA de la fiche.'],
    ['Le solde décide, la barre le dit','si le solde couvre la sélection, on débloque en un clic — la carte ne sort pas. Sinon, la barre dit combien il manque et emmène au paywall : packs de crédits, 150 minimum. Jamais de surprise au moment de payer : le solde est affiché en permanence dans la nav.'],
    ['La règle d’or : avant / après achat','visible avant : critères, commune (jamais l’adresse), projet, score de sérieux, financement oui/non (jamais le montant), activité récente, combien d’agences l’ont acheté. Révélé après : nom, téléphone, email, message. Un seul champ de trop côté « avant » et l’achat se contourne ; un de moins et l’envie ne vient pas.'],
    ['Chaque ligne dit à quel bien elle correspond','la liste est à plat, mais la relation bien ↔ acheteur reste visible : chaque ligne porte l’annonce qui a déclenché le match. Le groupement n’était pas la seule façon de dire « 12 acheteurs pour ce bien » — le filtre bien et le compteur le disent mieux, sans dupliquer les vues. Et l’agence n’a toujours rien à configurer : ses annonces font le matching.'],
    ['L’argument mandat est affiché, pas sous-entendu','ces acheteurs servent à décrocher des mandats autant qu’à vendre : « j’ai déjà 12 acheteurs qualifiés pour votre bien » gagne le rendez-vous vendeur. C’est ce qui justifie le prix au-delà du lead — l’UI le dit en toutes lettres.'],
    ['La fraîcheur est honnête ou n’est pas','« actif il y a 2 h », « 2 agences l’ont acheté » : des chiffres réels, affichés tels quels. Jamais de compteur qui descend, jamais de « plus que 3 » — la première fausse urgence détruit toutes les vraies.'],
    ['Le score de sérieux s’explique d’un clic, partout','même doctrine que le score du bien : 4 composants pondérés, tous visibles, aucun modèle opaque. La pastille ouvre le détail — profil renseigné (35), recherche active (30), réactivité (20), constance (15) — avec ce que le score n’est PAS : une solvabilité.'],
    ['Chaque acheteur a dit oui','case jamais pré-cochée, révocable à tout moment, côté acquéreur. C’est une obligation légale stricte et la condition du modèle — l’écran de consentement est maquetté côté B2C (mise en relation, profil, paramètres).'],
    ['Le catalogue ne montre que le pas-encore-acheté','dès le paiement, les profils sortent du catalogue de cette agence et rejoignent « Mes leads » avec leur provenance — c’est là que la barre de sélection emmène après l’achat. Ce qui reste ici est donc toujours à acheter.'],
    ['Un solde à 0 ne cache rien','la liste reste entière, les aperçus restent ouverts, les contacts reçus restent gratuits — seul le déblocage attend. Le bandeau dit le solde, le chemin (packs dès 150) et le fait que les 40 crédits offerts sont passés. Masquer le catalogue à 0 crédit reviendrait à punir — on veut donner envie de recharger, pas frustrer.']
  ],
  render:(st)=>{
    const b0 = PRO_BIENS[0];
    const zero = st==='Solde à 0';
    const nav = appnav('Acheteurs','pro',AUTH,zero?0:SOLDE);

    /* ---- la sélection en place — l'état maquetté remplace le panier d'avant ----
       cocher depuis une vue calme → « Sélection — 3 » ; continuer à cocher → le lot.
       Décocher redescend. La sélection ne survit pas à l'achat : après paiement,
       les profils sont dans « Mes leads », la barre a disparu. */
    const selIds = st==='Sélection — 3' ? ['AC-118','AC-176','AC-052']
                 : st==='Sélection — 10 · solde insuffisant' ? ACHETEURS.map(a=>a.id) : [];
    const ck = a => {
      const on = selIds.includes(a.id);
      return {on, to: on
        ? (st==='Sélection — 10 · solde insuffisant' ? 'Sélection — 3' : 'Liste')
        : (st==='Sélection — 3' ? 'Sélection — 10 · solde insuffisant' : 'Sélection — 3')};
    };
    const unit = ACHETEURS.filter(a=>selIds.includes(a.id)).reduce((s,a)=>s+ACHPXN(a),0);
    const okSolde = unit<=SOLDE;
    const selbar = !selIds.length ? '' : `
      <div class="card selbar mt20"><div class="pad">
        <div class="row mid agrow" style="justify-content:space-between;gap:12px">
          <div style="min-width:0">
            <div class="txt" style="font-weight:600;color:var(--ink)">${selIds.length} acheteurs sélectionnés —
              <span class="num">${unit} crédits</span></div>
            <div class="sub">${pin(3)} Un prix par profil — 20 crédits sa recherche, 40 avec financement, rien à choisir.
              ${okSolde ? `${pin(4)} Votre solde : ${SOLDE} crédits — il vous en restera ${SOLDE-unit}.`
                        : `${pin(4)} Votre solde : ${SOLDE} crédits — il vous en manque ${unit-SOLDE}.`}</div>
          </div>
          <div class="row mid gap8 wrap" style="flex:none">
            <span class="linkish sub hot" onclick="setState('Liste')">Tout décocher</span>
            ${okSolde
              ? `<button class="btn hot" onclick="goState('pro-lead','Acheté au catalogue')">Débloquer les ${selIds.length} — ${unit} crédits</button>`
              : `<button class="btn hot" onclick="goState('pro-achat','Acheter des crédits')">Acheter des crédits — packs dès 150</button>`}
          </div>
        </div>
        <div class="sub" style="margin-top:8px">Recrédité si injoignable, acheteur par acheteur · les crédits
        n'expirent jamais · dès le déblocage, ils rejoignent « Mes leads » et sortent du catalogue.</div>
      </div></div>`;

    /* le même en-tête partout : titre + compteur + alerte. Pas de vues, pas de badge panier. */
    const header = `
      <div class="row mid" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div><h4 class="wt">Catalogue d'acheteurs${pin(1)}</h4>
          <div class="sub"><b class="num">${MATCHTOT}</b> acheteurs correspondent à vos biens en ligne ·
          aucun ne vous a contacté · l'identité après achat</div></div>
        <button class="btn sec2 hot" onclick="setState('Alerte créée')">Créer une alerte</button>
      </div>`;

    if (st==='Aucun résultat') return `${nav}
      <div class="sec">
        <h4 class="wt">Catalogue d'acheteurs</h4>
        <div class="sub">Vos filtres : Maison · Sainte-Foy-lès-Lyon · jusqu'à 300 000 €</div>
        <div class="card mt20"><div class="empty">
          <div class="ico"></div>
          <h5 class="wt">Aucun acheteur ne correspond à ces filtres aujourd'hui</h5>
          <p>Le catalogue bouge tous les jours : des acquéreurs s'inscrivent, précisent leur recherche,
          donnent leur accord. Plutôt que de revenir vérifier, laissez une alerte faire le travail.</p>
          <div class="row gap8">
            <button class="btn hot" onclick="setState('Alerte créée')">Me prévenir dès qu'un acheteur correspond</button>
            <button class="btn sec2 hot" onclick="setState('Liste')">Élargir mes filtres</button>
          </div>
          <div class="disc" style="margin-top:6px">Nous n'affichons que des acheteurs réels et
          consentants — jamais de profil de remplissage pour meubler une liste.</div>
        </div></div>
      </div>`;

    if (st==='Alerte créée') return `${nav}
      <div class="sec">
        <div class="row mid" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
          <div><h4 class="wt">Mes alertes acheteurs${pin(1)}</h4>
            <div class="sub">Prévenu dès qu'un acheteur correspond — achat en 1 clic depuis la notification.</div></div>
          <button class="btn sec2 hot" onclick="setState('Liste')">← Retour au catalogue</button>
        </div>
        <div class="bandeau mt20"><b>Alerte créée.</b> Dès qu'un acheteur correspondant à
        « T3 – T4 · Lyon 7ᵉ + 5 km · jusqu'à 350 000 € » rejoint le catalogue, vous recevez un email —
        avec son profil anonymisé et le bouton d'achat. Une alerte = un email, jamais une relance.</div>
        <div class="col gap8 mt14">
          ${[['T3 – T4 · Lyon 7ᵉ + 5 km · jusqu\'à 350 000 €','créée à l\'instant','k'],
             ['Immeubles · Lyon 9ᵉ · jusqu\'à 500 000 €','2 acheteurs signalés ce mois',''],
             ['Studios · Lyon 8ᵉ · financement renseigné','1 acheteur signalé ce mois','']]
            .map(([q,s,k])=>`
            <div class="card flat pad">
              <div class="row mid agrow" style="justify-content:space-between;gap:10px">
                <div style="min-width:0">
                  <div class="txt" style="font-weight:600;color:var(--ink)">${q}</div>
                  <div class="sub">${s}</div>
                </div>
                <div class="row mid gap8" style="flex:none">
                  <span class="chip ${k}">${k?'nouvelle':'active'}</span>
                  <span class="linkish sub">suspendre</span>
                </div>
              </div>
            </div>`).join('')}
        </div>
        <div class="card mt20">
          <div class="pad" style="border-bottom:1px solid var(--line-2)">
            <div class="row mid" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
              <h5 class="wt">À quoi ressemble la notification</h5>
              <span class="chip">aperçu de l'email</span>
            </div>
          </div>
          <div class="pad">
            <div class="card flat pad" style="background:var(--fill-2)">
              <div class="lbl">Un nouvel acheteur correspond à votre alerte</div>
              <div class="mt8">${acheteurRow(ACHETEURS[0])}</div>
              <div class="row gap8 mt8 wrap">
                <button class="btn sm hot" onclick="go('pro-achat')">Voir l'aperçu et acheter</button>
                <span class="sub">L'identité n'est révélée qu'après l'achat.</span>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    /* ---------- LA liste — le seul objet de l'écran. Tout le reste est un filtre. ----------
       « Filtrée sur un bien » = la même liste avec le filtre bien posé (l'entrée depuis
       une annonce ou le dashboard). Les états Sélection = la même liste avec des cases
       cochées : la barre totalise, et passe au lot à 10. */
    const filtre = st==='Filtrée sur un bien';
    /* le bien filtré effectif : l'état « Filtrée sur un bien » (entrée depuis une annonce)
       force le T3 ; sinon c'est le choix runtime du menu « Bien » (ACHBI). */
    const fbi = filtre ? 0 : ACHBI;
    const bsel = fbi!=null ? PRO_BIENS[fbi] : null;
    const liste = fbi!=null ? ACHETEURS.filter(a=>a.bi===fbi) : ACHETEURS;
    const bienDe = a => (PRO_BIENS[a.bi] && PRO_BIENS[a.bi].st!=='Vendu') ? PRO_BIENS[a.bi].t : null;
    return `${nav}
    <div class="sec">
      ${filtre?`<div class="row mid gap8 sub" style="margin-bottom:14px">
        <span class="linkish hot" onclick="goState('pro-bien','Disponible')">← Fiche du bien</span>
        <span>·</span><span>Ses acheteurs</span></div>`:''}
      ${header}
      <div class="fbar mt20">
        ${filtre
          ? `<span class="chip k hot" title="Retirer le filtre" onclick="setState('Liste')">Bien : ${b0.t} ✕</span>`
          : `<span class="chip ${fbi!=null?'k':''} hot" title="Filtrer par bien" onclick="POP.bienFiltre()">
              Bien : ${fbi!=null?bsel.t:'tous les vôtres'} ▾</span>
             ${fbi!=null?`<span class="chip hot" title="Retirer le filtre" onclick="ACHBI=null;setState('Liste')">✕</span>`:''}`}
        <span class="fsep"></span>
        ${['Budget maximum','Type de bien','Financement renseigné','Résidence principale','Investisseurs'].map(f=>`<span class="chip hot">${f}</span>`).join('')}
        <span class="fsep"></span>
        <button class="btn sec2 sm hot">Trier : activité récente ▾</button>
      </div>
      <div class="disc mt8">${fbi!=null
        ? `${pin(6)} ${bsel.match} acheteur${bsel.match>1?'s':''} correspond${bsel.match>1?'ent':''} à
          « ${bsel.t} » — type, budget, secteur — et aucun ne vous a contacté.
          <span class="linkish" onclick="${filtre?`setState('Liste')`:`ACHBI=null;setState('Liste')`}">Retirer le filtre</span>
          rend la liste entière, <span class="linkish" onclick="POP.bienFiltre()">le menu Bien</span> passe à un autre mandat.`
        : `${pin(1)} Une seule liste, les plus actifs d'abord — les filtres font le reste : un bien
          précis, un budget, un financement renseigné.`}
        ${zero?'':`${pin(2)} Cochez pour constituer une sélection : le total s'affiche en bas, l'aperçu reste à un clic.`}</div>

      ${zero?`<div class="bandeau mt14" style="border-left-width:4px">${pin(12)}
        <b>Votre solde est à 0 crédit.</b> La liste reste entière, les aperçus restent ouverts et
        vos contacts reçus restent gratuits — seul le déblocage attend une recharge.
        <div class="row mid gap8 mt8 wrap">
          <button class="btn sm hot" onclick="goState('pro-achat','Acheter des crédits')">Acheter des crédits — packs dès 150</button>
          <span class="sub">Vos 40 crédits offerts à l'inscription sont déjà passés en déblocages.</span>
        </div></div>`:''}

      <div class="col gap8 mt14">
        ${liste.map(a=>acheteurRow(a,true,zero?null:ck(a),fbi!=null?null:bienDe(a))).join('')}
      </div>
      ${fbi!=null?`<div class="bandeau mt14">${pin(7)} En rendez-vous mandat, ce chiffre est votre argument :
        « j'ai déjà ${bsel.match} acheteurs qualifiés pour votre bien ». C'est ce que ces profils
        valent au-delà du contact lui-même.</div>`:''}
      ${selbar}
      <div class="disc mt8">${pin(5)} Avant l'achat : critères, commune (jamais l'adresse), projet,
      score, financement oui / non, activité, agences l'ayant acheté. Après l'achat : nom, téléphone,
      email, message. ${pin(9)} Le score s'explique :
      <span class="linkish" onclick="POP.serieux()">appuyez sur une pastille, ou voyez le barème</span>.</div>
      <div class="disc mt8">${pin(10)} Chacun de ces acheteurs a coché lui-même la case « être contacté
      par des agences » — jamais pré-cochée, révocable à tout moment. Quand l'un la décoche, il sort
      du catalogue dans l'heure.</div>
      <div class="mt14">${rassurance()}</div>
    </div>`;
  }
});


add({id:'pro-achat', g:'P2 — Monétisation', n:'15', title:'Débloquer un acheteur — 20 / 30 / 40 crédits',
  intro:"Le déblocage se paie **en crédits, jamais en euros directs** : 20 crédits (recherche seule) · 30 (financement seul) · 40 (les deux). Si le solde couvre, un clic suffit — la carte ne sort pas. Sinon, **le paywall** : des packs de crédits, **150 minimum**, qui n'expirent jamais. Ce que l'agence débloque n'est pas une information sur un contact qu'elle a déjà — c'est un acquéreur qu'elle ne connaît pas, introuvable ailleurs. Les garanties — recrédité si injoignable, 40 crédits offerts à l'inscription, jamais débité deux fois — sont sur l'écran, pas dans les CGU.",
  states:['Aperçu anonymisé','Acheter des crédits','Paiement par carte','Identité révélée','Déjà acheté — jamais redébité'],
  notes:[
    ['Le type d’acheteur est le premier mot de la fiche','investissement locatif ou résidence principale — le tag le plus visible, en tête, et une phrase qui dit comment lui parler au premier appel. C’est l’information qui décide de l’achat et du discours, pas le tarif.'],
    ['Le nombre de crédits n’apparaît QUE dans le CTA','« Débloquer — 20 crédits · votre solde : 90 » : le prix et le solde au moment de l’action, nulle part ailleurs. L’ancien bloc « pourquoi 20 et pas 40 » centrait la fiche sur le tarif au lieu de l’acheteur — mauvais discours. La grille complète reste consultable au paywall et dans le profil.'],
    ['Aperçu anonymisé, jamais trompeur','visible : critères, commune, projet, score, financement oui/non, activité, agences l’ayant acheté. Masqué : nom, téléphone, email, message. Ce qui est montré est exact — un aperçu enjolivé se paie sur les trois premiers achats, et l’avatar agence juge sur l’échantillon.'],
    ['Le score porte son détail au moment de payer','c’est lui qui départage deux acheteurs au même prix — il doit donc s’ouvrir depuis l’aperçu : 4 composants pondérés, et la mention « pas une solvabilité » au même endroit. Le badge « Profil sérieux » d’un lead reçu suit le même barème (seuil 80) : une seule échelle, promise et tenue des deux côtés.'],
    ['« Sans abonnement » écrit noir sur blanc','c’est l’angoisse n°1 d’une agence échaudée. Elle vient de 1 040 €/mois payés d’avance à trois portails : le mot « abonnement » doit apparaître pour être nié.'],
    ['Le partage est dit AVANT le paiement, et il ne fait pas baisser le prix','« 2 agences l’ont déjà acheté » est affiché sur l’aperçu et dans le récapitulatif. Ce qu’elle achète est une information sur l’acheteur, pas une exclusivité sur lui — et ça ne se défend que si c’est écrit avant le bouton.'],
    ['Le doublon n’est jamais redébité','même acheteur déjà débloqué depuis un autre écran → on le dit et on ne débite rien. C’est le genre de détail qui achète plus de confiance que trois pages d’argumentaire.'],
    ['Le paywall est le seul écran carte','tout le reste se paie en crédits, sur le solde. La carte ne sort qu’ici : packs de 150, 400 ou 1000 crédits — 150 minimum, jamais d’expiration. Le second déblocage est donc plus rapide que le premier : un clic, zéro paiement.'],
    ['La révélation donne le contexte du premier appel','cet acheteur n’a pas contacté l’agence : l’écran d’après-achat rappelle d’où il vient et ce qu’il a accepté, pour que le premier appel ne ressemble jamais à du démarchage subi.'],
    ['Une fois débloqué, il devient un lead — et l’écran le dit','dès le débit, il rejoint « Mes leads » : mêmes statuts, même relance, provenance affichée. Il sort du catalogue de l’agence qui l’a débloqué (les autres agences le voient toujours — l’exclusivité ne se vend pas). C’est aussi ce qui rend « jamais débité deux fois » vérifiable : le registre des identités possédées, c’est la liste de leads elle-même.']
  ],
  render:(st)=>{
    const a = ACHETEURS[0];
    if (st==='Déjà acheté — jamais redébité') return `${appnav('Acheteurs','pro')}
      <div class="sec"><div style="max-width:640px;margin:0 auto">
        <div class="card"><div class="empty" style="padding:28px 22px">
          <div class="ico"></div>
          <h4 class="wt">Vous avez déjà cet acheteur${pin(5)}</h4>
          <p>Vous avez débloqué l'acheteur <b>${a.id}</b> le 24/07, depuis l'alerte « T3 – T4 · Lyon ».
          Il est déjà dans « Mes leads », avec vos autres contacts : aucun crédit n'est débité.</p>
          <div class="row gap8">
            <button class="btn hot" onclick="goState('pro-lead','Acheté au catalogue')">Ouvrir sa fiche dans Mes leads</button>
            <button class="btn sec2 hot" onclick="go('pro-acheteurs')">Retour au catalogue</button>
          </div>
          <div class="disc" style="margin-top:6px">Un même acheteur n'est jamais débité deux fois à la
          même agence — quel que soit l'écran d'où vous le débloquez : annonce, catalogue ou alerte.</div>
        </div></div>
      </div></div>`;

    if (st==='Identité révélée') return `${appnav('Acheteurs','pro')}
      <div class="sec"><div style="max-width:640px;margin:0 auto">
        <div class="card">
          <div class="pad" style="border-bottom:1px solid var(--line-2)">
            <div class="row mid stackm" style="justify-content:space-between;gap:12px">
              <div class="row mid gap8">
                <div class="avatar" style="width:40px;height:40px"></div>
                <div><div class="mid2">${a.nom}</div>
                  <div class="row mid gap6" style="margin-top:3px;flex-wrap:wrap">
                    <span class="chip">Téléphone vérifié par SMS</span>
                    ${serieuxChip(a)}
                  </div></div>
              </div>
              <span class="chip k" style="flex:none">débloqué — 20 crédits · solde restant : ${SOLDE-20}</span>
            </div>
          </div>
          <div class="pad" style="border-bottom:1px solid var(--line-2)">
            <div class="col gap6">
              ${[['Téléphone','06 51 20 84 03'],['Email','claire.f@…'],
                 ['Sa recherche', a.crit],['Secteur', a.zone+' et alentours'],['Projet', a.projet]]
                .map(([k,v])=>`<div class="row mid" style="justify-content:space-between;gap:10px">
                  <span class="lbl">${k}</span><span class="num" style="font-weight:600;text-align:right">${nbsp(v)}</span></div>`).join('')}
            </div>

          <div class="pad">

            <div class="row gap8 mt14 wrap">
              <button class="btn hot">Appeler</button>
              <button class="btn sec2 hot" onclick="goState('pro-lead','Acheté au catalogue')">Sa fiche dans Mes leads</button>
              <button class="btn sec2 hot" onclick="go('pro-acheteurs')">Retour au catalogue</button>
            </div>
            <div class="disc mt8">${a.nom} a rejoint <b>« Mes leads »</b>, avec vos autres contacts —
            mêmes statuts, même relance, sa provenance affichée. Elle est sortie de votre catalogue.
            Injoignable après plusieurs tentatives ? Recréditée depuis sa fiche, sans justification
            à fournir.</div>
          </div>
        </div>
      </div></div>`;

    /* ---------- le paywall — on y arrive quand le solde ne couvre pas le déblocage,
       ou volontairement depuis le profil / la nav. 150 crédits minimum. ---------- */
    if (st==='Acheter des crédits') return `${appnav('Acheteurs','pro')}
      <div class="sec"><div style="max-width:600px;margin:0 auto">
        <div class="row mid gap8 sub" style="margin-bottom:14px">
          <span class="linkish hot" onclick="goState('pro-acheteurs','Sélection — 10 · solde insuffisant')">← Ma sélection</span>
          <span>·</span><span>Acheter des crédits</span></div>
        ${paywallCredits({t:'Votre sélection : 10 acheteurs — 340 crédits',
          s:'votre solde : '+SOLDE+' crédits', manque:340-SOLDE}, "setState('Paiement par carte')")}
        <div class="disc mt8">${pin(7)} La carte ne sort qu'ici. Les déblocages, eux, se paient
        toujours sur le solde — le second est un clic, zéro paiement.</div>
        <div class="mt14">${rassurance()}</div>
      </div></div>`;

    /* ---------- l'étape carte — choix du pack fait, on paie ---------- */
    if (st==='Paiement par carte') return `${appnav('Acheteurs','pro')}
      <div class="sec"><div style="max-width:600px;margin:0 auto">
        <div class="row mid gap8 sub" style="margin-bottom:14px">
          <span class="linkish hot" onclick="setState('Acheter des crédits')">← Packs de crédits</span>
          <span>·</span><span>Paiement</span></div>
        ${carteCredits("goState('pro-lead','Acheté au catalogue')")}
        <div class="disc mt8">Payé : votre sélection se débloque immédiatement — les profils
        rejoignent « Mes leads », et le reste du pack alimente votre solde.</div>
      </div></div>`;

    return `${appnav('Acheteurs','pro')}
      <div class="sec"><div style="max-width:760px;margin:0 auto">
        <div class="card">
          <div class="pad" style="border-bottom:1px solid var(--line-2)">
            <div class="row mid" style="justify-content:space-between;flex-wrap:wrap;gap:8px">

                <div class="row mid gap6 mt8 wrap"><span class="chip o">${pin(4)} 2 agences l'ont déjà acheté</span>

            </div>
          </div>
          <div class="pad" style="border-bottom:1px solid var(--line-2)">
            <div class="row mid" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
              <div class="lbl">${pin(2)} Ce que vous voyez avant d'acheter</div>

            </div>
            <div class="grid2 mt8">
              ${[['Projet',a.projet],['Sa recherche',a.crit],
                 ['Secteur',a.zone+' — jamais l\'adresse'],['Score de sérieux',a.score+' / 100'],
                 ['Financement','non renseigné'],['Activité',a.actif]]
                .map(([k,v])=>{const sc=k==='Score de sérieux';return `
                  <div class="card flat pad ${sc?'hot':''}" ${sc?`onclick="POP.serieux('${a.id}')" title="Voir le détail du score"`:''}>
                  <div class="lbl">${k}</div>
                  <div class="num" style="font-weight:600;margin-top:3px">${nbsp(v)}${sc?' <span class="more">détail</span>':''}</div></div>`}).join('')}
            </div>
          </div>
          <div class="pad">
            <div class="row mid" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
              <div class="lbl">${pin(2)} Ce que l'achat révèle</div>
              <span class="chip">après paiement seulement</span>
            </div>
            <div class="grid2 mt8">
              ${[['Nom et prénom','•••••'],['Téléphone','•••••'],
                 ['Email','•••••'],['Son message éventuel','•••••']]
                .map(([k,v])=>`<div class="card flat pad" style="background:var(--fill)">
                  <div class="lbl">${k}</div>
                  <div class="num" style="font-weight:600;margin-top:3px;letter-spacing:2px;color:var(--ink-3)">${nbsp(v)}</div></div>`).join('')}
            </div>
            <div class="disc mt8">${a.id} n'a pas rempli le volet financement : sa fiche s'arrête à

            <div class="bandeau mt20">${pin(1)} <b>${a.projet}.</b> ${a.projet==='Investissement locatif'
              ? 'Cet acquéreur cherche du rendement — surface, loyer potentiel, charges, fiscalité. Le premier appel parle chiffres, pas coup de cœur.'
              : 'Cet acquéreur cherche à habiter — quartier, lumière, délai d\'emménagement. Le premier appel parle projet de vie, pas rendement.'}</div>

            <button class="btn full mt20 hot" onclick="setState('Identité révélée')">Débloquer — 20 crédits · votre solde : ${SOLDE}</button>
            <div class="sub" style="text-align:center;margin-top:10px">${pin(3)} Débité sur votre solde, aucun abonnement —
              <span class="more" onclick="setState('Acheter des crédits')">acheter des crédits</span></div>
            <div class="mt14">${rassurance()}</div>
          </div>
        </div>
      </div></div>`;
  }
});

add({id:'pro-profil', g:'P2 — Monétisation', n:'16', title:'Profil de l\'agence — compte, équipe & crédits',
  intro:"L'écran compte, qui n'existait pas — et qui devient stratégique avec les crédits : c'est **la deuxième porte d'achat** (la première est le paywall, quand un déblocage dépasse le solde). Le bloc Crédits dit trois choses : le solde, le registre des mouvements (chaque débit renvoie à sa fiche lead), et le bouton d'achat. Autour : l'identité de l'agence telle que les acquéreurs la voient, l'équipe, le moyen de paiement, les notifications, la sécurité. Rien d'exotique — un compte propre est un argument de confiance.",
  states:['Profil','Acheter des crédits','Paiement par carte'],
  notes:[
    ['Le solde vit à deux endroits, le registre à un seul','dans la nav (toujours visible, cliquable) et ici. Le registre des débits n\'est QUE dans le profil : chaque ligne renvoie à la fiche du lead débloqué — jamais dans les factures, où des références d\'acheteurs n\'ont rien à faire.'],
    ['Acheter des crédits sans être au pied du mur','le paywall arrive quand le solde ne couvre pas un déblocage — un moment de friction. Le profil offre l\'achat calme : une agence qui recharge en début de mois n\'a plus jamais de friction au moment du déblocage, et c\'est exactement le comportement qu\'on veut installer.'],
    ['Les crédits n\'expirent jamais, écrit là où on les achète','un solde qui expire est une pénalité déguisée — la promesse est répétée sur le bloc, sur le paywall, et dans les garanties.'],
    ['L\'identité affichée est celle que voient les acquéreurs','raison sociale, zone, logo : les mêmes données qui habillent la page agence côté B2C. Modifier ici = modifié partout ; il n\'y a pas deux vérités.'],
    ['Le SIRET vérifié ne se re-vérifie pas','il a été contrôlé à l\'inscription (INSEE) ; le profil l\'affiche verrouillé avec sa date de vérification. Changer de SIRET = nouveau compte, pas une édition de champ.'],
    ['La fermeture du compte est à un clic visible','avec le sort des crédits écrit noir sur blanc : le solde restant est remboursé au prix d\'achat. Une sortie propre est un argument d\'entrée.']
  ],
  render:(st)=>{
    if (st==='Acheter des crédits') return `${appnav('','pro')}
      <div class="sec"><div style="max-width:600px;margin:0 auto">
        <div class="row mid gap8 sub" style="margin-bottom:14px">
          <span class="linkish hot" onclick="setState('Profil')">← Profil de l'agence</span>

/* =======================================================================
   RUNTIME PROTOTYPE
   ======================================================================= */
let cur = 0, state = null;

   conditionne les cartes, les fiches et les estimations */

function setMode(m){ MODE = m; show(cur, true); }

function setSide(t){ SIDETAB = t; show(cur, true); }

/* panneau latéral droit favoris & recherches */
