function setAuth(a){ AUTH = a; HASQ = (a==='in'); PANEL = false; show(cur, true); }

/* Destinataires de la demande de mise en relation.
   La demande part à TOUTES les agences qui détiennent un mandat sur le bien —
   l'acquéreur décoche celles qu'il ne veut pas solliciter, il n'en coche aucune.
   Décocher est un geste, cocher n'en est pas un : le défaut doit être le cas utile. */
let LEADAGS = null;   // Set d'index dans BIENS[0].ags ; null = pas encore initialisé
function leadAgs(){
  if (!LEADAGS) LEADAGS = new Set(BIENS[0].ags.map((_,i)=>i));
  return LEADAGS;
}
function toggleLeadAg(i){
  const s = leadAgs();
  /* on ne peut pas tout décocher : une demande sans destinataire n'est pas une demande.
     La dernière case cochée se verrouille plutôt que d'échouer au moment de l'envoi. */
  if (s.has(i)) { if (s.size > 1) s.delete(i); } else s.add(i);
  show(cur, true);
}
function leadAgList(){ return BIENS[0].ags.filter((_,i)=>leadAgs().has(i)); }

/* Consentement catalogue d'acheteurs — JAMAIS pré-coché, révocable (paramètres).
   Distinct de l'envoi de la demande : deux consentements, deux cases, deux moments. */
let OPTIN = false;
function toggleOptin(){ OPTIN = !OPTIN; show(cur, true); }

/* L'OTP sert deux entrées : la création de compte classique, et la fin du tunnel de
   mise en relation d'un visiteur. Le drapeau dit d'où l'on vient — il change le fil
   d'Ariane et la sortie, pas l'écran. */
let FROMLEAD = false;
function otpFromLead(){ FROMLEAD = true; go('otp'); }
function sendFromOtp(){ FROMLEAD = false; AUTH = 'in'; HASQ = true; goState('lead2','Demande envoyée'); }

/* ---- moteur de la localisation ----
   Le rayon appartient à la zone. Le compte de biens doit rester honnête : deux zones qui se
   recouvrent ne s'additionnent pas, sinon on annonce un stock qu'on n'a pas. */
let LQ = '', LCARET = null;
function zoneCount(nom, type, km){
  const base = (LIEUX.find(l=>l[0]===nom)||[,,,0])[3];
  if (!km || type==='dep') return base;
  if (nom==='Lyon 7ᵉ' && RAYON_EFFET[km]) return RAYON_EFFET[km][1];
  return Math.round(base * (1 + km*0.35));
}
/* le seul chevauchement du jeu de données : Villeurbanne tombe dans Lyon 7ᵉ + 5 km */
function zonesChevauchent(){
  const l7 = ZONES.find(z=>z[0]==='Lyon 7ᵉ');
  return !!(l7 && l7[2] >= 5 && ZONES.some(z=>z[0]==='Villeurbanne'));
}
function zonesTotal(){
  let t = ZONES.reduce((a,[n,ty,km])=>a+zoneCount(n,ty,km), 0);
  if (zonesChevauchent()) t -= zoneCount('Villeurbanne','com',0);
  return t;
}
/* ---- le champ « Où » : lire ce qui est tapé, sans casser la saisie ----
   Deux corrections tenues ensemble parce qu'elles ont la même cause.

   1) La GRAPHIE. Le référentiel écrit « Lyon 7ᵉ » avec un exposant qu'aucun clavier ne
      produit, et le placeholder le propose en exemple. Un includes() brut renvoyait donc
      zéro sur « Lyon 7e », « Lyon 7ème », « Merignac », « Rhone », « Jean Mace » — zéro
      résultat sur le seul champ dont le produit dit qu'il est un préalable. On normalise
      des DEUX côtés avec DEACC, la même fonction qui lit la phrase de « Décrire » : un
      seul comportement à expliquer, valable dans les deux modes de recherche.

   2) La SAISIE. Redessiner toute la feuille à chaque frappe détruisait le champ et le
      recréait : le focus tombait sur le body pendant 30 ms et le curseur était replacé de
      force en fin de chaîne. Corriger « Villuerbanne » en milieu de mot devenait
      impossible, et sur mobile le clavier clignotait à chaque lettre. On ne redessine
      donc plus que la LISTE, dans un conteneur stable — le champ n'est jamais touché.
      Seul le passage vide ⇄ non-vide redessine la feuille, parce que la liste change
      alors de place (les résultats passent au-dessus des zones) et que « effacer »
      apparaît. Une fois par requête, pas une fois par lettre. */
/* « Lyon7 » collé est la même intention que « Lyon 7 ». On sépare lettre et chiffre — mais
   ici seulement : le parseur de « Décrire » a besoin de lire « T3 » d'un bloc. */
const DEACC_LIEU = s => DEACC(s).replace(/([a-z])(\d)/g,'$1 $2');
function locResultats(){
  const q = DEACC_LIEU(LQ.trim());
  const dispo = LIEUX.filter(([n,t,p2]) => !q || DEACC_LIEU(n).includes(q) || DEACC_LIEU(p2).includes(q));
  const groupes = LORDRE.map(t => [t, dispo.filter(l=>l[1]===t)]).filter(([,l])=>l.length);
  return `
    <div class="lbl" style="margin:18px 0 7px">${LQ?`Résultats pour « ${LQ} »`:'Les plus cherchés'}</div>
    ${groupes.length ? groupes.map(([t,items])=>`
      <div style="margin-bottom:14px">
        <div class="sub" style="margin-bottom:4px">${LTYPE[t]}${items.length>1?'s':''}</div>
        <div class="col" style="gap:2px">
          ${items.map(([n,tt,par,nb])=>{
            const deja = ZONES.some(z=>z[0]===n);
            return `<div class="rrow ${deja?'':'hot'}" style="justify-content:space-between"
              ${deja?'':`role="button" tabindex="0" onclick="zoneAdd('${n}','${tt}')"
                         onkeydown="kbd(event,()=>zoneAdd('${n}','${tt}'))"`}>
              <div style="min-width:0"><span class="txt" style="font-weight:${deja?'400':'600'};color:var(--ink)">${n}</span>
                <span class="sub"> · ${par}</span></div>
              <div class="row mid gap8" style="flex:none">
                <span class="sub num">${nbsp(nb+' biens')}</span>
                ${deja?'<span class="chip k">retenue</span>':'<span class="linkish sub">ajouter</span>'}
              </div></div>`;}).join('')}
        </div>
      </div>`).join('')
    : `<div class="card flat pad"><div class="sub">Aucun lieu ne correspond à « ${LQ} ».
        Vérifiez l'orthographe, ou cherchez la commune plutôt que le quartier.</div></div>`}`;
}
function locSaisie(el){
  const avant = !!LQ.trim();
  LQ = el.value;
  const box = document.getElementById('locres');
  /* la liste change de place quand la requête apparaît ou disparaît : là, et là seulement,
     on redessine la feuille entière */
  if (avant !== !!LQ.trim() || !box){ LCARET = el.selectionStart; return POP.localisation(); }
  box.innerHTML = locResultats();
}

/* le format courant, tel que le CSS le voit — les deux doivent dire la même chose */
const MOBILE = () => document.body.classList.contains('mobile');
/* la rangée de critères, dépliée ou plafonnée (mobile uniquement) */
let CRITOUV = false;
function critOuvrir(v){ CRITOUV = !!v; show(cur, true); }

/* quelle zone montre sa rangée de rayons — une seule à la fois, refermée après le choix */
let ZOPEN = null;
function zoneOuvrir(i){ ZOPEN = (ZOPEN===i ? null : i); POP.localisation(); }
function zoneAdd(nom, type){ if(!ZONES.some(z=>z[0]===nom)) ZONES.push([nom,type,0]);
  ZOPEN = null; PAGE = 1; show(cur, true); POP.localisation(); }
function zoneDel(i){ ZONES.splice(i,1); PAGE = 1; show(cur, true); POP.localisation(); }
function zoneRayon(i, km, surPlace){ ZONES[i][2] = km; ZOPEN = null; PAGE = 1; show(cur, true);
  if (!surPlace) POP.localisation(); }
/* le libellé qui s'affiche partout ailleurs — nav, filtres, recherches sauvegardées */
function zonesLbl(){
  if (!ZONES.length) return '';
  const [n,,km] = ZONES[0];
  const t = n + (km?` +${km} km`:'');
  return ZONES.length>1 ? `${t} +${ZONES.length-1}` : t;
}

/* ---- moteur des critères ----
   Un seul objet porte toute la recherche. Les quatre surfaces qui la donnent à voir — la barre
   de nav, la feuille « ma recherche », « tous les filtres » et la ligne de critères au-dessus
   des résultats — lisent et écrivent ici. C'est ce qui garantit qu'un critère retiré dans la
   barre disparaisse aussi de la feuille, et qu'un compteur ne raconte pas deux histoires selon
   l'écran où on le lit : chaque surface portait ses valeurs en dur, elles se contredisaient. */
const CRIT0 = () => ({
  budget:'300 000 €', rdt:'4 %',                 /* J'investis */
  mens:'1 300 €/mois', apport:'45 000 €',        /* J'habite   */
  types:['Appartement','Immeuble'], pieces:['T2','T3'], chambres:[],
  surfMin:'40 m²', surfMax:'', dpe:'D', equip:['Balcon ou terrasse'],
  ecart:[], expo:[], etat:[], score:'Tous', montage:[], usage:[],
  ligne:'Peu importe', mouvement:'Peu importe', statut:'Disponible',
  mandats:'Peu importe', source:'Peu importe', photos:'Peu importe'
});
const CRIT_VIDE = () => Object.fromEntries(Object.entries(CRIT0()).map(([k,v])=>
  [k, Array.isArray(v) ? [] : (['score','ligne','mouvement','statut','mandats','source','photos'].includes(k) ? (k==='score'?'Tous':'Peu importe') : '')]));
let CRIT = CRIT0();

/* Les critères multiples sont des listes : cliquer une pastille ajoute ou retire, jamais ne
   remplace. Les critères uniques (DPE minimum, statut) se re-cliquent pour être annulés —
   sinon on ne peut plus revenir en arrière sans rouvrir un autre écran. */
function critHas(k, v){ const c = CRIT[k]; return Array.isArray(c) ? c.includes(v) : c===v; }
function critToggle(k, v, redraw){
  const c = CRIT[k];
  if (Array.isArray(c)){ const i = c.indexOf(v); i<0 ? c.push(v) : c.splice(i,1); }
  else CRIT[k] = (c===v) ? '' : v;
  critRedraw(redraw);
}
function critSet(k, v, redraw){ CRIT[k] = v; critRedraw(redraw); }
/* les champs libres ne doivent pas re-rendre à chaque frappe — le curseur sauterait */
function critInput(k, v){ CRIT[k] = v.trim(); }
function critRedraw(which){
  /* relâcher un critère depuis l'écran « aucun résultat » doit ramener la liste : rester sur
     le vide après avoir accepté l'assouplissement qu'on venait de nous proposer serait une
     impasse — et le chiffre annoncé sur la pastille resterait invérifiable. */
  if (S[cur].id === 'recherche' && state === 'Aucun résultat' && ZONES.length && biensFiltres().length)
    state = 'Résultats';
  /* toucher un critère fait de la recherche affichée une autre recherche que celle qu'on a
     enregistrée : le bouton doit redevenir une proposition, pas un constat. */
  RECH_ENR = false;
  show(cur, true);
  if (which && POP[which]) POP[which]();
}

/* Les critères actifs, sous la forme où ils sont lus ET retirés : libellé, clé de retrait.
   Source unique pour la ligne de pastilles au-dessus des résultats, pour le compteur, et pour
   le nombre porté par « ⚙ Ma recherche ». */
function critActifs(){
  const home = MODE==='home', a = [];
  ZONES.forEach(([n,,km],i)=> a.push([`${n}${km?` +${km} km`:''}`, 'zone:'+i]));
  if (home){ if (CRIT.mens) a.push([nbsp('≤ '+CRIT.mens), 'mens']); }
  else {
    if (CRIT.budget) a.push([nbsp('≤ '+CRIT.budget), 'budget']);
    if (CRIT.rdt)    a.push([nbsp('Rendement ≥ '+CRIT.rdt), 'rdt']);
  }
  if (CRIT.pieces.length)  a.push([CRIT.pieces.join(' · '), 'pieces']);
  if (CRIT.types.length && CRIT.types.length < 6) a.push([CRIT.types.join(' · '), 'types']);
  if (CRIT.chambres.length) a.push([CRIT.chambres.join(' · ')+' ch.', 'chambres']);
  if (CRIT.surfMin) a.push([nbsp('≥ '+CRIT.surfMin), 'surfMin']);
  if (CRIT.surfMax) a.push([nbsp('≤ '+CRIT.surfMax), 'surfMax']);
  if (CRIT.dpe)     a.push(['DPE ≥ '+CRIT.dpe, 'dpe']);
  CRIT.equip.forEach(e=> a.push([e, 'equip:'+e]));
  CRIT.montage.forEach(e=> a.push([e, 'montage:'+e]));
  CRIT.usage.forEach(e=> a.push([e, 'usage:'+e]));
  return a;
}
/* Retirer un critère est un geste, pas une navigation : la pastille disparaît sur place. */
function critRetirer(k){
  if (k.startsWith('zone:')) { ZONES.splice(+k.slice(5), 1); return critRedraw(); }
  const [key, val] = k.split(':');
  if (val != null) { const i = CRIT[key].indexOf(val); if (i>=0) CRIT[key].splice(i,1); }
  else CRIT[key] = Array.isArray(CRIT[key]) ? [] : '';
  critRedraw();
}
/* « tout effacer » efface aussi les zones : garder la zone en effaçant le reste laisserait
   une recherche à moitié vide qui n'est ni l'ancienne ni une nouvelle. Sans zone, l'écran
   bascule de lui-même sur l'état qui pose la seule question qui reste. */
function critEffacerTout(){ CRIT = CRIT_VIDE(); ZONES = []; critRedraw(); }
function critReset(which){ CRIT = CRIT0(); critRedraw(which); }

/* Ce que les critères coûtent en stock. Le prototype n'a pas de moteur de recherche : plutôt
   qu'un nombre en dur qui contredit celui de l'écran voisin, chaque critère porte le facteur
   de réduction qu'il applique au stock des zones. Le chiffre reste une simulation — mais il
   est le MÊME partout, et il bouge quand on touche un critère. C'est tout ce qu'on lui demande.
   Réglé pour retomber sur les 41 biens de la recherche enregistrée de référence. */
const CRIT_COUT = {budget:.45, mens:.45, rdt:.58, types:.72, pieces:.62, chambres:.80,
                   surfMin:.78, surfMax:.90, dpe:.65, equip:.45, montage:.55, usage:.60};
function resultCount(){
  if (!ZONES.length) return 0;
  let n = zonesTotal();
  critActifs().forEach(([,k])=>{
    const key = k.split(':')[0];
    if (key !== 'zone') n *= (CRIT_COUT[key] ?? .85);
  });
  return Math.max(0, Math.round(n));
}
/* ce qu'un critère rendrait s'il était relâché — l'état « aucun résultat » chiffre ses
   propositions au lieu de conseiller « élargissez vos critères » */
function critGain(k){
  const key = k.split(':')[0], f = CRIT_COUT[key] ?? .85;
  return Math.max(1, Math.round(resultCount() * (1/f - 1)));
}

/* ---- ce que la zone couvre réellement ----
   Le rayon n'est pas décoratif : « Lyon 7ᵉ + 5 km » doit faire entrer Lyon 3ᵉ, Lyon 8ᵉ et
   Villeurbanne dans la liste, exactement comme l'annonce l'encart de la feuille de zones.
   Même table que RAYON_EFFET, vue depuis les biens. */
const COUVRE = {
  'Lyon 7ᵉ':      {2:['Lyon 3ᵉ','Jean Macé','Guillotière'],
                   5:['Lyon 3ᵉ','Lyon 8ᵉ','Villeurbanne','Jean Macé','Guillotière'],
                   10:['Lyon 3ᵉ','Lyon 8ᵉ','Lyon','Villeurbanne','Jean Macé','Guillotière'],
                   20:['Lyon 3ᵉ','Lyon 8ᵉ','Lyon','Villeurbanne','Jean Macé','Guillotière']},
  'Villeurbanne': {2:['Lyon 3ᵉ'], 5:['Lyon 3ᵉ','Lyon 6ᵉ'],
                   10:['Lyon 3ᵉ','Lyon 6ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Lyon'],
                   20:['Lyon 3ᵉ','Lyon 6ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Lyon']},
  'Lyon 3ᵉ':      {2:['Lyon 7ᵉ','Villeurbanne'], 5:['Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne'],
                   10:['Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne','Lyon'], 20:['Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne','Lyon']},
  'Lyon 8ᵉ':      {2:['Lyon 7ᵉ'], 5:['Lyon 7ᵉ','Lyon 3ᵉ'], 10:['Lyon 7ᵉ','Lyon 3ᵉ','Villeurbanne','Lyon'],
                   20:['Lyon 7ᵉ','Lyon 3ᵉ','Villeurbanne','Lyon']},
  'Lyon':         {0:['Lyon 3ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Jean Macé','Guillotière'],
                   2:['Lyon 3ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne','Jean Macé','Guillotière'],
                   5:['Lyon 3ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne','Jean Macé','Guillotière'],
                   10:['Lyon 3ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne','Jean Macé','Guillotière'],
                   20:['Lyon 3ᵉ','Lyon 7ᵉ','Lyon 8ᵉ','Villeurbanne','Jean Macé','Guillotière']},
  'Jean Macé':    {2:['Lyon 7ᵉ'], 5:['Lyon 7ᵉ','Guillotière'], 10:['Lyon 7ᵉ','Lyon 3ᵉ','Guillotière'],
                   20:['Lyon 7ᵉ','Lyon 3ᵉ','Lyon 8ᵉ','Guillotière','Villeurbanne']},
  'Guillotière':  {2:['Lyon 7ᵉ'], 5:['Lyon 7ᵉ','Jean Macé'], 10:['Lyon 7ᵉ','Lyon 3ᵉ','Jean Macé'],
                   20:['Lyon 7ᵉ','Lyon 3ᵉ','Lyon 8ᵉ','Jean Macé','Villeurbanne']}
};
function zoneCouvre(nom, km){
  const t = COUVRE[nom] || {};
  const paliers = Object.keys(t).map(Number).filter(k => k <= km).sort((a,b)=>a-b);
  return [nom].concat(paliers.length ? t[paliers[paliers.length-1]] : []);
}
function bienDansZones(b){
  return ZONES.some(([n,t,km]) =>
    t === 'dep' ? b.f.dep === n : zoneCouvre(n, km).includes(b.f.z));
}

/* ---- filtrage ----
   Un critère ne masque jamais un bien faute de donnée : le rendement absent d'une maison
   non estimable ne la fait pas disparaître d'une recherche « rendement ≥ 4 % » si l'on ne
   sait pas le calculer. On exclut sur une valeur connue, jamais sur un trou. */
const DPE_ORDRE = 'ABCDEFG';
function bienPasse(b){
  const f = b.f, home = MODE === 'home';
  /* sans zone, aucune liste : la règle « pas de résultats au hasard » vaut aussi ici,
     sinon l'écran vide et le moteur se contrediraient en coulisse. */
  if (!ZONES.length || !bienDansZones(b)) return false;
  if (home){ if (CRIT.mens && f.mens > eur(CRIT.mens)) return false; }
  else {
    if (CRIT.budget && f.prix > eur(CRIT.budget)) return false;
    if (CRIT.rdt && f.rdt > 0 && f.rdt < parseFloat(CRIT.rdt.replace(',','.'))) return false;
  }
  if (CRIT.types.length  && !CRIT.types.includes(f.type)) return false;
  const PIECABLE = ['Appartement','Maison'];
  if (CRIT.pieces.length && PIECABLE.includes(f.type) && !CRIT.pieces.includes(f.pc)) return false;
  if (CRIT.chambres.length && !CRIT.chambres.some(c => f.ch >= parseInt(c))) return false;
  if (CRIT.surfMin && f.surf < eur(CRIT.surfMin)) return false;
  if (CRIT.surfMax && f.surf > eur(CRIT.surfMax)) return false;
  if (CRIT.dpe && DPE_ORDRE.indexOf(b.dpe) > DPE_ORDRE.indexOf(CRIT.dpe)) return false;
  if (CRIT.equip.length && !CRIT.equip.every(e => f.eq.includes(e))) return false;
  if (CRIT.montage.includes('Immeuble de rapport') && f.type !== 'Immeuble') return false;
  if (CRIT.montage.includes('Cash-flow positif') && !String(b.cf).startsWith('+')) return false;
  if (CRIT.photos === 'Avec photo' && !b.photo) return false;
  return true;
}

/* ---- tri ----
   Le tri par défaut est le score, parce que c'est le seul classement que nous produisons et
   que personne ne peut acheter. Les biens non notés vont en fin de liste sur ce tri, jamais
   masqués : un marché peu liquide n'est pas un mauvais bien. */
let TRI = 'Score décroissant';
function setTri(t){ TRI = t; PAGE = 1; closePop(); show(cur, true); }
const num = v => parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
function trierBiens(l){
  const sc = b => b.sc === '—' ? -1 : num(b.sc);
  const c = {
    'Score décroissant':      (a,b) => sc(b) - sc(a),
    'Rendement décroissant':  (a,b) => b.f.rdt - a.f.rdt,
    'Mensualité croissante':  (a,b) => a.f.mens - b.f.mens,
    'Prix croissant':         (a,b) => a.f.prix - b.f.prix,
    'Prix au m² croissant':   (a,b) => num(a.m2) - num(b.m2),
    "Nouveautés d'abord":     (a,b) => num(a.age) - num(b.age),
    'Baisse de prix récente': (a,b) => num(b.dv) - num(a.dv),
    "Ancienneté de l'annonce":(a,b) => num(b.age) - num(a.age)
  }[TRI];
  return c ? [...l].sort(c) : l;
}

/* ---- pagination ----
   Le compteur annonce le stock de la recherche, la page montre ce que le prototype possède.
   Les deux se rejoignent sur le nombre de pages, qui est celui du stock — sinon « 41 biens »
   au-dessus d'une pagination à une seule page se contredit à l'écran. */
let PAGE = 1;
const PARPAGE = 6;
function setPage(p){ PAGE = p; show(cur, true);
  window.scrollTo({top:0, behavior:'smooth'}); }
function biensFiltres(){ return trierBiens(BIENS.filter(bienPasse)); }
function nbPages(){ return Math.max(1, Math.ceil(resultCount() / PARPAGE)); }

/* ---- favoris ----
   F-018 : on met en favori depuis la liste, sans ouvrir la fiche. C'est le geste de tri le
   plus fréquent d'une session — il ne peut pas coûter une navigation. */
let FAVS = new Set([0, 1, 2]);
function favToggle(i){
  FAVS.has(i) ? FAVS.delete(i) : FAVS.add(i);
  show(cur, true);
}

/* ---- accessibilité des pastilles ----
   Une pastille est un bouton : elle en a le curseur, elle doit en avoir le clavier.
   Espace et Entrée déclenchent, comme sur un <button>. */
function kbd(e, fn){
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); }
}

/* Le prototype marque d'un `.hot` tout ce qui réagit au clic. Ce qui réagit au clic doit
   réagir au clavier : plutôt que d'ajouter un rôle et un gestionnaire sur chacun des ~160
   éléments concernés, on les promeut en une passe après chaque rendu. Un élément déjà
   bouton, lien ou champ est laissé tel quel — il a déjà ce qu'il faut. */
function clavierPourLesCliquables(racine){
  racine.querySelectorAll('[onclick]').forEach(el=>{
    /* le voile de fermeture n'est pas une commande : il double la croix, il ne se tabule pas */
    if (el.classList.contains('pscrim')) return;
    if (['A','BUTTON','INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return;
    if (el.hasAttribute('role') && el.tabIndex === 0) return;
    if (!el.hasAttribute('role')) el.setAttribute('role','button');
    if (el.tabIndex !== 0) el.tabIndex = 0;
    if (!el.dataset.kb){
      el.dataset.kb = '1';
      el.addEventListener('keydown', e => {
        if (e.target !== el) return;
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); }
      });
    }
  });
}

/* ---- reprendre une recherche ----
   Une recherche enregistrée qu'on rouvre doit reposer ses critères, sinon l'historique n'est
   qu'une liste de titres. On relit la phrase enregistrée — c'est la seule description qu'on
   ait d'elle — et on repose ce qu'on sait en lire. */
function critAppliquer(i){
  const r = RECENTES[i]; if (!r) return;
  MODE = r.mode; CRIT = CRIT_VIDE(); PAGE = 1;
  const q = r.q;
  const zone = LIEUX.find(([n]) => q.includes(n));
  if (zone){
    const km = (q.match(new RegExp(zone[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*\\+(\\d+)\\s*km')) || [])[1];
    ZONES = [[zone[0], zone[1], km ? +km : 0]];
    const autre = LIEUX.find(([n]) => n !== zone[0] && q.includes(n));
    if (autre) ZONES.push([autre[0], autre[1], 0]);
  }
  const budget = q.match(/≤\s*([\d\s]+)\s*€(?!\/)/);
  if (budget) CRIT.budget = budget[1].replace(/\s+/g,' ').trim() + ' €';
  const mens = q.match(/≤\s*([\d\s]+)\s*€\/mois/);
  if (mens) CRIT.mens = mens[1].replace(/\s+/g,' ').trim() + ' €/mois';
  const rdt = q.match(/rendement ≥ ([\d,]+)\s*%/i);
  if (rdt) CRIT.rdt = rdt[1] + ' %';
  const dpe = q.match(/DPE ≥ ([A-G])/);
  if (dpe) CRIT.dpe = dpe[1];
  if (/immeuble/i.test(q)) CRIT.types = ['Immeuble'];
  if (/maison/i.test(q))   CRIT.types = ['Maison'];
  if (/studio/i.test(q))   CRIT.pieces = ['Studio'];
  const tmin = q.match(/T(\d) min/);
  if (tmin) CRIT.pieces = ['T'+tmin[1], 'T'+(+tmin[1]+1), 'T5 et +'].filter((v,k,a)=>a.indexOf(v)===k);
  RECH_ENR = !!r.sauv;
  closePop(); goState('recherche', 'Résultats');
}

/* Un raccourci de la home est une recherche toute faite : il passe par le même lecteur que
   le mode « décrire », donc il pose vraiment ses critères au lieu de se contenter d'ouvrir
   la liste — c'est ce qui rendait la ville du raccourci sans effet. */
function raccourci(phrase){
  IAQ = ''; IA = iaLire(phrase);
  MODE = IA.mode; CRIT = IA.crit; PAGE = 1;
  if (IA.zones.length) ZONES = IA.zones.map(z=>[...z]);
  /* « Lyon 7ᵉ + 5 km » écrit dans le raccourci : le rayon fait partie de la promesse */
  const km = (phrase.match(/\+\s*(\d+)\s*km/)||[])[1];
  if (km && ZONES.length) ZONES[0][2] = +km;
  HASQ = true; SMODE = 'criteres'; RECH_ENR = false;
  goState('recherche','Résultats');
}

/* Le retour d'erreur repasse par le chargement : annoncer « je réessaie » puis afficher
   instantanément un résultat déjà là ne réessaie rien, et se voit. */
function relancer(){
  setState('Chargement');
  setTimeout(()=>{ if (S[cur].id==='recherche') setState('Résultats'); }, 900);
}

/* Enregistrer une recherche est un geste dont on doit voir la trace : sans elle, on ne sait
   pas si le clic a porté, et on le refait. */
let RECH_ENR = false;
let ALERTE = 'Quotidien';
let DECLENCHE = ['Nouveau bien','Baisse de prix'];
function setAlerte(t, i){ ALERTE = t; POP.sauvegarder(i==null?undefined:i); }
function toggleDeclenche(t, i){

  POP.sauvegarder(i==null?undefined:i);
}
/* Confirmer sur place plutôt que de fermer en silence : une feuille qui disparaît sans rien
   dire laisse penser que le clic n'a pas porté — et on le refait. */
function enregistrerRecherche(){
  RECH_ENR = true;
  const nom = document.getElementById('in-nomrech')?.value
    || critActifs().map(([l])=>l.replace(/&nbsp;/g,' ')).join(' · ');
  if (!RECENTES.some(r=>r.q===nom))
    RECENTES.unshift({q:nom, n:resultCount(), d:'à l\'instant', sauv:true, mode:MODE});
  /* l'écran derrière doit porter la trace du geste, pas seulement la feuille qui va se fermer */
  show(cur, true);
  pop('Recherche enregistrée',
    `« ${nom} »`, `
    <div class="bandeau">${pin(11)} <b>Alerte ${ALERTE.toLowerCase()}</b> — ${
      DECLENCHE.length ? DECLENCHE.join(', ').toLowerCase() : 'aucun déclencheur retenu'}.
      Vous pouvez la couper d'un clic depuis « mes recherches », jamais par un lien en bas d'un mail.</div>
    <div class="disc mt14">Elle est désormais permanente et synchronisée sur vos appareils.
    Les <b>${nbsp(resultCount()+' biens')}</b> d'aujourd'hui servent de point de départ : vous ne
    serez prévenu que de ce qui s'y ajoute.</div>`,
    `<button class="btn sm sec2" onclick="popGo('recherches')">Gérer mes alertes</button>
     <button class="btn sm" onclick="closePop()">Terminé</button>`);
}

/* switch de recherche : critères ⌕ / phrase ✦ — le mode phrase déploie la nav */
let SMODE = 'criteres', IAFOCUS = false;
function setSMode(m){ SMODE = m; IAFOCUS = (m==='ia'); show(cur, true);
  if (IAFOCUS) setTimeout(()=>document.getElementById('iainput')?.focus(), 80); }
function setIAFocus(v){ IAFOCUS = v; show(cur, true);
  if (v) setTimeout(()=>document.getElementById('iainput')?.focus(), 80); }
function iaBlur(){ setTimeout(()=>{

function iaAdd(t){ const i = document.getElementById('iainput');

/* ---- lecture d'une demande écrite en français ----
   L'écran promet « les critères que j'en tire » et « c'est votre lecture qui fait foi ». Tant
   que la réponse était écrite en dur, la promesse tombait au premier essai de démonstration :
   on tapait « un immeuble à Roubaix » et le prototype répondait « un T3 sur Lyon ».
   L'interprétation ci-dessous est volontairement littérale — elle ne devine rien, elle repère
   ce qui est dit. Ce qu'elle ne sait pas lire devient une question, jamais une hypothèse. */
let IAQ = '';
let IA = null;   /* dernière interprétation : {crit, flous, mode} */

/* « Paris 11e », « Paris 11ème » et « Paris 11ᵉ » désignent le même arrondissement :
   personne ne tape l'exposant, et un lieu non reconnu fait perdre toute la phrase. */
const DEACC = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/\u1d49/g,'e').replace(/(\d+)\s*(?:eme|ere|er|e)\b/g,'$1e');

function iaLire(phrase){
  const q = DEACC(phrase), crit = CRIT_VIDE(), flous = [];
  const mode = /(y vivre|habiter|pour moi|resider|ma residence|emmenager)/.test(q) ? 'home'
             : /(rendement|rapport|louer|locatif|investir|cash-?flow|rentab)/.test(q) ? 'invest' : MODE;

  /* localisation : on retient le lieu le plus précis nommé, jamais un lieu qu'on aurait deviné */
  const lieux = LIEUX.filter(([n]) => q.includes(DEACC(n)));
  const exact = lieux.filter(([n]) => !['Lyon','Rhône'].includes(n));
  const zones = (exact.length ? exact : lieux).slice(0,3).map(([n,t]) => [n,t,0]);
  /* « sur Lyon » sans arrondissement : le rayon est un choix, pas une supposition */
  const lyonVague = /\bsur lyon\b|\ba lyon\b/.test(q) && !exact.length;

  const nb = s => parseInt(s.replace(/[^\d]/g,''),10);
  const mois = q.match(/([\d\s.]+)\s*(?:k|000)?\s*(?:€|euros?)?\s*(?:par mois|\/\s*mois|mensuel)/);
  const kEur = q.match(/(\d+)\s*k(?![a-z0-9])/);
  const gros = q.match(/([\d]{2,3}[\s.]?\d{3})/);
  /* même typographie de nombre que partout ailleurs : « 1 300 €/mois », pas « 1300 » */
  if (mode === 'home' && mois) crit.mens = nb(mois[1]).toLocaleString('fr-FR').replace(/ | /g,' ') + ' €/mois';
  else if (kEur)  crit.budget = (nb(kEur[1])*1000).toLocaleString('fr-FR').replace(/ | /g,' ') + ' €';
  else if (gros)  crit.budget = nb(gros[1]).toLocaleString('fr-FR').replace(/ | /g,' ') + ' €';

  const pc = q.match(/\bt([1-5])\b/);
  if (pc) crit.pieces = ['T'+pc[1]];
  if (/\bstudio\b/.test(q)) crit.pieces = ['Studio'];

  [['appartement','Appartement'],['maison','Maison'],['immeuble','Immeuble'],
   ['terrain','Terrain'],['parking','Parking'],['local','Local / bureau']]
    .forEach(([k,v]) => { if (q.includes(k)) crit.types.push(v); });
  if (/immeuble de rapport/.test(q)) crit.montage.push('Immeuble de rapport');
  if (/cash-?flow positif/.test(q))  crit.montage.push('Cash-flow positif');
  if (/vendu loue|deja loue/.test(q)) crit.montage.push('Vendu loué');
  if (/balcon|terrasse/.test(q))     crit.equip.push('Balcon ou terrasse');
  if (/garage|parking/.test(q) && !crit.types.includes('Parking')) crit.equip.push('Garage');

  const rdt = q.match(/(\d+([.,]\d+)?)\s*%/);
  if (rdt) crit.rdt = rdt[1].replace('.',',') + ' %';
  const dpe = q.match(/dpe\s*([a-g])\b/);
  if (dpe) crit.dpe = dpe[1].toUpperCase();

  const surf = q.match(/(\d{2,3})\s*m2?\b/);
  if (surf) crit.surfMin = nb(surf[1]) + ' m²';

  /* ce qui reste flou devient une question fermée — chaque réponse écrit un critère réel */
  if (/bon rendement|bien rentab|rentable/.test(q) && !rdt)
    flous.push({q:'« Un bon rendement », c’est à partir de combien pour vous ?', k:'rdt',
                opts:[['4 % et plus','4 %'],['5 % et plus','5 %'],['7 % et plus','7 %']]});
  if (/pas trop de travaux|sans travaux|peu de travaux|bon etat/.test(q) && !dpe)
    flous.push({q:'« Pas trop de travaux » — je le traduis par une contrainte de DPE. Laquelle ?', k:'dpe',
                opts:[['DPE D minimum','D'],['DPE C minimum','C'],['peu importe le DPE','']]});
  if (lyonVague)
    flous.push({q:'Vous avez dit « sur Lyon » — j’inclus les communes limitrophes ?', k:'__rayon',
                opts:[['oui, Villeurbanne et Caluire','5'],['Lyon uniquement','0']]});

  return {crit, zones, flous, mode, lyonVague};
}

/* Valider la phrase : on la lit, on ne la remplace pas par un exemple. */
function iaValider(){
  const champ = document.getElementById('iainput');
  if (champ && champ.value.trim()) IAQ = champ.value.trim();
  if (!IAQ) IAQ = IAPHRASE();
  IA = iaLire(IAQ);
  IAFOCUS = false; HASQ = true;
  show(cur, true);
  POP.interpretation();
}
/* Retirer un critère de l'interprétation, ou répondre à une question : les deux écrivent
   dans la même interprétation, qui reste la seule chose que « lancer » appliquera. */
function iaRetirer(k, v){
  if (!IA) return;
  if (v != null){ const i = IA.crit[k].indexOf(v); if (i>=0) IA.crit[k].splice(i,1); }
  else if (k === '__zones') IA.zones = [];
  else IA.crit[k] = Array.isArray(IA.crit[k]) ? [] : '';
  POP.interpretation();
}
function iaRepondre(k, v){
  if (!IA) return;
  if (k === '__rayon'){ IA.zones = [['Lyon','com', +v]]; IA.lyonVague = false; IA.rayonRep = v; }
  else IA.crit[k] = v;
  IA.repondu = IA.repondu || {}; IA.repondu[k] = v;
  POP.interpretation();
}
/* Lancer : l'interprétation devient la recherche. C'est le seul moment où l'on écrit dans CRIT. */
function iaLancer(){
  if (!IA) return;
  MODE = IA.mode; CRIT = IA.crit; PAGE = 1;
  if (IA.zones.length) ZONES = IA.zones.map(z=>[...z]);
  SMODE = 'criteres'; HASQ = true; RECH_ENR = false;
  RECENTES.unshift({q: IAQ, n: 0, d:'à l\'instant', sauv:false, mode: MODE});
  closePop(); goState('recherche','Résultats');
  RECENTES[0].n = resultCount();
}

/* libellés de groupe sans jargon interne, pour le panneau écrans */
const GROUPES = {
  'P0 — Parcours acquéreur':'Parcours acquéreur',
  'P0+ — Cachet & IA (scope v2)':'Estimation & analyse',
  'P1 — Côté agence':'Côté agence',
  'P2 — Monétisation':'Côté agence — leads & facturation',
  'Site vitrine':'Site vitrine'
};

/* retire les références internes (F-xxx) des titres */
const clean = t => t.replace(/\s*\(F-[^)]*\)/g,'');

function buildMenu(){
  const groups = [...new Set(S.map(s=>s.g))];
  document.getElementById('plist').innerHTML = groups.map(g=>`
    <h3>${GROUPES[g]||g}</h3>
    <div class="plist">
    ${S.map((s,i)=>({s,i})).filter(o=>o.s.g===g).map(o=>
      `<a data-i="${o.i}"><b>${String(o.i+1).padStart(2,'0')}</b><span>${clean(o.s.title)}</span>
       ${o.s.states?`<i>${o.s.states.length} états</i>`:''}</a>`).join('')}
    </div>`).join('');
  document.querySelectorAll('.panel .plist a').forEach(a=>a.onclick=()=>{
    closeMenu(); show(+a.dataset.i);
  });
}

/* Le CTA « Contacter l'agence » ne quitte jamais l'écran, sans jamais se dédoubler :
   tant que le bouton de la colonne est visible, c'est lui qui porte l'action ;
   dès qu'il sort du champ, la barre flottante prend le relais. */
let ctaObs = null;
function syncCTA(){
  if (ctaObs){ ctaObs.disconnect(); ctaObs = null; }
  const bar = document.querySelector('.mobcta');
  if (!bar) return;
  const main = document.querySelector('.ctamain');
  if (!main){ bar.classList.remove('off'); return; }
  ctaObs = new IntersectionObserver(([e]) => bar.classList.toggle('off', e.isIntersecting),
    {threshold: .75});
  ctaObs.observe(main);
}

/* hauteur réelle de la barre de contrôle — les éléments fixes de l'app se calent dessus */
function measurePbar(){
  const p = document.querySelector('.pbar');
  if (p) document.documentElement.style.setProperty('--pbarH', p.offsetHeight + 'px');
  const n = document.querySelector('.appnav');
  if (n) document.documentElement.style.setProperty('--navH', n.offsetHeight + 'px');
}
window.addEventListener('resize', measurePbar);

function show(i, keepState){
  closePop();
  cur = i; const s = S[i];
  if (!keepState){
    state = s.states ? s.states[0] : null;
    if (s.id==='recherche'){ SMODE = 'criteres'; IAFOCUS = false; }
    scenario(s.id, state);
  }
  document.getElementById('frame').innerHTML =
    `<div class="appwrap"><div class="wf">${s.render(state)}</div>` +
    `<div class="pscrim ${PANEL?'open':''}" onclick="togglePanel()"></div>` +
    `<aside class="rpanel ${PANEL?'open':''}">${rpanelHTML()}</aside></div>`;
  document.getElementById('ptitle').textContent = clean(s.title);
  document.getElementById('ppos').textContent =
    `${String(i+1).padStart(2,'0')} / ${S.length} · ${GROUPES[s.g]||s.g}`;
  document.getElementById('pstates').innerHTML = s.states
    ? s.states.map((st,k)=>`<button class="${st===state?'on':''}" data-st="${st}" title="touche ${k+1}">${st}</button>`).join('')
    : '<span class="none">écran à état unique</span>';
  document.querySelectorAll('.pstates button').forEach(b=>b.onclick=()=>setState(b.dataset.st));
  document.querySelectorAll('.panel .plist a').forEach(a=>a.classList.toggle('on', +a.dataset.i===i));
  clavierPourLesCliquables(document.getElementById('frame'));
  measurePbar();
  syncCTA();
  window.scrollTo({top:0,behavior:'smooth'});
  history.replaceState(null,'','#'+s.id);
}
const ZONES_REF = () => [['Lyon 7ᵉ','arr',5], ['Villeurbanne','com',0]];
/* Les états de l'accueil décrivent des situations, pas des mises en page : « première visite »
   et « compte neuf » sont des recherches vierges, les autres reprennent la dernière recherche.
   Poser l'état ici plutôt que dans le gabarit évite que l'écran et le moteur se contredisent. */
function scenario(id, st){
  if (id !== 'accueil') return;
  const froid = st==='Visiteur — première visite' || st==='Compte neuf';
  if (froid){ CRIT = CRIT_VIDE(); ZONES = []; HASQ = false; }
  else { CRIT = CRIT0(); ZONES = ZONES_REF(); HASQ = true; }
  SMODE = 'criteres'; IAFOCUS = false; IAQ = ''; IA = null;
  PAGE = 1; RECH_ENR = false;
}
function setState(st){ state = st; scenario(S[cur].id, st); show(cur, true); }
function go(id){ const i = S.findIndex(s=>s.id===id); if(i>=0) show(i); }
/* ouvrir un écran directement sur un de ses états — sert aux enchaînements de parcours
   (ex. « suivre ma demande » qui doit tomber sur l'accueil état « Demande envoyée ») */
function goState(id, st){ const i = S.findIndex(s=>s.id===id); if(i>=0){ show(i); setState(st); } }

/* connecté / visiteur */
document.querySelectorAll('#auth button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#auth button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  setAuth(b.dataset.a);

/* device — « Auto » suit la largeur réelle du viewport (vraie responsivité),
   les trois autres boutons forcent un rendu pour la démo sur grand écran */
let DEVOVR = null; // null = auto
const deviceFor = w => w < 700 ? 'mobile' : (w < 1080 ? 'tablet' : 'desktop');
function applyDevice(rerender){
  const d = DEVOVR || deviceFor(window.innerWidth);
  const was = document.body.classList.contains('mobile') ? 'mobile'
    : document.body.classList.contains('tablet') ? 'tablet' : 'desktop';
  document.body.classList.toggle('mobile', d==='mobile');
  document.body.classList.toggle('tablet', d==='tablet');
  /* .ovr = format forcé depuis la barre du bas. Il dit au CSS que le cadre simulé est plus
     étroit que la fenêtre, et que les surfaces fixes doivent s'y rabattre. */
  document.body.classList.toggle('ovr', !!DEVOVR);
  if (rerender && d !== was) show(cur, true);
}
document.querySelectorAll('#dev button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#dev button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  DEVOVR = b.dataset.dev==='auto' ? null : b.dataset.dev;
  applyDevice(false);
  show(cur, true);
});
window.addEventListener('resize', ()=>{ if (!DEVOVR) applyDevice(true); });

document.getElementById('prev').onclick = ()=> show((cur-1+S.length)%S.length);
document.getElementById('next').onclick = ()=> show((cur+1)%S.length);

document.addEventListener('keydown', e=>{
  /* Échap est traité avant tout le reste : c'est la sortie de secours, elle doit marcher
     depuis un champ de saisie — c'est même là qu'on la cherche en premier. */
  if(e.key==='Escape'){
    if(popov.classList.contains('open')) return closePop();
    if(overlay.classList.contains('open')) return closeMenu();
    if(PANEL) return togglePanel();
    return;
  }
  if(e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowLeft') return show((cur-1+S.length)%S.length);
  if(e.key==='ArrowRight') return show((cur+1)%S.length);
  const s = S[cur];
  if(s.states && /^[1-9]$/.test(e.key)){
    const k = +e.key - 1;
    if(k < s.states.length) setState(s.states[k]);
  }
});

buildMenu();
applyDevice(false); // le rendu de départ colle au viewport réel
const start = S.findIndex(s=>s.id===location.hash.slice(1));
show(start>=0?start:0);
</script>
</body>
