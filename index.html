${LQ ? '' : `<div id="locres">${locResultats()}</div>`}

    <div class="lbl" style="margin:18px 0 7px">${pin(6)} Récemment cherché</div>
    <div class="row gap6 wrap">
      ${['Roubaix','Paris 11ᵉ','Mérignac','Rhône'].map(n=>{
        const l = LIEUX.find(x=>x[0]===n); const deja = ZONES.some(z=>z[0]===n);
        return `<span class="chip ${deja?'k':'hot'}" ${deja?'':`onclick="zoneAdd('${n}','${l[1]}')"`}>${n}</span>`;
      }).join('')}
    </div>

    <div class="disc mt14">${pin(7)} Dessiner une zone à la main sur la carte n'est pas au MVP
    (recherche cartographique F-020, hors périmètre) — on le dit plutôt que de laisser chercher
    le bouton. Les zones ci-dessus sont des périmètres administratifs réels, pas des approximations.</div>`,

    `${ZONES.length?`<span class="linkish sub hot" role="button" tabindex="0" style="margin-right:auto"
       onclick="ZONES=[];show(cur,true);POP.localisation()"
       onkeydown="kbd(event,()=>{ZONES=[];show(cur,true);POP.localisation()})">Tout effacer</span>`:''}
     <button class="btn sm" ${ZONES.length?`onclick="POP.recherche()"`:'disabled'}>${
       ZONES.length?`Valider — ${nbsp(resultCount()+' biens')}`:'Choisissez au moins une zone'}</button>`);

    /* on rend le curseur où il était, jamais de force en fin de chaîne */
    setTimeout(()=>{ const i=document.getElementById('locinput');
      if(i){ const c = LCARET==null ? i.value.length : Math.min(LCARET, i.value.length);
             i.focus(); i.setSelectionRange(c,c); LCARET = null; } }, 30);
  },

  /* ---------- MES RECHERCHES RÉCENTES — accès depuis la nav ----------
     Deux natures distinctes dans la même liste : ce qu'on a écrit tout seul (récent) et ce que
     l'utilisateur a nommé (sauvegardé). On les montre ensemble parce qu'il les cherche au même
     moment, mais on ne les traite pas pareil — l'étoile est la frontière. */
  recentes(){
    pop('Mes recherches', 'Les dernières lancées, et celles que vous avez enregistrées.', `
    <div class="col" style="gap:2px">
      ${RECENTES.map((r,i)=>`
        <div class="rrow hot" role="button" tabindex="0" style="justify-content:space-between;align-items:flex-start"
             onclick="critAppliquer(${i})" onkeydown="kbd(event,()=>critAppliquer(${i}))">
          <div style="min-width:0">
            <div class="row mid gap6 wrap">
              <span class="txt" style="font-weight:500;color:var(--ink)">${r.q}</span>
              ${r.sauv?'<span class="chip k">enregistrée</span>':''}
              <span class="chip">${r.mode==='home'?"J'habite":"J'investis"}</span>
            </div>
            <div class="sub" style="margin-top:3px">${r.d} · ${
              r.n?nbsp(r.n+' biens'):'aucun résultat à ce moment-là'}</div>
          </div>
          <div class="row mid gap8" style="flex:none">
            <span class="linkish sub hot" title="${r.sauv?'Retirer des enregistrées':'Enregistrer et être alerté'}"
              onclick="event.stopPropagation();${r.sauv?`RECENTES[${i}].sauv=false;POP.recentes()`:`POP.sauvegarder(${i})`}">${
              r.sauv?'★':'☆'}</span>
          </div>
        </div>`).join('')}
    </div>
    <div class="disc mt14">${pin(10)} Vos dernières recherches sont conservées <b>30 jours</b> et
    restent sur cet appareil tant que vous n'avez pas de compte. Enregistrer une recherche (★) la
    rend permanente, la synchronise, et permet de recevoir les nouveautés.</div>`,
    `<span class="linkish sub hot" style="margin-right:auto" onclick="popGo('recherches')">Gérer mes alertes</span>
     <button class="btn sm sec2" onclick="closePop()">Fermer</button>
     <button class="btn sm" onclick="CRIT=CRIT_VIDE();ZONES=[];HASQ=false;RECH_ENR=false;show(cur,true);POP.recherche()">Nouvelle recherche</button>`);
  },

  /* ---------- ENREGISTRER LA RECHERCHE ----------
     Le seul moment où l'on peut demander une fréquence d'alerte sans être intrusif : l'utilisateur
     vient de dire qu'il tenait à cette recherche. Le nom est pré-rempli depuis les critères — on ne
     fait pas remplir un champ dont on connaît déjà la réponse. */
  sauvegarder(i){
    const r = (i!=null && RECENTES[i]) ? RECENTES[i] : null;
    /* le nom pré-rempli doit décrire la recherche entière : s'il n'en reprend que la zone et
       le budget, l'utilisateur se retrouve avec trois recherches nommées pareil. */
    const titre = r ? r.q : critActifs().map(([l])=>l.replace(/&nbsp;/g,' ')).join(' · ');
    pop('Enregistrer cette recherche',
      'Elle devient permanente, et vous êtes prévenu des nouveautés.', `
    <div class="field">
      <div class="lbl"><label for="in-nomrech">Nom de la recherche</label></div>
      <div class="inp"><input id="in-nomrech" class="inlive" value="${titre}" autocomplete="off"></div>
      <div class="hint">pré-rempli depuis vos critères — modifiable</div>
    </div>

    <div class="field mt20"><div class="lbl">${pin(11)} Me prévenir des nouveautés</div>
      <div class="col" style="gap:2px">
        ${[['Instantané','dès qu\'un bien correspond — pour une recherche serrée'],
           ['Quotidien','un résumé par jour, le matin'],
           ['Hebdomadaire','un résumé le lundi — pour une veille de fond'],
           ['Aucune alerte','je reviendrai voir moi-même']]
          .map(([t,d])=>`
          <div class="rrow hot" role="button" tabindex="0" style="justify-content:space-between"
            data-t="${t}" onclick="setAlerte(this.dataset.t, ${i==null?'null':i})"
            onkeydown="kbd(event,()=>setAlerte(this.dataset.t, ${i==null?'null':i}))">
            <div style="min-width:0"><span class="txt" style="${ALERTE===t?'font-weight:600;color:var(--ink)':''}">${t}</span>
              <div class="sub">${d}</div></div>
            ${ALERTE===t?'<span class="txt" style="flex:none">✓</span>':''}
          </div>`).join('')}
      </div>
      <div class="hint">Modifiable à tout moment, et un seul clic pour couper —
        jamais un lien de désabonnement en bas d'un mail.</div></div>

    <div class="field mt14"><div class="lbl">Ce qui déclenche une alerte</div>
      <div class="row gap6 wrap">
        ${['Nouveau bien','Baisse de prix','Retiré de la vente','Passé sous offre']
          .map(t=>`<span class="chip hot ${DECLENCHE.includes(t)?'k':''}" role="button" tabindex="0"
            data-t="${t}" onclick="toggleDeclenche(this.dataset.t, ${i==null?'null':i})"
            onkeydown="kbd(event,()=>toggleDeclenche(this.dataset.t, ${i==null?'null':i}))">${t}</span>`).join('')}
      </div>
      <div class="hint">« Retiré de la vente » et « sous offre » concernent les biens que vous avez
        déjà vus dans cette recherche — pas le marché entier.</div></div>

    <div class="bandeau mt20">${pin(12)} <b>${nbsp(resultCount()+' biens')}</b> correspondent aujourd'hui.
      En moyenne, une recherche de ce périmètre reçoit <b>4 nouveautés par semaine</b> — de quoi
      justifier une alerte quotidienne sans vous noyer.</div>`,
    `<button class="btn sm sec2" onclick="closePop()">Annuler</button>
     <button class="btn sm" onclick="enregistrerRecherche()">Enregistrer</button>`);
  },

  /* ---------- TRIER ----------
     Le tri par défaut est le score, parce que c'est le seul classement que nous produisons et que
     personne ne peut acheter. Chaque option dit ce qu'elle met en tête : un intitulé seul oblige
     l'utilisateur à essayer pour comprendre, et il n'essaie qu'une fois. */
  tri(){ const home = MODE==='home';
    pop('Trier les résultats', 'Le tri ne filtre rien — tous les biens restent affichés.', `
    <div class="col" style="gap:2px">
      ${[['Score décroissant', 'les mieux notés d\'abord — prix vs marché, ' + (home?'coût d\'usage':'rendement') + ', DPE et fraîcheur'],
         [home?'Mensualité croissante':'Rendement décroissant',
          home?'ce qui pèse le moins sur votre budget mensuel':'le meilleur rapport loyer/prix d\'abord'],
         ['Prix croissant','les moins chers d\'abord — le prix affiché, pas le budget total'],
         ['Prix au m² croissant','utile pour comparer des surfaces très différentes'],
         ['Nouveautés d\'abord','mis en ligne le plus récemment — le tri d\'une session de veille'],
         ['Baisse de prix récente','les vendeurs qui ont déjà bougé : la négociation y est plus ouverte'],
         ['Ancienneté de l\'annonce','en ligne depuis le plus longtemps — souvent les plus négociables']]
        .map(([t,d])=>`<div class="rrow hot" role="button" tabindex="0" style="justify-content:space-between"
          onclick="setTri(this.dataset.t)" onkeydown="kbd(event,()=>setTri(this.dataset.t))" data-t="${t}">
          <div style="min-width:0">
            <span class="txt" style="${TRI===t?'font-weight:600;color:var(--ink)':''}">${t}</span>
            <div class="sub">${d}</div>
          </div>
          ${TRI===t?'<span class="txt" style="flex:none">✓</span>':''}
        </div>`).join('')}
    </div>
    <div class="disc mt14">Les biens non notés apparaissent en fin de liste sur le tri par score,
    jamais masqués. Aucun tri n'est achetable : la diffusion est gratuite, aucune agence ne peut
    payer pour passer devant.</div>`);
  },

  /* ---------- TOUS LES FILTRES — la recherche avancée, en entier ----------
     Assez long pour mériter un menu d'ancres, comme le détail du prix. Trois règles :
     le compteur de résultats est recalculé et visible en permanence dans le pied ; chaque filtre
     dit ce qu'il COÛTE en biens quand il est restrictif ; et aucun filtre ne masque un bien
     faute de donnée — l'absence d'information n'est pas un défaut du bien. */
  filtres(){ const home = MODE==='home';
    const MENU = [['f-lieu','Où'],['f-prix',home?'Budget':'Budget & rendement'],['f-bien','Le bien'],
                  ['f-etat','État & DPE'],['f-equip','Équipements'],
                  ['f-proj',home?'Votre projet':'Critères investisseur'],['f-annonce','L\'annonce']];
    /* chaque groupe écrit dans une clé de CRIT : l'état des pastilles n'est plus décidé par
       le gabarit mais lu dans les critères — c'est ce qui les rend cliquables sans mentir. */
    const seg = (label, key, items, hint) => `
      <div class="field mt14"><div class="lbl">${label}</div>
        <div class="row gap6 wrap">${items.map(t=>critChip(t, key, t, 'filtres')).join('')}</div>
        ${hint?`<div class="hint">${hint}</div>`:''}</div>`;

    pop('Tous les filtres',
      `Tout est combinable — ${nbsp(zonesTotal()+' biens')} dans vos zones, ${
        nbsp(resultCount()+'')} après vos filtres.`, `
    <div class="pmenu">${MENU.map(([a,l])=>
      `<a data-anc="${a}" onclick="anc('${a}')">${l}</a>`).join('')}</div>

        <h5 class="wt" style="margin-bottom:10px">Où</h5>

          <span class="chip o hot" onclick="POP.localisation()">+ ajouter une zone</span>
        </div>
        <div class="hint">${pin(8)} Rayon, quartiers, départements et couverture :
          <span class="linkish" onclick="POP.localisation()">tout le détail de la localisation</span>.</div>
      </section>

      <section id="f-prix">
        <h5 class="wt" style="margin-bottom:10px">${home?'Budget':'Budget & rendement'}</h5>
        <div class="grid2" style="gap:14px">
          ${home
            ? inpLive('Mensualité max','mens',{hint:'calculée avec votre apport et votre taux', pop:'filtres'})
              + inpLive('Apport disponible','apport',{pop:'filtres'})
            : inp('Budget min','',{placeholder:'—'})
              + inpLive('Budget max','budget',{pop:'filtres'})}
        </div>
        <div class="grid2 mt14" style="gap:14px">
          ${home
            ? inp('Charges max','',{placeholder:'—', hint:'charges de copropriété mensuelles'})
              + inp('Taxe foncière max','',{placeholder:'—'})
            : inpLive('Rendement brut min','rdt',{pop:'filtres'})
              + inp('Cash-flow min','',{placeholder:'—', hint:'mensuel, après charges et crédit'})}
        </div>
        <div class="grid2 mt14" style="gap:14px">
          ${inp('Prix au m² max','',{placeholder:'—'})}
          ${inp('Budget total max','',{placeholder:'—', hint:'frais de notaire inclus'})}
        </div>
        ${seg('Écart au marché', 'ecart', ['Sous le marché','Au prix du marché','Au-dessus'],
          'Calculé sur les ventes DVF du quartier. Les biens non estimables restent affichés.')}
      </section>

      <section id="f-bien">
        <h5 class="wt" style="margin-bottom:10px">Le bien</h5>
        ${seg('Type', 'types', ['Appartement','Maison','Immeuble','Terrain','Local / bureau','Parking'])}
        ${seg('Nombre de pièces', 'pieces', ['Studio','T2','T3','T4','T5 et +'],
          'Plusieurs tailles possibles — c\'est un OU, pas un minimum. Il ne s\'applique pas aux immeubles, qui se comptent en lots.')}
        ${seg('Chambres', 'chambres', ['1+','2+','3+','4+'])}
        <div class="grid2 mt14" style="gap:14px">
          ${inpLive('Surface min','surfMin',{placeholder:'—', pop:'filtres'})}${inpLive('Surface max','surfMax',{placeholder:'—', pop:'filtres'})}
        </div>
        <div class="grid2 mt14" style="gap:14px">
          ${inp('Surface terrain min','',{placeholder:'—'})}
          ${inp('Étage', '', {placeholder:'—', hint:'du … au …'})}
        </div>
        ${seg('Exposition', 'expo', ['Sud','Est','Ouest','Nord','Traversant'],
          'Renseignée sur une partie des biens seulement — ceux qui ne la déclarent pas restent affichés.')}
      </section>

      <section id="f-etat">
        <h5 class="wt" style="margin-bottom:10px">État & DPE</h5>
        <div class="field"><div class="lbl">DPE minimum</div>
          <div class="row gap6 wrap">${['A','B','C','D','E','F','G'].map(d=>
            `<span class="chip hot ${CRIT.dpe && DPE_ORDRE.indexOf(d)<=DPE_ORDRE.indexOf(CRIT.dpe)?'k':''}"
              role="button" tabindex="0" title="DPE ${d} minimum"
              onclick="critToggle('dpe','${d}','filtres')"
              onkeydown="kbd(event,()=>critToggle('dpe','${d}','filtres'))">${d}</span>`).join('')}</div>
          <div class="hint">${pin(16)} F et G sont des passoires énergétiques : location interdite ou
            en voie de l'être. Le bandeau réglementaire s'affiche sur la fiche, on ne les cache pas.</div></div>
        ${seg('Score minimum', 'score', ['Tous','6+','7+','8+'],
          'Les biens non notés (données insuffisantes) restent affichés — un marché peu liquide n\'est pas un mauvais bien.')}
        ${seg('État du bien', 'etat', ['Neuf','Récent','À rafraîchir','À rénover'])}
      </section>

      <section id="f-equip">
        <h5 class="wt" style="margin-bottom:10px">Équipements & prestations</h5>
        ${seg('Extérieur', 'equip', ['Balcon ou terrasse','Jardin','Piscine','Rez-de-jardin','Dernier étage'])}
        ${seg('Stationnement', 'equip', ['Garage','Parking','Box fermé'])}
        ${seg('Immeuble', 'equip', ['Ascenseur','Gardien','Local vélos','Accès PMR'])}
        ${seg('Intérieur', 'equip', ['Cuisine équipée','Cheminée','Climatisation','Cave','Buanderie'])}
        <div class="disc mt14">Un équipement non déclaré n'est pas un équipement absent :
          filtrer dessus retire les biens dont on ne sait rien. Le compteur le dit à chaque coche.</div>
      </section>

      <section id="f-proj">
        <h5 class="wt" style="margin-bottom:10px">${home?'Votre projet':'Critères investisseur'}</h5>
        ${seg(home?'Usage':'Montage', home?'usage':'montage', (home
          ? ['Sans travaux','Étage élevé','Calme','Proche transports']
          : ['Vendu loué','Immeuble de rapport','Cash-flow positif',
             'Colocation possible','Éligible LMNP','Division possible']),
          home
            ? 'Écoles, transports et commerces ne sont pas au périmètre : nous n\'avons pas la donnée, nous ne l\'inventons pas.'
            : 'Déduits des données du bien (surface, lots, loyers déclarés) — jamais d\'un texte d\'agence.')}
      </section>

      <section id="f-annonce">
        <h5 class="wt" style="margin-bottom:10px">L'annonce</h5>
        ${seg('Mise en ligne', 'ligne', ['24 h','7 jours','30 jours','Peu importe'])}
        ${seg('Mouvement de prix', 'mouvement', ['Baisse récente','Prix inchangé','Peu importe'])}
        ${seg('Statut', 'statut', ['Disponible','Sous offre','Retiré de la vente'],
          'Un bien retiré reste consultable si vous l\'avez en favori — il ne revient pas dans les résultats.')}
        ${seg('Nombre de mandats', 'mandats', ['Peu importe','Plusieurs agences','Une seule'],
          'Un bien porté par plusieurs agences a plusieurs prix : c\'est souvent là que se trouve la marge de négociation.')}
        ${seg('Source des données', 'source', ['Peu importe','Déposée en direct','Flux partenaire'],
          'Une donnée déposée en direct par l\'agence est plus fraîche et plus complète.')}
        ${seg('Photos', 'photos', ['Avec photo','Peu importe'],
          'Un bien sans photo n\'est pas un mauvais bien — c\'est souvent une agence qui n\'a pas fini son dépôt.')}
      </section>
    </div>`,
    `<span class="linkish sub hot" role="button" tabindex="0" style="margin-right:auto"
       onclick="critReset('filtres')" onkeydown="kbd(event,()=>critReset('filtres'))">Tout réinitialiser</span>
     <button class="btn sm sec2" onclick="POP.sauvegarder()">★ Enregistrer</button>
     <button class="btn sm" ${ZONES.length?`onclick="PAGE=1;popGo('recherche')"`:'disabled'}>${
       ZONES.length?`Afficher les ${nbsp(resultCount()+' biens')}`:'Choisissez d\'abord une zone'}</button>`, true);
    /* sans ce branchement, le menu de gauche surlignait la section sans jamais y aller */
    wireAnc();
  },

  /* équipements & prestations — la liste complète, groupée */
  equip(kind){ const E = EQUIP[kind]||EQUIP.nominal;
    pop(`${E.total} équipements & prestations`, 'Relevés dans les données du bien — dépôt agence ou flux partenaire.', `
    ${E.groupes.map(([g, items])=>`
      <div style="margin-bottom:16px">
        <div class="lbl" style="margin-bottom:4px">${g}</div>
        <div class="grid2" style="gap:0 26px">${items.map(eqrow).join('')}</div>
      </div>`).join('')}
    <div class="disc">Les éléments barrés sont déclarés absents. Informations non vérifiées par
    First Mundi — confirmez lors de la visite.</div>`,
    `<button class="btn sec2 sm" onclick="closePop()">Fermer</button>`);
  },

  /* l'analyse complète — grande popup, menu latéral, ancres */
  analyse(anchor){ const acq = MODE==='home';
    const MENU = [['prix','Estimation de prix'],['usage', acq?'Coût d\'usage':'Loyer estimé'],
      ['quartier','Le quartier'],['score','Score du bien'],['avis','Avis First Mundi']];

    <div class="pmenu">${MENU.map(([a,l])=>
      `<a data-anc="anc-${a}" onclick="anc('anc-${a}')">${l}</a>`).join('')}</div>

        </div>
        <div class="txt mt14">Prix affiché <b class="num" style="color:var(--ink)">${nbsp('289 000 €')}</b> —
          ${acq?'<b>cohérent avec le marché</b>, 1,8 % au-dessus de la médiane des ventes conclues. Rien n\'indique que vous payez trop cher.'

        <div class="card flat pad mt8" style="background:var(--fill-2)">
          <div class="lbl">Méthode</div>
          <div class="txt" style="margin-top:4px"><b class="num">24</b> mutations comparables · rayon 600 m ·
          18 derniers mois · surface 55-70 m² · dispersion faible (±6 %).</div>

        <div class="disc mt8">Estimation indicative, non contractuelle — ni une expertise, ni un avis de valeur.</div>
      </section>

        ${secHead(acq?'Ce que le logement va coûter à l\'usage':'Estimation de loyer', conf(3,'confiance correcte'))}
        <div class="row mid gap20 wrap">

        <div class="disc mt14">${acq

      <section id="anc-quartier">
        ${secHead('Le quartier — Lyon 7ᵉ, Jean Macé', conf(4,'ventes notariées'))}
        <div class="grid4">
          ${[['Prix médian au m²','4 480 €'],['Ce bien','4 661 € /m²'],['Ventes sur 12 mois','63'],['Tendance 12 mois','+2,1 %']]
            .map(([k,v])=>`<div class="card flat pad"><div class="lbl">${k}</div>
              <div class="mid2 num" style="margin-top:3px">${nbsp(v)}</div></div>`).join('')}
        </div>
        <div class="txt mt14">Délai de vente moyen : <b class="num">74 jours</b> —
          ${acq?'ce bien est en vente depuis 41 jours, vous n\'êtes pas en retard.'
               :'marge de négociation historique : −3,4 % du prix affiché.'}</div>
        <div class="disc mt8">Source : DVF — mutations notariales publiées par la DGFiP. Chiffres du quartier,

      <section id="anc-score">

        ${(acq
          ? [['Localisation','Jean Macé — métro B à 400 m, écoles et commerces à pied',78,'35 %'],
             ['Rentabilité','coût d\'usage 238 €/mois · énergie DPE C maîtrisée',75,'20 %'],

    ['L’amorçage annonce la contrepartie, jamais la tâche','« renseignez votre apport » ne motive personne ; « chaque fiche affichera ce que ce bien vous coûte vraiment » oui. Trois jalons, jamais bloquants, jamais modaux — le bloc disparaît définitivement une fois franchi et ne revient pas.'],
    ['Le suivi porte N statuts, pas un','la demande part à toutes les agences qui détiennent un mandat : le suivi affiche donc une ligne par agence, chacune avançant à son rythme. On n’affiche que ce qu’on SAIT — la demande est partie, l’agence l’a ouverte dans son dashboard. On ne sait pas si elle a appelé. D’où deux statuts seulement par ligne — Envoyée · Consultée — et un bouton « elle m’a répondu » par agence, seule façon honnête de fermer la boucle. Effet de bord précieux : une donnée de réactivité par agence qu’on ne peut acheter nulle part.'],
    ['L’ÉCART entre les agences est l’information','« 1 sur 3 l’a ouverte » en dit plus que n’importe quel statut global : sur le même bien, à la même heure, avec la même demande, une agence a réagi et deux non. Aucun portail ne peut produire ce chiffre, il faudrait pour cela que les trois annonces se connaissent. C’est le même mécanisme que l’écart de prix sur la fiche — on l’affiche, on ne le commente pas.'],
    ['La bascule à 48 h ne survit que si l’acquéreur a DÉCOCHÉ','envoyer aux trois d’un coup la vide de son objet : il n’y a plus d’agence 2 à proposer, elle a déjà la demande. Elle garde tout son sens dans l’autre cas — une seule agence retenue, sans réponse à 48 h, et l’on rappelle que celle qui a été écartée propose toujours le bien. C’est la valeur du regroupement rendue tangible au moment exact où l’utilisateur en a besoin, sans jamais lui vendre deux fois la même chose.'],
    ['« Retiré de la vente » se traite comme une baisse de prix','même soin, même place. C’est le bénéfice n°1 promis à l’avatar acquéreur, pas un message d’erreur : il mérite sa vignette et sa sortie.'],
    ['La zone de preuve se rétracte à mesure qu’il avance','elle porte tout le poids en visite froide, elle disparaît dès qu’il a des choses à traiter. Un utilisateur en cours de transaction n’a pas besoin qu’on lui vende le produit.'],
    ['La home porte la recherche ENTIÈRE, pas une version allégée','c’est la seule surface de recherche d’un visiteur qui arrive à froid : la pilule de nav n’existe que sur les écrans intérieurs. Une barre au rabais ici oblige à entrer dans le produit pour accéder aux vrais réglages — et on n’entre pas dans un produit qu’on n’a pas encore évalué. Le champ « Où » ouvre donc exactement le même écran de zones que partout ailleurs, avec le rayon, le stock de biens et le dédoublonnage.'],
    ['« Où » n’est pas une saisie libre','une saisie libre ferait espérer une autocomplétion qui n’est pas là, et perdrait ce qui fait la valeur du choix de zones : le type du lieu, le rayon, le nombre de biens derrière. Le champ affiche les zones retenues en pastilles et ouvre l’écran complet — c’est un bouton déguisé en champ, et il est plus honnête ainsi.'],
    ['« Décrire » doit exister DÈS la home','c’est le mode qui impressionne le plus une première visite, et il n’était accessible que depuis la pilule de nav — donc jamais par un visiteur qui n’a pas encore cherché. Les deux modes sont désormais côte à côte au même endroit, dans les deux surfaces.'],
    ['Raccourcis pour les froids, HISTORIQUE pour les autres','même emplacement sous la barre, contenu opposé. Un visiteur sans passé a besoin d’exemples pour comprendre ce qu’on sait faire ; celui qui revient n’a besoin que de sa propre dernière recherche. Proposer des raccourcis génériques à quelqu’un qui a déjà cherché, c’est lui faire répéter un travail qu’il a déjà fait.']
  ],
  render:(st)=>{
    const VIS = ['Visiteur — première visite','Visiteur — de retour'];
    /* show(i, true) conserve l'état GLOBAL : arriver ici en portant l'état d'un autre écran
       laissait la table de titres renvoyer undefined, et la déstructuration plantait l'écran
       d'accueil. On retombe sur le premier état plutôt que de casser. */
    const CONNU = ['Visiteur — première visite','Visiteur — de retour','Compte neuf',
                   'En chasse','Demande envoyée','Ça a bougé'];
    if (!CONNU.includes(st)) st = CONNU[0];
    /* la bascule Visiteur/Connecté de la barre d'outils reste maîtresse : elle ramène
       toujours sur un état cohérent plutôt que d'afficher un tableau de bord sans compte */
    const s = (AUTH==='out' && !VIS.includes(st)) ? 'Visiteur — de retour' : st;
    const anon = VIS.includes(s);
    const froid = s==='Visiteur — première visite';
    const neuf  = s==='Compte neuf';
    const acq   = MODE==='home';

    /* ---------- zone 1 : le registre change, la barre ne bouge pas ---------- */
    const [h1, h2] = anon
      ? [`Trouvez un bien qui tient la route, chiffres à l'appui.`,
         `Chaque annonce affiche son budget total et ${acq?'sa mensualité estimée':'son rendement'}, avant même que vous appeliez l'agence.`]
      : ({'Compte neuf':  ['Bienvenue, Marc.','Votre compte est prêt. Trois gestes, et la plateforme travaille pour vous.'],
          'En chasse':    ['Bonjour Marc.','4 nouveaux biens répondent à vos recherches depuis hier.'],
          'Demande envoyée':['Bonjour Marc.','Votre demande est partie. Vous êtes prévenu dès qu\'il se passe quelque chose.'],
          'Ça a bougé':   ['Bonjour Marc.','Deux mouvements sur vos favoris depuis votre dernière visite.']}[s]);

    const repris = !froid && !neuf;   // la barre reprend la dernière recherche
    /* Les deux champs de la home écrivent dans les mêmes critères que la feuille de recherche :
       ce qu'on tape ici doit se retrouver dans la barre de l'écran suivant, sinon la home
       n'est qu'une image de la recherche et l'utilisateur ressaisit tout. */
    const champs = acq
      ? [['Mensualité max', 'mens',   'ex. 1 300 €/mois'],
         ['Apport',         'apport', 'ex. 45 000 €']]
      : [['Budget max',     'budget', 'ex. 300 000 €'],
         ['Rendement min',  'rdt',    'ex. 4 %']];

    /* ---------- la barre de recherche de la home ----------
       C'est la seule surface de recherche d'un visiteur qui arrive à froid : il n'a pas la pilule
       de nav, qui n'existe que sur les écrans intérieurs. Elle doit donc porter TOUT ce que porte
       la pilule — les deux modes, les zones, l'historique — sans jamais bouger de place ni grandir
       quand l'utilisateur, lui, avance. */
    const ia = SMODE==='ia';
    /* `repris` gouverne TOUTE la barre, zones comprises : un visiteur en première visite ou un
       compte neuf n'a pas de zones, et afficher celles de la session de démo lui ferait croire
       qu'on a deviné où il cherche. Les champs vides et les zones vides vont ensemble. */
    const zonesHome = repris ? ZONES : [];

    /* le champ « Où » n'est pas un champ : c'est l'entrée du choix de zones. Une saisie libre
       ferait espérer une autocomplétion qui n'est pas là, et perdrait le rayon et le stock. */
    const champOu = `
      <div class="field">
        <div class="row mid" style="justify-content:space-between;gap:8px">
          <div class="lbl">Où ?${pin(12)}</div>
          ${zonesHome.length?`<span class="sub num">${nbsp(resultCount()+' biens')}</span>`:''}
        </div>
        <div class="inp hot" style="flex-wrap:wrap;gap:5px;justify-content:flex-start;padding:6px 8px"
             onclick="POP.localisation()" title="Choisir vos zones">
          ${zonesHome.length
            ? zonesHome.map(([n,,km])=>`<span class="chip k">${n}${km?` +${km} km`:''}</span>`).join('')
              + '<span class="chip o">+ ajouter</span>'
            : '<span>Ville, arrondissement, quartier, département</span>'}
        </div>
      </div>`;

    const barre = `
      <div style="max-width:700px;margin:0 auto;text-align:center">
        <h4 class="wt" style="font-size:23px">${h1}${pin(1)}</h4>
        <p class="txt mt8">${h2}</p>
      </div>
      <div class="card mt20" style="max-width:820px;margin:22px auto 0;padding:16px 14px 14px">
        <div class="row mid gap8 wrap" style="justify-content:center;margin-bottom:14px">
          <div class="modeseg">
            <button class="${MODE==='invest'?'on':''}" onclick="setMode('invest')">J'investis</button>
            <button class="${MODE==='home'?'on':''}" onclick="setMode('home')">J'habite</button>
          </div>
          <div class="sidetabs" style="margin-top:0;flex:none">
            <button class="${ia?'':'on'}" style="padding:5px 13px" onclick="setSMode('criteres')">⌕ Critères</button>
            <button class="${ia?'on':''}" style="padding:5px 13px" onclick="setSMode('ia')">✦ Décrire</button>
          </div>
        </div>

        ${ia ? `
        <div class="iainwrap">
          <span style="flex:none;color:var(--ink-3)">✦</span>
          <input id="iainput" class="iain" value="${IAQ}"
            placeholder="Décrivez ce que vous cherchez, comme vous l'expliqueriez à un agent immobilier…"
            oninput="IAQ=this.value" onkeydown="if(event.key==='Enter')iaValider()">
          <button class="btn sm" style="flex:none" onmousedown="event.preventDefault()"
            onclick="iaValider()">Valider</button>
        </div>
        <div class="row mid gap6 wrap" style="margin-top:10px;justify-content:center">
          <span class="sub" style="flex:none">Suggestions :</span>
          ${(acq
            ? ['sans travaux','proche des écoles','avec balcon ou terrasse','dernier étage']
            : ['cash-flow positif','immeuble de rapport','DPE D minimum','baisse de prix récente'])
            .map(t=>`<span class="chip hot" onmousedown="event.preventDefault()" onclick="iaAdd('${t}')">${t}</span>`).join('')}
        </div>
        <div class="sub" style="margin-top:11px">${pin(13)} Votre phrase est traduite en critères
          que vous relisez et corrigez avant le lancement — aucun prix ni rendement n'est estimé ici.</div>`
        : `
        <div class="row stackm gap8 mid">
          <div class="grow">${champOu}</div>
          ${champs.map(([l,k,ph2])=>`<div class="grow">${inpLive(l, k, {placeholder:ph2})}</div>`).join('')}
          <button class="btn hot" style="margin-top:18px" ${zonesHome.length
            ? `onclick="HASQ=true;PAGE=1;goState('recherche','Résultats')"` : `onclick="POP.localisation()"`}>${
            zonesHome.length ? (repris?'Reprendre':'Rechercher') : 'Choisir une zone'}</button>
        </div>
        <div class="sub" style="margin-top:11px">${repris
          ? 'Votre dernière recherche — modifiez un critère, ou relancez-la telle quelle.'
          : (acq
            ? 'Choisissez une zone pour commencer. La mensualité sera calculée avec votre apport et votre taux — renseignés une fois, appliqués partout.'
            : 'Choisissez au moins une zone : sans localisation, les résultats ne veulent rien dire.')}</div>`}
      </div>

      ${froid||neuf ? `
      <div class="row mid gap8" style="justify-content:center;margin-top:16px;flex-wrap:wrap">
        <span class="sub">${pin(14)} Raccourcis :</span>
        ${(acq
          ? [['T3 Lyon &lt; 1 300 €/mois', 'T3 à Lyon 7ᵉ + 5 km, 1 300 €/mois'],
             ['Sans travaux',              'appartement à Lyon 7ᵉ + 5 km sans travaux'],
             ['Avec balcon ou terrasse',   'appartement à Lyon 7ᵉ + 5 km avec balcon']]
          : [['T2/T3 Lyon &lt; 300 000 €', 'T3 à Lyon 7ᵉ + 5 km, 300 000 €'],
             ['Rendement &gt; 8 %',        'à Lyon 7ᵉ + 5 km avec 8 % de rendement'],
             ['Immeubles de rapport',      'immeuble de rapport à Lyon 7ᵉ + 5 km']])
          .map(([t,phrase])=>`<span class="chip hot" role="button" tabindex="0" data-p="${phrase}"
            onclick="raccourci(this.dataset.p)" onkeydown="kbd(event,()=>raccourci(this.dataset.p))">${t}</span>`).join('')}
      </div>`
      : `
      <div class="row mid gap8" style="justify-content:center;margin-top:16px;flex-wrap:wrap">
        <span class="sub">${pin(15)} Vos dernières recherches :</span>
        ${RECENTES.slice(0,3).map((r,ri)=>`<span class="chip hot" role="button" tabindex="0"
          title="${r.n?r.n+' biens · '+r.d:'aucun résultat · '+r.d}"
          onclick="critAppliquer(${ri})" onkeydown="kbd(event,()=>critAppliquer(${ri}))">${
          r.sauv?'★ ':''}${r.q.split(' · ')[0]}</span>`).join('')}
        <span class="linkish sub hot" onclick="POP.recentes()">toutes →</span>
      </div>`}`;

    /* ---------- zone 2 : le bloc primaire, un seul ---------- */
    const ligne = (t, sub, dest) => `
      <div class="rrow" onclick="go('${dest}')" style="justify-content:space-between;padding:11px 12px">
        <div class="rtx"><b>${t}</b><span>${sub}</span></div>
        <span class="sub" style="flex:none">→</span>
      </div>`;
    const lignes = rows => `<div class="card" style="margin-top:14px"><div style="padding:5px">${rows.join('')}</div></div>`;

    const jalon = (n, done, t, gain, cta, dest) => `
      <div class="card flat pad">
        <div class="row mid stackm" style="justify-content:space-between;gap:12px">
          <div class="row mid gap8" style="min-width:0">
            <div class="dot" style="width:22px;height:22px;border-radius:50%;flex:none;display:flex;
              align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);
              border:1.5px solid ${done?'var(--ink)':'var(--line)'};
              background:${done?'var(--ink)':'transparent'};color:${done?'#fff':'var(--ink-3)'}">${done?'✓':n}</div>
            <div style="min-width:0">
              <div class="txt" style="font-weight:600;color:var(--ink)">${t}</div>
              <div class="sub">${gain}</div>
            </div>
          </div>
          ${done ? '<span class="chip k" style="flex:none">fait</span>'
                 : `<button class="btn sm hot" style="flex:none" onclick="go('${dest}')">${cta}</button>`}
        </div>
      </div>`;

    let primaire = '';

    if (s==='Visiteur — de retour') primaire = `
      <div class="card">
        <div class="pad">
          <div class="row mid stackm" style="justify-content:space-between;gap:12px">
            <div class="grow" style="min-width:0">
              <div class="lbl">Votre dernière recherche${pin(2)}</div>
              <div class="txt" style="font-weight:600;color:var(--ink);margin-top:3px">
                ${RECENTES[0].q}</div>
              <div class="sub" style="margin-top:4px">
                <b class="num">4</b> nouveaux biens depuis votre passage, il y a 6 jours</div>
            </div>
            <button class="btn hot" style="flex:none" onclick="go('recherche')">Voir les 4 nouveaux</button>
          </div>
        </div>
        <div class="pad" style="border-top:1px solid var(--line-2)">
          <div class="row mid stackm" style="justify-content:space-between;gap:12px">
            <div class="grow" style="min-width:0">
              <div class="txt" style="font-weight:600;color:var(--ink)">Cette recherche ne survivra pas à ce navigateur.${pin(4)}</div>
              <div class="sub" style="margin-top:3px">Un compte gratuit garde vos critères, vous prévient des baisses
              de prix, et applique vos hypothèses de financement à chaque bien.</div>
            </div>
            <button class="btn sec2 sm hot" style="flex:none" onclick="go('inscription')">Créer un compte</button>
          </div>
        </div>
      </div>`;

    if (neuf) primaire = `
      <div class="card"><div class="pad">
        <div class="row mid" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div><h5 class="wt">Trois gestes pour que ça travaille pour vous${pin(6)}</h5>
            <div class="sub">Rien n'est obligatoire. Chacun débloque quelque chose de précis.</div></div>
          <span class="chip"><b class="num">0</b>&nbsp;/&nbsp;3</span>
        </div>
        <div style="height:6px;background:var(--fill);border-radius:3px;margin-top:12px;overflow:hidden">
          <div style="width:4%;height:100%;background:var(--ink-2)"></div></div>
        <div class="col gap8 mt14">
          ${jalon(1, false, 'Lancer une recherche',
            'Choisissez une zone et un budget : c\'est ce qui débloque les alertes et le suivi de prix.',
            'Commencer','recherche')}
          ${jalon(2, false, 'Mettre un bien en favori',
            'Vous serez prévenu dès que son prix bouge ou qu\'il est retiré de la vente.','Parcourir les biens','recherche')}
          ${jalon(3, false, acq?'Renseigner votre apport et votre taux':'Renseigner votre apport, votre taux et votre loyer cible',
            acq?'Chaque fiche affichera ce que le bien vous coûte vraiment, pas seulement son prix.'
               :'Chaque fiche affichera votre rendement net et votre cash-flow réels.','1 minute','profil-completude')}
        </div>
      </div></div>`;

    if (s==='En chasse') primaire = `
      <div>
        <div class="row mid" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div><h5 class="wt"><b class="num">4</b> nouveaux biens sur « ${zonesLbl()} »${pin(3)}</h5>
            <div class="sub">Depuis hier · alerte quotidienne</div></div>
          <div class="row gap8 wrap">
            <button class="btn sec2 sm hot" onclick="go('recherches')">Gérer l'alerte</button>
            <button class="btn sm hot" onclick="go('recherche')">Voir les 4</button>
          </div>
        </div>
        <div class="grid3 mt14">${BIENS.slice(0,3).map(carte).join('')}</div>
        <div class="disc mt8">Ces biens s'affichent parce qu'ils répondent à une recherche que vous avez
        enregistrée. Nous n'affichons jamais de sélection sans critère — ni « populaires », ni « coups de cœur ».</div>
      </div>`;

    if (s==='Demande envoyée') {
      /* La demande part aux N agences du bien : le suivi porte donc N statuts, pas un.
         Chaque agence avance à son rythme — c'est l'écart entre elles qui est l'information. */
      const suivi = [
        ['Agence du Parc',   'Consultée il y a 12 min', 'k',  true],
        ['Rhône Immobilier', 'Envoyée — pas encore ouverte', '', false],
        ['Lyon 7 Habitat',   'Envoyée — pas encore ouverte', '', false]
      ];
      const vus = suivi.filter(x=>x[3]).length;
      primaire = `
      <div class="card">
        <div class="pad" style="border-bottom:1px solid var(--line-2)">
          <div class="row mid stackm" style="justify-content:space-between;gap:12px">
            <div class="row mid gap8" style="min-width:0">
              ${ph('photo',44).replace('height:44px','height:44px;width:62px;flex:none')}
              <div style="min-width:0">
                <div class="txt" style="font-weight:500;color:var(--ink)">${BIENS[0].t}</div>
                <div class="sub">Demande envoyée à <b>${suivi.length} agences</b> · il y a 3 h</div>
              </div>
            </div>
            <span class="chip k" style="flex:none">${vus} sur ${suivi.length} l'a ouverte${pin(8)}</span>
          </div>
        </div>
        <div class="pad">
          <div class="lbl" style="margin-bottom:8px">Où en est chaque agence${pin(7)}</div>
          <div class="col gap6">
            ${suivi.map(([ag,st2,cl,vu])=>`
              <div class="card flat pad">
                <div class="row mid agrow" style="justify-content:space-between;gap:10px">
                  <div style="min-width:0">
                    <div class="txt" style="font-weight:600;color:var(--ink)">${ag}</div>
                    <div class="sub">${st2}</div>
                  </div>
                  <div class="row mid gap8" style="flex:none">
                    <span class="chip ${cl}">${vu?'Consultée':'Envoyée'}</span>
                    ${vu?'<button class="btn sec2 sm hot">Elle m\'a répondu</button>':''}
                  </div>
                </div>
              </div>`).join('')}
          </div>
          <div class="sub mt14">Une seule a ouvert votre demande pour l'instant.
          Temps de réponse moyen constaté sur la plateforme : <b class="num">8 h</b>.</div>
          <div class="disc mt8">Nous savons qu'une demande a été ouverte — pas si l'agence vous a appelé.
          Personne ne publie cette information : seul vous pouvez nous le dire, agence par agence.
          Votre réponse ne sert qu'à mesurer leur réactivité.</div>
        </div>
      </div>

      <div class="card" style="margin-top:14px"><div class="pad">
        <div class="row mid gap6 wrap">
          <span class="txt" style="font-weight:600;color:var(--ink)">${BIENS[1].t}</span>
          <span class="chip o">Sans nouvelle depuis 2 jours</span>
        </div>
        <div class="sub" style="margin-top:4px">Demande envoyée le 10/08 à ${BIENS[1].ag} seule —
        vous aviez retiré l'autre agence avant l'envoi. Jamais ouverte.</div>
        <div class="bandeau mt14">${pin(9)} <b>L'agence que vous aviez écartée propose toujours ce bien.</b>
          Vous n'êtes pas bloqué par un mandat qui ne répond pas : c'est le même bien et la même annonce,
          seul le contact change.
          <div class="row gap8 mt8 wrap">
            <button class="btn sm hot" onclick="go('lead1')">Contacter Roubaix Immobilier</button>
            <button class="btn sec2 sm hot" onclick="POP.agences(1)">Voir les agences</button>
          </div>
        </div>
      </div></div>`;
    }

    if (s==='Ça a bougé') primaire = `
      <div class="card"><div class="pad">
        <div class="row mid gap6 wrap">
          <span class="chip k">Baisse de prix${pin(5)}</span>
          <span class="sub">le 2 août · sur un de vos favoris</span>
        </div>
        <div class="row stackm gap20 mt14">
          <div style="width:300px;max-width:100%;flex:none">${carte(BIENS[3],3)}</div>
          <div class="grow" style="min-width:0">
            <h5 class="wt">Mérignac est passé de ${nbsp('459 900 €')} à ${nbsp('448 500 €')}</h5>
            <p class="txt mt8">Deuxième baisse depuis la mise en vente, soit <b class="num">−6,5 %</b> au total
            en 87 jours. Le délai de vente moyen du secteur est de 74 jours : le vendeur est au-delà.</p>
            <div class="row gap8 mt14 wrap">
              <button class="btn hot" onclick="go('fiche')">Voir le bien</button>
              <button class="btn sec2 hot" onclick="POP.prixdetail(3)">L'historique du prix</button>
            </div>
          </div>
        </div>
      </div></div>

      <div class="card" style="margin-top:14px"><div class="pad">
        <div class="row mid stackm" style="justify-content:space-between;gap:12px">
          <div class="grow" style="min-width:0">
            <div class="row mid gap6 wrap">
              <span class="txt" style="font-weight:600;color:var(--ink)">T2 · 44 m² · Villeurbanne (Gratte-Ciel)</span>
              <span class="chip o">Retiré de la vente${pin(10)}</span>
            </div>
            <div class="sub" style="margin-top:3px">Plus aucune agence ne le propose depuis le 31/07.
            Nous ne savons pas s'il a été vendu — personne ne publie cette information.</div>
          </div>
          <div class="row gap8 wrap" style="flex:none">
            <button class="btn sec2 sm hot" onclick="go('recherche')">Biens similaires</button>
            <button class="btn ghost sm hot">M'alerter s'il revient</button>
          </div>
        </div>
      </div></div>`;

    /* ---------- lignes secondaires : ce que le bloc primaire n'a pas pris ---------- */
    const secondaires = {
      'En chasse': [ligne('Vos favoris','3 biens suivis · les comparer sur les mêmes chiffres','favoris'),
                    ligne('Vos recherches','3 enregistrées · 2 alertes actives','recherches'),
                    ligne('Votre profil','85 / 100 — la capacité de financement manque','compte')],
      'Demande envoyée': [ligne('Vos favoris','3 biens suivis · 1 baisse de prix cette semaine','favoris'),
                    ligne('Vos recherches','4 nouveautés en attente sur « T2/T3 Lyon »','recherches')],
      'Ça a bougé': [ligne('Vos recherches','4 nouveautés en attente sur « T2/T3 Lyon »','recherches'),
                    ligne('Votre profil','85 / 100 — la capacité de financement manque','compte')]
    }[s];

    /* ---------- zone 3 : la preuve, qui se rétracte ---------- */
    const preuve = (anon || neuf) ? `
      <div class="sec">
        <div class="grid3">
          ${[['Une annonce par bien','Le même appartement chez trois agences ne fait pas trois pages. Nous écrivons la fiche à partir des données ; les agences restent vos contacts.'],
             ['Le budget total, pas le prix affiché','Frais de notaire calculés sur chaque bien, dès la liste de résultats — pas au moment de signer.'],
             ['Le classement ne s\'achète pas','La diffusion est gratuite pour les agences. Nous sommes payés à la vente : aucune ne peut payer pour passer devant.']]
            .map(([t,d])=>`<div><div class="ph solid" style="width:32px;height:32px"></div>
              <h5 class="wt mt14">${t}</h5><p class="txt" style="margin-top:5px">${d}</p></div>`).join('')}
        </div>
        <div class="sub" style="margin-top:14px">${pin(5)} Données de démonstration —
        <b class="num">12 480</b> biens en ligne, <b class="num">1 260</b> agences partenaires.</div>
      </div>` : '';

    return `
    ${appnav('home','customer',anon?'out':'in')}
    <div class="sec" style="padding-top:44px;padding-bottom:${froid?'44':'30'}px">${barre}</div>
    ${primaire||secondaires ? `<div class="sec">${primaire}${secondaires?lignes(secondaires):''}</div>` : ''}
    ${preuve}`;
  }
});

add({id:'recherche', g:'P0 — Parcours acquéreur', n:'02', title:'Recherche & résultats',
  intro:"L'écran où l'utilisateur passe le plus de temps avant la fiche. Densité assumée : le rendement et le cash-flow apparaissent DÈS la carte, c'est ce qui nous distingue d'un portail classique. La recherche elle-même se joue en trois surfaces — la barre de nav, la popup « ma recherche » et la popup « où » — plus l'historique, qui est le seul moyen de ne pas faire recommencer quelqu'un qui revient.",
  states:['Résultats','Sans critère','Chargement','Aucun résultat','Erreur'],
  notes:[
    ['Le score domine la carte','badge sur la photo + barre sous les chiffres + tri par défaut. C’est l’élément qui décide si on ouvre la fiche — il doit être lisible avant la lecture du prix. Un bien non notable affiche « — non noté », jamais un 0 ni un score inventé.'],
    ['Le rendement sur la carte','décision structurante : l’utilisateur trie mentalement avant même d’ouvrir une fiche. C’est le différenciateur visible en 1 scroll.'],
    ['Sans localisation, pas de liste — et on le dit à la place de la liste','l’état vide ne s’excuse pas : il pose la seule question qui bloque (« où cherchez-vous ? ») et ouvre l’écran qui y répond. Afficher des biens au hasard pour meubler donnerait des résultats qui ne veulent rien dire, et contredirait la règle « aucune annonce sans critère ».'],
    ['Les zones se CUMULENT, et se recouvrent sans doubler','on peut retenir « Lyon 7ᵉ + 5 km » ET « Villeurbanne » — même si la seconde est déjà dans la première. Plutôt que d’interdire ou de corriger en silence, on le dit et on compte les biens une seule fois. Interdire ferait perdre l’utilisateur qui ne connaît pas la géographie administrative ; corriger en silence lui ferait douter du compteur.'],
    ['La couverture est annoncée, jamais subie','trois biens à Guéret, on l’écrit — « ce n’est pas votre budget qui est en cause, c’est nous » — et on propose une alerte de couverture. Un utilisateur qui découvre le vide après trois filtres nous en veut ; celui qui le sait avant revient quand ça s’améliore.'],
    ['Les lieux récents avant la saisie','on ne cherche pas une commune, on y revient. Les quatre derniers lieux sont affichés en chips au-dessus du clavier : dans une session de chasse, c’est le geste le plus fréquent après le scroll.'],
    ['Pas de dessin sur carte, et on le dit','la recherche cartographique est hors MVP (F-020). Plutôt que de laisser l’utilisateur chercher un bouton qui n’existe pas, une ligne l’annonce et rappelle que nos zones sont des périmètres administratifs réels, pas des approximations tracées à la main.'],
    ['« Où » n’est pas un champ, c’est un écran','c’était le champ le plus expédié de la recherche alors que c’est le premier qu’on remplit et le seul qu’on ne peut pas approximer. Il ouvre désormais une surface entière : recherche typée (commune, arrondissement, quartier, département), stock de biens par lieu, rayon réglable ZONE PAR ZONE, et effet du rayon annoncé avant de l’appliquer.'],
    ['Reprendre une recherche récente est proposé AVANT de remplir','le formulaire vide est le pire moment pour découvrir qu’on aurait pu ne pas le remplir. Les trois dernières recherches sont en tête de la popup, avec leur nombre de résultats — pas en bas, pas derrière un onglet.'],
    ['L’historique est passif, l’enregistrement est un geste','les récentes s’écrivent toutes seules, ne sont jamais nommées, expirent à 30 jours et restent sur l’appareil sans compte. Les enregistrées sont nommées, synchronisées et alertées. Confondre les deux transforme l’historique en corvée de ménage — d’où l’étoile comme unique frontière, au même endroit dans les deux listes.'],
    ['Zéro résultat : on chiffre chaque assouplissement','« +18 biens si vous étendez à 10 km » vaut mieux que « élargissez vos critères ». L’utilisateur choisit alors le renoncement qui lui coûte le moins, au lieu de tout relâcher au hasard ou de partir.'],
    ['Le compteur est celui des zones, et il est daté','« 41 biens · Lyon 7ᵉ +5 km · mis à jour il y a 6 min ». Le chiffre vient du périmètre choisi, la fraîcheur est affichée : sur un stock qui bouge tous les jours, un compteur sans date est une promesse invérifiable.'],
    ['Les critères actifs se retirent LÀ où ils sont lus','chaque critère est une pastille avec sa croix, dans la barre du haut. Un utilisateur qui doit rouvrir une popup pour enlever « DPE ≥ D » ne l’enlève pas : il abandonne la recherche. La deuxième ligne « affiner » ne fait qu’ajouter — les deux gestes ne se mélangent jamais.'],
    ['Cas limite intégré à la liste','la 4ᵉ carte (Mérignac) teste en même temps : photo absente, DPE G, rendement non calculable. Si la maquette tient avec elle, elle tient partout.'],
    ['L’erreur propose une sortie','recharger, ou revenir au dernier résultat connu. Jamais un cul-de-sac.'],
    ['Filtrer par score, sans jamais masquer les non-notés','un bien sans assez de comparables n’est pas un mauvais bien. Le filtre exclut par score bas, pas par absence de score — sinon on fait disparaître les biens des marchés peu liquides, qui sont souvent les plus rentables.'],
    ['Source et fraîcheur sur chaque carte','« déposée en direct » ou « flux partenaire », et la date de mise à jour. C’est la réponse au préjugé n°1 des deux avatars — « encore un agrégateur » — et ça se joue avant le clic, pas dans une page à propos.'],
    ['Le cœur est sur la carte, pas seulement sur la fiche','exigence explicite de F-018 : on met en favori depuis la liste, sans ouvrir. C’est le geste de tri le plus fréquent d’une session.'],
    ['Filtres en tiroir sur mobile','la liste ne doit jamais être poussée hors écran par les filtres — bottom sheet, comme toutes les autres feuilles de détail.']
  ],
  render:(st)=>{
    /* Retirer la dernière zone doit conduire à l'état qui pose la seule question restante,
       sans que l'utilisateur ait à comprendre qu'il a changé d'état. */
    const vide = st==='Sans critère' || !ZONES.length;
    /* Les raccourcis d'affinage écrivent dans les mêmes critères que la feuille complète :
       « + Garage / parking » ajouté ici doit se retrouver coché dans « tous les filtres ». */
    const QUICK = MODE==='home'
      ? [['Baisse de prix','mouvement','Baisse récente'],['DPE ≥ D','dpe','D'],
         ['Balcon ou terrasse','equip','Balcon ou terrasse'],['Garage / parking','equip','Garage'],
         ['Sans travaux','usage','Sans travaux'],['Proche écoles','usage','Proche transports'],
         ['Dernier étage','equip','Dernier étage']]
      : [['Baisse de prix','mouvement','Baisse récente'],['DPE ≥ D','dpe','D'],
         ['Balcon ou terrasse','equip','Balcon ou terrasse'],['Garage / parking','equip','Garage'],
         ['Cash-flow positif','montage','Cash-flow positif'],['Vendu loué','montage','Vendu loué'],
         ['Immeuble de rapport','montage','Immeuble de rapport']];
    /* Les critères actifs sont des objets manipulables, pas un résumé en texte : chacun se retire
       d'un clic, là où il est lu. Un utilisateur qui doit rouvrir une popup pour enlever « DPE ≥ D »
       ne l'enlève pas — il abandonne la recherche. La liste vient du moteur, pas d'un tableau
       écrit ici : c'est la même que celle qui alimente le compteur. */
    const actifs = vide ? [] : critActifs();
    const nb = resultCount();
    const liste0 = vide ? [] : biensFiltres();
    const filtres = `
      <div class="fbar fcrit">
        <button class="btn sec2 sm hot" style="flex:none" onclick="POP.recherche()">
          ⚙ Ma recherche${vide?'':` · <b class="num">${actifs.length}</b>`}</button>
        <span class="fsep"></span>
        ${vide
          ? `<span class="chip o hot" onclick="POP.localisation()">+ choisir une zone</span>
             <span class="chip hot" onclick="POP.recentes()">↺ mes recherches récentes</span>`
          : (()=>{
             /* Sur mobile les pastilles passent à la ligne — sinon les trois quarts finissent
                hors écran — mais neuf pastilles empilées mangeaient un tiers de la hauteur
                avant le premier bien. On en montre donc quatre, et le reste est derrière un
                révélateur qui, lui, est TOUJOURS dans le flux : jamais rogné, jamais à
                chercher. Sur desktop la rangée tient sur une ligne, on ne plafonne rien. */
             const cap = MOBILE() && !CRITOUV && actifs.length > 4;
             const vus = cap ? actifs.slice(0,4) : actifs;
             const past = ([l,k])=>`<span class="chip k hot" role="button" tabindex="0"
                title="Retirer « ${l.replace(/&nbsp;/g,' ')} »"
                onclick="critRetirer('${k}')" onkeydown="kbd(event,()=>critRetirer('${k}'))">${
                l} <b style="opacity:.55">✕</b></span>`;
             return `${vus.map(past).join('')}
             ${cap ? `<span class="chip o hot" role="button" tabindex="0"
                 onclick="critOuvrir(1)" onkeydown="kbd(event,()=>critOuvrir(1))"
                 >+ ${actifs.length-4} autres ▾</span>`
               : (MOBILE() && actifs.length > 4
                 ? `<span class="chip o hot" role="button" tabindex="0"
                      onclick="critOuvrir(0)" onkeydown="kbd(event,()=>critOuvrir(0))">▴ replier</span>` : '')}
             <span class="linkish sub hot fclear" role="button" tabindex="0" style="flex:none"
               onclick="critEffacerTout()" onkeydown="kbd(event,critEffacerTout)">tout effacer</span>`;})()}
      </div>
      ${vide?'':(()=>{
        /* on ne propose jamais d'AJOUTER ce qui est déjà actif : la ligne du haut retire,
           celle du bas ajoute, et aucun critère n'apparaît dans les deux. */
        const dispo = QUICK.filter(([,k,v])=>!critHas(k,v));
        return dispo.length ? `<div class="fbar" style="margin-top:8px">
          <span class="sub" style="flex:none">Affiner :</span>
          ${dispo.map(([l,k,v])=>`<span class="chip hot" role="button" tabindex="0"
            onclick="critToggle('${k}','${v}')" onkeydown="kbd(event,()=>critToggle('${k}','${v}'))">+ ${l}</span>`).join('')}
          <span class="fsep"></span>
          <span class="linkish sub hot" role="button" tabindex="0" style="flex:none"
            onclick="POP.filtres()" onkeydown="kbd(event,POP.filtres)">tous les filtres</span>
        </div>` : '';})()}`;

    let liste;
    if (vide) liste = `
      <div class="card"><div class="empty">
        <div class="ico"></div>
        <h5 class="wt">Où cherchez-vous ?${pin(3)}</h5>
        <p>Choisissez au moins une zone. Nous n'affichons pas de liste au hasard :
        sans localisation, les résultats ne veulent rien dire.</p>
        <button class="btn hot" onclick="POP.localisation()">Choisir une zone</button>
      </div></div>
      <div class="card mt14"><div class="pad">
        <div class="row mid" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
          <div class="lbl">${pin(10)} Reprendre une recherche récente</div>
          <span class="linkish sub hot" onclick="POP.recentes()">Toutes →</span>
        </div>
        <div class="col" style="gap:2px;margin-top:8px">
          ${RECENTES.slice(0,3).map((r,ri)=>`
            <div class="rrow hot" style="justify-content:space-between" onclick="critAppliquer(${ri})">
              <div style="min-width:0">
                <div class="row mid gap6 wrap">
                  <span class="txt" style="color:var(--ink)">${r.q}</span>
                  ${r.sauv?'<span class="chip k">enregistrée</span>':''}
                </div>
                <div class="sub" style="margin-top:2px">${r.d}</div>
              </div>
              <span class="sub num" style="flex:none">${r.n?nbsp(r.n+' biens'):'aucun'}</span>
            </div>`).join('')}
        </div>
      </div></div>`;
    else if (st==='Chargement') liste = `
      <div aria-busy="true"><div class="sk" style="height:14px;width:180px;margin-bottom:14px"></div>
      <div class="cards">${skcarte()+skcarte()+skcarte()+skcarte()+skcarte()+skcarte()}</div>
      <span class="sronly" role="status">Recherche en cours…</span></div>`;
    else if (st==='Erreur') liste = `
      <div class="card"><div class="empty">
        <div class="ico"></div>
        <h5 class="wt">Quelque chose a coincé de notre côté${pin(15)}</h5>
        <p>Vos critères et vos zones sont conservés. Réessayez — si ça persiste, on est là :
        <span class="num">support@firstmundi.fr</span></p>
        <div class="row gap8 wrap"><button class="btn hot" onclick="relancer()">Réessayer</button>
        <button class="btn sec2 hot" onclick="setState('Résultats')">Revenir aux derniers résultats</button></div>
      </div></div>`;
    /* zéro résultat n'est plus un état qu'on choisit dans la barre d'outils : c'est ce que
       renvoie la recherche quand les critères ne laissent rien passer. Les assouplissements
       sont donc ceux des critères RÉELLEMENT posés, chiffrés un par un — « +18 biens si vous
       étendez à 10 km » vaut mieux que « élargissez vos critères ». */
    else if (st==='Aucun résultat' || !liste0.length) {
      const z = ZONES[0];
      const relacher = [
        ...(z && z[1]!=='dep' && z[2]<10 ? [[`Étendre ${z[0]} à +10 km`, '+ '+Math.round(zoneCount(z[0],z[1],10)*resultCount()/Math.max(1,zonesTotal())-resultCount())+' biens', `zoneRayon(0,10,true)`]] : []),
        ...critActifs().filter(([,k])=>!k.startsWith('zone:')).slice(0,4)
          .map(([l,k])=>[`Retirer « ${l.replace(/&nbsp;/g,' ')} »`, '+ '+critGain(k)+' biens', `critRetirer('${k}')`])
      ];
      liste = `
      <div class="card"><div class="empty">
        <div class="ico"></div>
        <h5 class="wt">Aucun bien ne coche toutes vos cases${pin(11)}</h5>
        <p>Voici ce que chaque assouplissement rapporterait — chiffré, pour que vous choisissiez
        celui qui vous coûte le moins.</p>
        <div class="col gap6" style="text-align:left;max-width:440px;margin:4px auto 0">
          ${relacher.map(([t,g,act])=>`<div class="rrow hot" role="button" tabindex="0"
            style="justify-content:space-between" onclick="${act}" onkeydown="kbd(event,()=>{${act}})">
            <span class="txt">${t}</span><span class="chip k">${g}</span></div>`).join('')}
        </div>
        <div class="row gap8 wrap mt14">
          <button class="btn sm hot" onclick="POP.sauvegarder()">M'alerter si un bien arrive</button>
          <button class="btn sec2 sm hot" onclick="POP.recentes()">Revenir à une recherche récente</button>
        </div>
      </div></div>`;
    }
    else {
      const pages = nbPages(), page = Math.min(PAGE, pages);
      liste = `
      <div>
        <div class="row mid" style="justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
          <div style="min-width:0">
            <div class="txt" role="status"><b class="num">${nbsp(nb+'')}</b> biens${pin(12)}</div>
            <div class="sub">${zonesLbl()}${zonesChevauchent()?' · zones qui se recouvrent, comptées une fois':''}
              · mis à jour il y a 6 min</div>
          </div>
          <div class="row mid gap8 wrap resacts">
            <button class="btn sec2 sm hot" onclick="POP.tri()">Trier : ${TRI} ▾</button>
            <button class="btn sec2 sm hot" onclick="POP.sauvegarder()">${
              RECH_ENR ? '★ Recherche enregistrée' : '★ Enregistrer'}</button>
          </div>
        </div>
        <div class="cards">${liste0.map(b=>carte(b, BIENS.indexOf(b))).join('')}</div>
        ${pages>1 ? `<div class="row mid" style="justify-content:center;margin-top:18px;gap:8px">
          <button class="btn sec2 sm" ${page>1?`onclick="setPage(${page-1})"`:'disabled'}>←</button>
          ${Array.from({length:Math.min(pages,5)},(_,k)=>k+1).map(k=>
            `<span class="chip ${k===page?'k':'hot'}" role="button" tabindex="0"
              onclick="setPage(${k})" onkeydown="kbd(event,()=>setPage(${k}))">${k}</span>`).join('')}
          ${pages>5?`<span class="sub">… ${pages}</span>`:''}
          <button class="btn sec2 sm" ${page<pages?`onclick="setPage(${page+1})"`:'disabled'}>→</button>
        </div>` : ''}
      </div>`;
    }

    return `${appnav('Recherche')}
      <div class="sec">${filtres}${liste}</div>`;
  }
});

add({id:'fiche', g:'P0 — Parcours acquéreur', n:'03', title:'Fiche bien — l\'écran signature',
  intro:"L'écran qu'on comparera à SeLoger. Photo-first en haut, puis une densité de données assumée. **Une seule annonce par bien, et c'est la nôtre** : le texte, les caractéristiques et l'analyse sont produits par First Mundi à partir du flux partenaire et des ventes DVF. La colonne droite est collante : tout le prix et le CTA de contact restent visibles pendant tout le scroll.",
  states:['Cas nominal','Profil non renseigné','Bien retiré de la vente','Cas limite (DPE G)'],
  notes:[
    ['Tout le prix dans la colonne droite, et rien ailleurs','un seul bloc, collé au CTA. Éclater le prix entre le corps de page et la colonne obligeait l’œil à faire deux fois le même travail.'],
    ['Le chiffre affiché est le prix, et rien d’autre','un bien à trois mandats a trois prix ; celui de la colonne est le plus bas, le seul qui soit réellement obtenable. Mais on ne le commente PAS ici — ni « le plus bas des trois », ni la fourchette. La colonne annonce un prix comme n’importe quelle fiche, et c’est la popup qui explique d’où il sort, agence par agence. Le budget total frais de notaire inclus vit lui aussi dans la popup : mis en colonne, il transforme un chiffre de décision en accroche et fait douter du prix affiché juste au-dessus.'],
    ['Trois signaux, pas six','budget total · baisse · position marché en tag. La version précédente empilait prix, prix au m², écart marché, budget et une phrase de résumé : la phrase répétait la baisse et le tag, et le bloc se lisait comme un tableau. Le prix au m² reste, en gris, à côté du tag — c’est un repère, pas une décision.'],
    ['Le bloc prix est cliquable en entier','un clic n’importe où ouvre la popup qui déplie tout : prix de vente, prix au m² vs quartier, position face aux ventes DVF, historique des mouvements, décomposition du budget, prix par agence. La colonne donne le verdict, la popup montre d’où il vient.'],
    ['Une annonce par bien, écrite par nous','le texte d’une agence lui appartient ; les faits n’appartiennent à personne. Nous rédigeons donc la description à partir de la donnée — c’est ce qui autorise une fiche unique là où un portail classique empile trois annonces concurrentes du même appartement.'],
    ['Colonne droite collante','l’action « contacter » ne doit jamais demander de remonter. En mobile, elle devient une barre fixe en bas.'],
    ['Le bloc analyse se REMPLACE, il ne se replie pas','état « Profil acquéreur » : même emplacement, même grille, contenu inversé — mensualité, budget total, coût énergétique, ancienneté. Replier le bloc investisseur reviendrait à dire « ce produit n’est pas pour vous ».'],
    ['Bandeau réglementaire DPE F/G','au-dessus du prix, pas en pied de page : l’interdiction de location change la décision d’investissement.'],
    ['Historique de prix visible','deux baisses en 87 jours est une information de négociation — un portail classique la cache, nous en faisons un argument.'],
    ['Photos jamais stockées','on affiche depuis les URLs sources ; le fallback doit donc être élégant et fréquent, pas un cas rare.'],
    ['« Retiré de la vente », jamais « vendu »','le flux ne porte aucun statut de vente : dire « vendu » serait inventer. Cet état est un traitement à part entière, pas un message d’erreur — c’est le bénéfice n°1 de l’avatar acquéreur.'],
    ['La formule visible, les hypothèses dans le compte','l’investisseur ne renonce pas à son tableur : la formule complète reste à un clic depuis Résultats. Les hypothèses de calcul, elles, vivent dans Paramètres du compte — réglées une fois, appliquées à toutes les fiches, on ne les redemande pas ici.'],
    ['On publie les FAITS, jamais le TEXTE d’une agence','surface, étage, DPE, charges, prix, mouvements : des faits, non protégeables, que nous remettons en forme nous-mêmes. Le texte et les photos d’une agence restent à elle — nous n’en reproduisons aucun. C’est précisément ce qui rend l’annonce unique possible sans contrefaçon.'],
    ['AUCUNE agence n’est « le contact » de la fiche','trois mandats, c’est trois contacts possibles — en mettre un en colonne droite reviendrait à en désigner un, donc à arbitrer entre des agences dont nous sommes le partenaire et non l’arbitre. La colonne ne porte donc que le bien : son prix, son analyse, le bouton. Les agences vivent dans le détail du prix, à égalité, chacune avec le sien — et la demande part à toutes, l’acquéreur en retirant qui il veut. Ce qui reste ici, c’est la provenance des DONNÉES, qui n’est pas une identité de contact.'],
    ['La description doit prouver qu’elle sort de la donnée','chaque phrase est rattachable à un champ : 62 m², DPE C, 140 €/mois, 63 ventes DVF. Un texte génératif qui vante « le charme de l’ancien » détruirait exactement la crédibilité qu’on cherche à construire — la contrainte est donc écrite dans le prompt, et affichée à l’utilisateur.'],
    ['Fourchette expliquée, jamais mise en scène','pas de tableau comparatif, pas de tri par prix croissant entre agences. Nous sommes le partenaire des agences, pas leur arbitre — un comparateur de prix nous grillerait auprès d’elles. Le prix affiché en tête est le plus bas connu, et on le dit.'],
    ['« Ce n’est pas le même bien » est une soupape obligatoire','entre 0,60 et 0,85 de score, on ne fusionne jamais : ce sont des « biens similaires ». Au-dessus, l’erreur reste possible — réunir deux lots distincts du même immeuble sous une seule annonce, c’est publier une information fausse. Le signalement sort le bien sous 24 h.'],

    ['Le score juste sous le titre, avec un lien vers sa décomposition','il doit être visible sans scroll, mais jamais seul : « tout voir » est à côté du chiffre. Un score sans porte de sortie vers sa méthode, c’est exactement ce que l’avatar investisseur rejette. Le prix ayant quitté le corps de page, c’est lui qui ouvre la lecture — et c’est cohérent : notre valeur, c’est l’analyse, pas la répétition du prix.'],
    ['« Biens similaires » a une fonction technique, pas seulement commerciale','c’est là qu’atterrissent les rapprochements probables mais non certains (0,60-0,85). Le module n’est donc pas optionnel : sans lui, ces biens n’ont nulle part où aller et la tentation de les fusionner revient.'],
    ['Le mouvement de prix se lit en événements, pas en courbe','« baisse de 1,0 % le 2 août » est actionnable ; une sinusoïde ne l’est pas. Chaque ligne porte sa date, son montant et l’agence concernée — c’est un argument de négociation, donc il doit être citable au téléphone.'],
    ['L’écart de comportement entre agences EST l’information','une seule des trois a baissé, les autres n’ont pas bougé depuis six semaines. C’est le signal que l’annonce unique rend visible et qu’aucun portail ne peut donner, puisqu’il faudrait pour cela réunir trois pages concurrentes. On l’affiche dans la popup prix, on ne le commente pas — même discipline que pour la fourchette.']

    ['La marque de l’agence est chez elle ici','logo, nom, présentation rédigée par elle, son équipe, ses mandats. Ce qui ne s’y trouve pas : une description du bien concurrente de la nôtre. Une annonce par bien, sans exception.'],
    ['Le lead part à CETTE agence','règle de routage sans arbitrage : l’acheteur contacte l’agence affichée sur le bien, ou celle dont il consulte la page. Pas de round-robin, pas de répartition, rien à négocier — c’est le seul point de friction réel sur mandat simple.'],
    ['Le retour vers le bien est toujours offert','« ce bien est aussi proposé par 2 autres agences » — on ne masque pas les autres mandats depuis la page agence. Le faire serait reproduire l’opacité qu’on reproche aux portails.'],
    ['Mode dégradé : citer sans reproduire','pour une agence non déposée, la page n’existe pas. On affiche son prix et un lien sortant depuis la fiche, rien d’autre. La citation d’un prix et d’un nom n’est pas une reproduction — et comme le texte de la fiche est le nôtre, il n’y a rien d’autre à emprunter.'],
    ['Position de contact visible et justifiée','l’agence voit son rang et le critère qui lui manque. C’est l’argument d’acquisition opt-in : « vous êtes sur la fiche de toute façon — déposez vos données en direct et c’est vous qu’on affiche en contact. »']
  ],

      <div class="sec"><div style="max-width:780px;margin:0 auto">

        <div class="card mt14"><div class="empty">
          <div class="ico"></div>
          <h5 class="wt">${pin(5)} Lyon 7 Habitat n'a pas de page chez nous</h5>
          <p>Cette agence n'a pas ouvert de compte sur la plateforme. Nous savons qu'elle détient un mandat
          sur ce bien — la donnée circule — mais nous ne reprenons ni ses photos ni son texte.</p>
          <div class="card flat pad" style="max-width:420px;width:100%">
            <div class="row mid" style="justify-content:space-between;gap:12px">
              <div><div class="txt" style="font-weight:600;color:var(--ink)">Lyon 7 Habitat</div>
                <div class="sub">Prix affiché sur sa source</div></div>
              <div class="mid2 num">${nbsp('292 000 €')}</div>
            </div>
          </div>
          <div class="row gap8">
            <button class="btn sec2 sm">Voir sur le site source ↗</button>
            <button class="btn sm hot" onclick="go('fiche')">Revenir au bien</button>
          </div>
          <div class="disc" style="margin-top:6px">Vous êtes cette agence ? Déposez vos données en direct :
          c'est gratuit, et c'est vous qu'on affiche en contact sur ce bien.</div>
        </div></div>
      </div></div>`;

    return `${appnav('Recherche')}
    <div class="sec"><div class="row stackm gap20">
      <div class="grow col gap20">
        <div class="row mid gap8 sub"><span class="linkish hot" onclick="go('fiche')">← T3 · 62 m² · Lyon 7ᵉ</span>
