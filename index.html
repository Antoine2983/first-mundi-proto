<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype MVP — parcours complet</title>
<style>
:root{
  --ink:#111418; --ink-2:#4a5058; --ink-3:#767d87; --ink-4:#a3a9b3;
  --line:#d7dbe0; --line-2:#e8ebee; --bg:#f4f5f7; --paper:#fff;
  --fill:#eceef1; --fill-2:#f7f8f9;
  --note:#8a6d2f; --note-bg:#fdf6e6; --note-line:#e8d9ae;
  --r:6px; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* ---------- CHROME DU PROTOTYPE ---------- */
.stage{padding:26px 22px 130px}
.frame{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:clip;
  max-width:1180px;margin:0 auto;box-shadow:0 1px 2px rgba(0,0,0,.04)}
body.mobile .frame{max-width:390px}

/* barre de contrôle flottante */
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:10px;padding:9px 16px;flex-wrap:wrap;
  box-shadow:0 -2px 12px rgba(0,0,0,.18)}
.pbar .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbar .pbtn{font:inherit;font-size:12px;padding:6px 12px;border:1px solid #454c56;background:#282d34;
  color:#d7dbe0;border-radius:6px;cursor:pointer;white-space:nowrap}
.pbar .pbtn:hover{background:#353b44;color:#fff}
.pbar .ptitle{display:flex;flex-direction:column;min-width:0}
.pbar .ptitle b{font-size:12.5px;font-weight:600;letter-spacing:.1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:320px}
.pbar .ptitle span{font-size:10px;color:#9aa1ab;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.pbar .sep{width:1px;height:24px;background:#3a404a;flex:none}
.pbar .stlbl{font-size:10px;color:#9aa1ab;text-transform:uppercase;letter-spacing:.7px;font-weight:600;flex:none}
.pstates{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pstates button{font:inherit;font-size:11px;padding:5px 11px;border:1px solid #454c56;background:transparent;
  color:#b9bec7;border-radius:16px;cursor:pointer;white-space:nowrap}
.pstates button:hover{color:#fff;border-color:#6b7280}
.pstates button.on{background:#fff;border-color:#fff;color:var(--ink);font-weight:600}
.pstates .none{font-size:11px;color:#6b7280;font-style:italic}
.seg{display:flex;background:#282d34;border-radius:6px;padding:2px;border:1px solid #454c56}
.seg button{font:inherit;font-size:11px;padding:5px 11px;border:0;background:transparent;color:#9aa1ab;
  border-radius:4px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#4a515c;color:#fff}

/* pbar compacte sur petit et moyen viewport — les contrôles ne doivent pas manger l'écran */
@media (max-width:900px){
  .pbar{gap:6px;padding:7px 10px}
  .pbar .ptitle,.pbar .sep,.pbar .stlbl{display:none}
  .pbar .pbtn{padding:5px 9px;font-size:11px}
  .pstates{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .pstates::-webkit-scrollbar{display:none}
  .pstates button{flex:none;font-size:10.5px;padding:4px 9px}
  .seg button{font-size:10.5px;padding:4px 8px}
}

/* panneau « tous les écrans » */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(12,14,17,.55);display:none;
  align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.panel{background:var(--paper);width:100%;max-width:880px;max-height:78vh;overflow-y:auto;
  border-radius:12px 12px 0 0;padding:22px 26px 34px;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.panel h2{font-size:15px;font-weight:650;margin-bottom:4px}
.panel .phint{font-size:11.5px;color:var(--ink-3);margin-bottom:16px}
.panel h3{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);
  font-weight:700;margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line-2)}
.panel h3:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.panel .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.panel .plist a{display:flex;gap:9px;padding:8px 10px;color:var(--ink-2);text-decoration:none;
  font-size:12.5px;border:1px solid transparent;border-radius:6px;cursor:pointer;align-items:baseline}
.panel .plist a:hover{background:var(--fill-2);border-color:var(--line-2);color:var(--ink)}
.panel .plist a.on{background:var(--fill);border-color:var(--line);color:var(--ink);font-weight:550}
.panel .plist a b{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);font-weight:400;flex:none;width:20px}
.panel .plist a i{font-style:normal;font-size:9.5px;color:var(--ink-4);margin-left:auto;flex:none}

/* ---------- PRIMITIVES WIREFRAME ---------- */
.wf{padding:0}
.ph{background:var(--fill);border:1px dashed var(--line);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;color:var(--ink-4);
  font-family:var(--mono);font-size:10.5px;text-align:center;padding:8px}
.ph.solid{border-style:solid;background:var(--fill-2)}
.bar{height:9px;background:var(--fill);border-radius:3px}
.bar.d{background:#e0e3e7}
.sec{padding:22px 26px;border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:0}
body.mobile .sec{padding:16px 14px}
.row{display:flex;gap:14px}
.row.wrap{flex-wrap:wrap}
.row.mid{align-items:center}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
body.mobile .cards{grid-template-columns:1fr}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
body.mobile .grid2,body.mobile .grid3,body.mobile .grid4{grid-template-columns:1fr}
body.mobile .row.stackm{flex-direction:column}
.gap8{gap:8px}.gap6{gap:6px}.gap20{gap:20px}
.mt8{margin-top:8px}.mt14{margin-top:14px}.mt20{margin-top:20px}

h4.wt{font-size:15px;font-weight:600;letter-spacing:-.1px}
h5.wt{font-size:12.5px;font-weight:600;color:var(--ink)}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);font-weight:600}
.sub{font-size:12px;color:var(--ink-3)}
.txt{font-size:13px;color:var(--ink-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-size:24px;font-weight:650;letter-spacing:-.4px}
.mid2{font-size:17px;font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--r);
  border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-size:12.5px;font-weight:550;cursor:pointer;
  font-family:inherit;white-space:nowrap}
.btn.sec2{background:var(--paper);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:transparent;padding-left:6px;padding-right:6px}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.inp{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--paper);
  color:var(--ink-3);font-size:12.5px;min-height:36px;display:flex;align-items:center;justify-content:space-between}
.inp .v{color:var(--ink)}
.inp:focus-within{box-shadow:0 0 0 3px rgba(17,20,24,.08);border-color:var(--ink-3)}
.inlive{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;
  font-size:12.5px;color:var(--ink);padding:0}
.inlive::placeholder{color:var(--ink-4)}
.field{display:flex;flex-direction:column;gap:5px}
/* `.hint` n'était stylé que dans un `.field` : hors de ce contexte il héritait de la taille
   du parent, et un simple renvoi vers la localisation s'affichait en taille de titre. */
.hint{font-size:10.5px;color:var(--ink-4);line-height:1.5}
.field .err{font-size:10.5px;color:#a1341f}
.inp.bad{border-color:#c0705c}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);
  border-radius:14px;font-size:11px;color:var(--ink-2);background:var(--paper);white-space:nowrap}
.chip.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.o{border-style:dashed}
.dpe{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:4px;
  font-family:var(--mono);font-size:11px;font-weight:700;border:1.5px solid var(--ink-2);color:var(--ink)}
.dpe.warn{border-color:var(--ink);background:var(--fill);}
.dpe.stop{background:var(--ink);color:#fff;border-color:var(--ink)}

.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.card .body{padding:12px 13px}
.card.flat{border-radius:var(--r)}
.pad{padding:14px}
.hr{height:1px;background:var(--line-2);margin:14px 0}
.bandeau{border:1px solid var(--line);border-left:3px solid var(--ink);background:var(--fill-2);
  padding:10px 13px;border-radius:var(--r);font-size:12px;color:var(--ink-2)}

table.wt{width:100%;border-collapse:collapse;font-size:12.5px}
table.wt th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);
  padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
table.wt td{padding:11px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
table.wt td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
table.wt th.n{text-align:right}
body.mobile table.wt{display:none}
.mobonly{display:none}
body.mobile .mobonly{display:block}

/* nav appli */
.appnav{display:flex;align-items:center;gap:22px;padding:12px 26px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:30;background:var(--paper)}
body.mobile .appnav{padding:11px 14px;gap:12px}
.logo{width:88px;height:22px;background:var(--fill);border:1px dashed var(--line);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--ink-4);flex:none}
.appnav .lk{font-size:12.5px;color:var(--ink-2);cursor:pointer}
.appnav .lk.on{color:var(--ink);font-weight:600}
body.mobile .appnav .lk{display:none}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--fill);border:1px dashed var(--line);flex:none}
.burger{display:none;width:22px;height:16px;flex-direction:column;justify-content:space-between}
.burger i{height:2px;background:var(--ink-3);display:block}
body.mobile .burger{display:flex}

/* stepper */
.stepper{display:flex;align-items:center;gap:0}
.stepper .st{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.stepper .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);flex:none}
.stepper .st.on .dot{border-color:var(--ink);background:var(--ink);color:#fff}
.stepper .st.done .dot{border-color:var(--ink);color:var(--ink)}
.stepper .st span{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper .st.on span{color:var(--ink);font-weight:600}
.stepper .ln{height:1px;background:var(--line);flex:1;margin:0 10px;min-width:14px}
body.mobile .stepper .st span{display:none}

/* galerie fiche */
.gal{height:320px}
.gal .thumbs{width:210px;flex:none;height:100%}
body.mobile .gal{height:auto}
body.mobile .gal .thumbs{display:none}
.galmob{display:none}
body.mobile .galmob{display:flex;justify-content:center;margin-top:8px}
.side{width:308px;flex:none}
body.mobile .side{width:100%}
body.mobile .side .card{position:static}

/* skeleton */
@keyframes sk{0%,100%{opacity:.55}50%{opacity:1}}
.sk{background:var(--fill);border-radius:4px;animation:sk 1.3s ease-in-out infinite}

/* variation de prix */
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;
  font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
  background:var(--fill-2);color:var(--ink)}
.delta.up{border-color:#c8b48a}
.tl{position:relative;padding-left:20px}
.tl:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0}
.tl .ev:before{content:'';position:absolute;left:-18px;top:13px;width:9px;height:9px;border-radius:50%;
  background:var(--paper);border:2px solid var(--line-2)}
.tl .ev.now:before{background:var(--ink);border-color:var(--ink)}

/* score sur la carte */
.thumb{position:relative}
.sbadge{position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:5px;
  background:var(--ink);color:var(--paper);border-radius:5px;padding:4px 8px;font-family:var(--mono);
  font-size:12px;font-weight:700;letter-spacing:-.2px}
.sbadge s{text-decoration:none;font-size:9px;font-weight:500;opacity:.7}
.sbadge.mid{background:#6b6f78}
.sbadge.low{background:#9aa0aa}
.fav{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;
  background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--ink-3);padding:0;cursor:pointer;font-family:inherit}
.fav.on{color:var(--ink);border-color:var(--ink)}
/* Le focus clavier doit se voir : sans anneau, naviguer au Tab revient à naviguer à l'aveugle. */
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
/* Annoncé aux lecteurs d'écran, invisible à l'œil — l'arrivée des résultats est une
   information, même quand elle n'a pas de place à l'écran. */
.sronly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* Tant qu'une feuille est ouverte, la page derrière ne bouge plus : scroller dans une
   popup ne doit pas déplacer l'écran qu'on y reviendra lire. */
body.popopen{overflow:hidden}
.sbar{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:5px}
.sbar i{display:block;height:100%;background:var(--ink-2)}

/* estimation · confiance · IA */
.conf{display:inline-flex;align-items:center;gap:5px}
.conf i{width:7px;height:11px;background:var(--line);border-radius:1px;display:block}
.conf i.f{background:var(--ink-2)}
.disc{font-size:10.5px;color:var(--ink-3);font-style:italic}
.range{position:relative;height:34px;margin:10px 0 4px}
.range .track{position:absolute;top:14px;left:0;right:0;height:5px;background:var(--fill);border-radius:3px}
.range .band{position:absolute;top:14px;height:5px;background:var(--ink-4);border-radius:3px}
.range .mk{position:absolute;top:7px;width:2px;height:19px;background:var(--ink)}
.range .lab{position:absolute;top:-2px;font-family:var(--mono);font-size:10px;color:var(--ink-3);transform:translateX(-50%)}
.score{display:flex;align-items:baseline;gap:3px}
.score b{font-size:38px;font-weight:650;letter-spacing:-1px;line-height:1}
.score span{font-size:15px;color:var(--ink-3)}
.crit{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.crit:last-child{border-bottom:0}
.crit .n2{font-family:var(--mono);font-size:11.5px;color:var(--ink);width:38px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.crit .track2{flex:1;height:5px;background:var(--fill);border-radius:3px;overflow:hidden}
.crit .track2 i{display:block;height:100%;background:var(--ink-2)}
.ia{border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:var(--r);padding:13px 15px;background:var(--fill-2)}
.ia ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:7px}
.ia li{display:flex;gap:8px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.ia li em{font-family:var(--mono);font-style:normal;color:var(--ink-4);flex:none}

/* annotations — désactivées dans le prototype client */
.pin{display:none}
.notes{display:none}

.hot{cursor:pointer}
.hot:hover{outline:2px solid var(--ink-4);outline-offset:2px}
.linkish{color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;
  padding:52px 20px;text-align:center}
.empty .ico{width:44px;height:44px;border:1.5px dashed var(--line);border-radius:8px}
.empty p{font-size:13px;color:var(--ink-2);max-width:44ch}

/* ---------- POPUP DE DÉTAIL (divulgation progressive) ---------- */
.pop-ov{position:fixed;inset:0;z-index:80;background:rgba(12,14,17,.45);display:none;
  align-items:center;justify-content:center;padding:20px}
.pop-ov.open{display:flex}
.pop{background:var(--paper);border:1px solid var(--line);border-radius:10px;width:100%;
  max-width:540px;max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 12px 40px rgba(0,0,0,.22);overflow:hidden}
.pop .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:16px 18px 12px;border-bottom:1px solid var(--line-2)}
.pop .phead h5{font-size:14px;font-weight:650;letter-spacing:-.1px}
.pop .phead .sub{margin-top:2px}
/* le bouton de fermeture sert aussi au panneau latéral — jamais scopé à .pop */
.pclose{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);
  width:26px;height:26px;border-radius:50%;cursor:pointer;flex:none;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0}
.pclose:hover{background:var(--fill);color:var(--ink)}
.pop .pbody{padding:16px 18px;overflow-y:auto}
.pop .pfoot{padding:12px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap;align-items:center}
/* jeton cliquable : discret au repos, explicite au survol */
.more{cursor:pointer;border-bottom:1px dashed var(--ink-4)}
.more:hover{border-bottom-color:var(--ink);color:var(--ink)}

/* mode global — segmenté (utilisé dans le hero de l'accueil) */
.modeseg{display:flex;border:1.5px solid var(--ink);border-radius:20px;padding:2px;flex:none}
.modeseg button{font:inherit;font-size:12px;font-weight:550;padding:5px 13px;border:0;background:transparent;
  color:var(--ink-2);border-radius:16px;cursor:pointer;white-space:nowrap}
.modeseg button.on{background:var(--ink);color:#fff}
body.mobile .modeseg button{padding:5px 10px;font-size:11.5px}

/* rangée de filtres façon Airbnb — sous la nav, au-dessus des résultats */
.fbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar .chip{flex:none;padding:6px 13px;font-size:12px}
.fbar .fsep{width:1px;height:24px;background:var(--line);flex:none}

/* pilule de recherche dans la nav — la recherche vit dans la barre */
.navsearch{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:24px;
  background:var(--paper);padding:4px 5px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;
  flex:0 1 580px;min-width:0;transition:box-shadow .18s ease}
/* bascule « ✦ Décrire » — un seul jeton dans la pilule, le bloc se transforme sur place */
.ns-tog{flex:none;display:flex;align-items:center;gap:5px;margin-left:auto;padding:5px 12px;
  border-radius:16px;background:var(--fill);color:var(--ink-2);font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease}
.ns-tog:hover{background:var(--line-2)}
.ns-tog.on{background:var(--ink);color:#fff}

/* la pilule transformée en champ de saisie — même bloc, déployé */
.navsearch.iaopen{flex:1 1 700px;max-width:760px;flex-direction:column;align-items:stretch;
  border-radius:18px;cursor:default;padding:8px 10px;border-color:var(--ink)}
.ns-r1{display:flex;align-items:center;gap:10px}
.iain{flex:1;border:0;outline:0;font:inherit;font-size:13.5px;color:var(--ink);
  background:transparent;min-width:0}
.iain::placeholder{color:var(--ink-4)}
.ns-sugg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:9px 4px 3px;border-top:1px solid var(--line-2);margin-top:9px;
  animation:fadeIn .2s ease-out}
.navsearch:hover{box-shadow:0 3px 12px rgba(0,0,0,.12)}
.ns-mode{display:flex;background:var(--fill);border-radius:16px;padding:2px;flex:none;margin-right:4px}
.ns-mode button{font:inherit;font-size:11px;font-weight:600;padding:4px 10px;border:0;border-radius:13px;
  background:transparent;color:var(--ink-3);cursor:pointer;white-space:nowrap;
  transition:background .15s ease,color .15s ease}
.ns-mode button.on{background:var(--ink);color:#fff}
.ns-seg{font-size:12px;color:var(--ink);font-weight:550;padding:0 11px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line-2)}
.ns-seg:first-of-type{border-left:0}
.ns-seg.mut{color:var(--ink-3);font-weight:400}
.ns-go{width:27px;height:27px;border-radius:50%;background:var(--ink);color:#fff;display:flex;
  align-items:center;justify-content:center;flex:none;margin-left:auto;font-size:13px}
body.mobile .ns-seg.opt{display:none}

/* icônes nav droite */
.navico{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:15px;
  cursor:pointer;flex:none;background:var(--paper);transition:background .15s ease}
.navico:hover{background:var(--fill)}
.navico .bdg{position:absolute;top:-4px;right:-5px;background:var(--ink);color:#fff;font-size:9px;
  font-family:var(--mono);border-radius:8px;padding:1px 4px;line-height:1.3}
/* photo du user connecté — initiales sur fond photo (placeholder) */
.navico.photo{background:repeating-linear-gradient(45deg,#c7ccd3 0 4px,#d6dade 4px 8px);
  border-color:var(--ink-4);color:var(--ink);font-size:11px;font-weight:650;letter-spacing:.3px}

/* panneau latéral droit — favoris & recherches, pousse le contenu */
.appwrap{display:flex;align-items:stretch}
.appwrap .wf{flex:1;min-width:0}
.rpanel{width:0;flex:none;overflow:hidden;border-left:0 solid var(--line);background:var(--paper);
  transition:width .28s ease}
.rpanel.open{width:324px;border-left-width:1px}
.rpanel .rin{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:14px;width:324px}
.rhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.rhead .sidetabs{flex:1;margin-top:0}
.rrow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-radius:6px;cursor:pointer}
.rrow:hover{background:var(--fill-2)}
.rrow .rth{width:56px;height:42px;flex:none;background:var(--fill);border:1px dashed var(--line);border-radius:4px}
.rrow .rtx{min-width:0;flex:1}
.rrow .rtx b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rtx span{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* mobile : bottom sheet — cohérent avec les popins */
body.mobile .rpanel{position:fixed;left:0;right:0;top:auto;bottom:var(--pbarH,54px);width:100%;
  height:auto;max-height:66vh;transform:translateY(112%);transition:transform .3s ease;border-left:0;
  border-top:1px solid var(--line);border-radius:14px 14px 0 0;background:var(--paper);z-index:46;
  overflow:hidden}
body.mobile .rpanel.open{transform:none;width:100%;box-shadow:0 -10px 34px rgba(0,0,0,.2)}
body.mobile .rpanel .rin{width:100%;max-height:100%}
/* tablette : tiroir par-dessus + voile — on ne pousse plus le contenu */
body.tablet .rpanel{position:fixed;top:0;right:0;bottom:var(--pbarH,54px);width:340px;
  transform:translateX(112%);transition:transform .28s ease;border-left:1px solid var(--line);
  background:var(--paper);z-index:46;overflow:hidden}
body.tablet .rpanel.open{transform:none;width:340px;box-shadow:-12px 0 40px rgba(0,0,0,.22)}
body.tablet .rpanel .rin{width:340px;max-height:100%}

/* ---------- APERÇU FORCÉ : rabattre les surfaces fixes sur le cadre ----------
   Le rendu simulé est un bloc centré (390 px en mobile, 768 px en tablette), mais tout ce
   qui est en position:fixed se cale sur la FENÊTRE et non sur lui. Depuis un grand écran,
   la démo montrait donc un bottom sheet de 1350 px coiffant un écran de 390 px — le format
   qu'on voulait justement démontrer était le seul à ne pas être respecté.
   On rabat les trois surfaces concernées : le sheet, son voile, et le tiroir favoris.
   Aucun effet en mode Auto (pas de classe .ovr) : cadre et fenêtre y coïncident déjà. */
body.ovr .pop-ov,
body.ovr .pscrim.open{margin-inline:auto}
body.ovr.mobile .pop-ov,
body.ovr.mobile .pscrim.open{max-width:390px}
body.ovr.tablet .pop-ov,
body.ovr.tablet .pscrim.open{max-width:768px}
/* le tiroir mobile reste centré sans toucher à sa transform d'ouverture */
body.ovr.mobile .rpanel{max-width:390px;margin-inline:auto}
/* le tiroir tablette s'ancre au bord droit du cadre, plus à celui de la fenêtre */
body.ovr.tablet .rpanel{right:calc(50% - 384px)}
/* voile derrière le panneau (mobile + tablette) */
.pscrim{display:none}
body.mobile .pscrim.open,body.tablet .pscrim.open{display:block;position:fixed;inset:0;
  background:rgba(12,14,17,.45);z-index:44;animation:fadeIn .2s ease-out}

/* analyse compacte — une ligne par dimension, sous la description */
.fmrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line-2);cursor:pointer}
.fmrow:last-child{border-bottom:0}
.fmrow:hover{background:var(--fill-2)}
.fmrow .k{width:148px;flex:none;font-size:12.5px;color:var(--ink-2)}
body.mobile .fmrow .k{width:110px}
.fmrow b{font-size:12.5px;color:var(--ink);font-weight:600;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.fmrow .chev{color:var(--ink-4);flex:none;font-size:14px}

/* onglets du module d'analyse en colonne droite */
.sidetabs{display:flex;background:var(--fill);border-radius:6px;padding:2px;margin-top:10px}
.sidetabs button{font:inherit;flex:1;font-size:11px;padding:5px 4px;border:0;background:transparent;
  color:var(--ink-3);border-radius:4px;cursor:pointer;font-weight:550}
.sidetabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.siderow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:12.5px}
.siderow span:first-child{color:var(--ink-2)}
.siderow .num{font-weight:600}
/* le prix de la colonne droite est UN seul objet cliquable : l'outline de survol doit l'englober
   en entier, sinon rien ne dit que le clic vaut pour le bloc et pas pour la ligne visée */
.pxblock{border-radius:var(--r)}
.pxblock:hover{outline-offset:6px}

/* barre CTA sticky — fiche en mobile : score + action toujours visibles.
   --pbarH est mesurée en JS : la CTA se cale toujours juste au-dessus des contrôles. */
.mobcta{display:none}
body.mobile .mobcta{display:flex;position:fixed;bottom:var(--pbarH,54px);left:50%;transform:translateX(-50%);
  width:min(390px,calc(100% - 8px));z-index:45;background:var(--paper);border:1px solid var(--line);
  border-bottom:0;border-radius:10px 10px 0 0;padding:10px 14px;gap:14px;align-items:center;
  box-shadow:0 -6px 20px rgba(0,0,0,.14);animation:ctaUp .3s ease-out}
body.mobile .stage{padding-bottom:calc(var(--pbarH,54px) + 96px)}
.mobcta .msc{display:flex;flex-direction:column;flex:none;line-height:1.2}
.mobcta .msc b{font-size:17px;font-weight:650}
@keyframes ctaUp{from{transform:translate(-50%,60px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- TABLETTE (768 px) ---------- */
body.tablet .frame{max-width:768px}
body.tablet .frame-cap{max-width:768px}
body.tablet .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
body.tablet .grid4{grid-template-columns:repeat(2,1fr)}
body.tablet .grid3{grid-template-columns:repeat(2,1fr)}
body.tablet .side{width:272px}
body.tablet .ns-seg.mut.opt{display:none}
body.tablet .confstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
/* la colonne droite sticky se cale sous la nav sticky (hauteur mesurée) */
.side .card[style]{top:calc(var(--navH,58px) + 12px)!important}

/* ---------- MOBILE renforcé ---------- */
/* nav mobile 1 ligne : capsule de recherche à la place de la pilule */
body.mobile .appnav .logo{display:none}
.mobsearch{display:none}
body.mobile .navsearch{display:none!important}
body.mobile .appnav > div[style="flex:1"]{display:none}
body.mobile .mobsearch{display:flex;align-items:center;flex:1;min-width:0;
  border:1.5px solid var(--line);border-radius:22px;background:var(--paper);padding:9px 14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;font-size:12.5px;font-weight:550;
  color:var(--ink)}
.mobsearch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* header résultats : les deux actions partagent une ligne */
body.mobile .resacts{width:100%;flex-wrap:nowrap}
body.mobile .resacts .btn{flex:1;min-width:0;padding:6px 6px;font-size:10.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* barre de filtres sticky sous la nav — hauteur mesurée */
body.mobile .fbar{position:sticky;top:var(--navH,54px);z-index:25;background:var(--paper);
  padding-top:6px;margin-top:-6px}

/* ---------- GALERIE FICHE ---------- */
/* desktop + tablette : mosaïque (1 grande + 2 vignettes) */
.gal2{display:grid;grid-template-columns:1fr 210px;grid-template-rows:1fr 1fr;gap:8px;height:320px}
body.tablet .gal2{grid-template-columns:1fr 150px;height:290px}
.gal2 .gcell{position:relative;cursor:pointer;background:var(--fill);border:1px dashed var(--line);
  border-radius:var(--r);display:flex;align-items:center;justify-content:center;
  color:var(--ink-4);font-family:var(--mono);font-size:10.5px;overflow:hidden}
.gal2 .gcell:hover{outline:2px solid var(--ink-4);outline-offset:1px}
.gal2 .gmain{grid-row:1/3}
.gal2 .gmore{position:absolute;right:8px;bottom:8px}
/* mobile : carrousel edge-to-edge en scroll-snap */
.gcar{display:none}
body.mobile .gcar{display:block;position:relative;margin:0 -14px}
.gcar .gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gcar .gtrack::-webkit-scrollbar{display:none}
.gcar .gslide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;background:var(--fill);
  border:1px dashed var(--line);border-left:0;border-right:0;display:flex;flex-direction:column;
  gap:6px;align-items:center;justify-content:center;color:var(--ink-4);
  font-family:var(--mono);font-size:10.5px;cursor:pointer}
.gcar .gcount{position:absolute;right:10px;bottom:40px;background:rgba(17,20,24,.75);color:#fff;
  border-radius:12px;padding:3px 9px;font-family:var(--mono);font-size:10.5px;pointer-events:none}
.gcar .gact{position:absolute;top:10px;right:10px;display:flex;gap:8px}
.gcar .gdots{display:flex;gap:5px;justify-content:center;padding:9px 0 2px}
.gcar .gdots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;
  transition:background .2s ease}
.gcar .gdots i.on{background:var(--ink)}
body.mobile .gal2{display:none}
body.mobile .fichacts{display:none}
/* les onglets de mode de recherche ne se coupent jamais en deux lignes : « ⌕ » au-dessus de
   « Critères » se lit comme un bug, et la barre de la home est la première chose qu'on voit */
.sidetabs button{white-space:nowrap}

/* confort tactile */
body.mobile .btn{min-height:40px}
body.mobile .chip{padding:6px 12px}
/* Une pastille CLIQUABLE est un contrôle, pas une étiquette : elle respecte les 44 px comme les
   boutons. Les pastilles décoratives (statut, compteur, DPE) gardent leur taille — les agrandir
   ferait passer de l'information pour une action. C'est la différence que porte `.hot`. */
body.mobile .chip.hot,body.tablet .chip.hot{min-height:44px;padding-top:0;padding-bottom:0}
/* popups en bottom-sheet */
body.mobile .pop-ov{align-items:flex-end;padding:0}
body.mobile .pop{max-width:100%;width:100%;border-radius:14px 14px 0 0;max-height:86vh}
body.mobile .pop-ov.open .pop{animation:sheetUp .26s ease-out}
body.mobile .pop.big{height:88vh;max-height:88vh}
/* transition d'écran mobile : fondu pur — un transform sur .wf casserait le
   position:fixed de la barre CTA pendant l'animation */
body.mobile .wf{animation:fadeIn .24s ease-out}
/* tap feedback — pas de hover au doigt */
body.mobile .card.hot:active,body.mobile .ct:active,body.mobile .fmtile:active{transform:scale(.98)}
body.mobile .card.hot:hover{transform:none;box-shadow:none}

/* ---------- ANIMATIONS ---------- */
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wf{animation:screenIn .28s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.pop-ov.open{animation:fadeIn .16s ease-out}
.pop-ov.open .pop{animation:popIn .2s ease-out}
@keyframes sheetUp{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.overlay.open{animation:fadeIn .16s ease-out}
.overlay.open .panel{animation:sheetUp .24s ease-out}
.btn{transition:transform .12s ease,opacity .15s ease,background .15s ease,border-color .15s ease}
.btn:not([disabled]):active{transform:scale(.97)}
.chip,.linkish,.more,.lk{transition:background .15s ease,color .15s ease,border-color .15s ease}
.card{transition:transform .18s ease,box-shadow .18s ease}
.card.hot:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
.ct{transition:transform .15s ease,box-shadow .15s ease}
.ct:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.07)}
.sidetabs button,.seg button,.modeseg button,.pstates button,.states button{transition:background .15s ease,color .15s ease,box-shadow .15s ease}
.sbar i,.track2 i,.estband{transform-origin:left;animation:growX .5s ease-out}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pmenu a{transition:background .15s ease,color .15s ease,border-color .15s ease}
.fav{transition:transform .15s ease}
.fav:hover{transform:scale(1.12)}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* équipements & prestations */
.eq{display:flex;gap:11px;align-items:center;padding:6px 0;font-size:13px;color:var(--ink-2)}
.eq .eqico{width:20px;height:20px;border:1.5px dashed var(--line);border-radius:4px;flex:none}
.eq.off{color:var(--ink-4);text-decoration:line-through}
.eq.off .eqico{border-style:dotted;opacity:.6}

/* bloc Analyse First Mundi — score global en jauge + 4 critères */
.fmband{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:650;letter-spacing:-.3px}
.fmtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
body.mobile .fmtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.fmtile{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:center;
  cursor:pointer;background:var(--fill-2);transition:transform .15s ease,box-shadow .15s ease}
.fmtile:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.fmtile b{display:block;font-size:16px;font-weight:650;font-family:var(--mono);margin-top:2px}

/* bande de confiance — vision globale du bien, chaque tuile ouvre le détail */
.confstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
body.mobile .confstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
body.mobile .chip{white-space:normal}

/* avis First Mundi condensé — en face du texte de l'agence */
.avrow{font-size:12px;color:var(--ink-2);padding:3px 0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.avrow em{font-family:var(--mono);font-style:normal;color:var(--ink-4);margin-right:6px;font-size:10px}
.confstrip .ct{border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;cursor:pointer;background:var(--paper)}
.confstrip .ct:hover{outline:2px solid var(--ink-4);outline-offset:1px}
.confstrip .ct .v2{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.confstrip .ct .conf{margin-top:5px}

/* grande popup d'analyse — menu latéral + ancres */
.pop.big{max-width:920px;height:84vh}
body.mobile .pop.big{height:88vh}
.pbody.split{display:flex;padding:0;overflow:hidden;flex:1;min-height:0}
.pmenu{width:198px;flex:none;border-right:1px solid var(--line-2);padding:12px 0;overflow-y:auto}
.pmenu a{display:block;padding:8px 16px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  border-left:2px solid transparent}
.pmenu a:hover{background:var(--fill-2);color:var(--ink)}
.pmenu a.on{border-left-color:var(--ink);color:var(--ink);font-weight:600;background:var(--fill)}
.pscroll{flex:1;overflow-y:auto;padding:18px 20px;min-width:0;position:relative}
.pscroll section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-2)}
.pscroll section:last-child{border-bottom:0;margin-bottom:0;padding-bottom:4px}
body.mobile .pbody.split{flex-direction:column}
body.mobile .pmenu{width:100%;display:flex;overflow-x:auto;border-right:0;
  border-bottom:1px solid var(--line-2);padding:8px 10px;gap:4px}
body.mobile .pmenu a{white-space:nowrap;border-left:0;padding:6px 11px;border-radius:14px;flex:none}
body.mobile .pmenu a.on{background:var(--ink);color:#fff}

/* estimation en premier niveau — mini-jauge */
.estmini{cursor:pointer;margin-top:9px}
.estmini:hover .estlab .linkish{color:var(--ink)}
.estmini .esttrack{position:relative;height:5px;background:var(--fill);border-radius:3px}
.estmini .estband{position:absolute;top:0;height:5px;background:#c9cdd3;border-radius:3px}
.estmini .estmk{position:absolute;top:-3px;width:2.5px;height:11px;background:var(--ink);border-radius:1px}
.estmini .estlab{display:flex;justify-content:space-between;gap:8px;margin-top:5px;
  font-size:11px;color:var(--ink-2)}
.estmini .estlab b{color:var(--ink);font-weight:600}

/* ---------- RESPONSIVE v2 — feuilles tactiles, lisibilité, CTA ---------- */
/* tablette : les popins deviennent aussi des bottom sheets — cohérence tactile */
body.tablet .pop-ov{align-items:flex-end;padding:0}
body.tablet .pop{max-width:640px;width:100%;margin:0 auto;border-radius:14px 14px 0 0;max-height:82vh}
body.tablet .pop-ov.open .pop{animation:sheetUp .26s ease-out}
body.tablet .pop.big{max-width:768px;height:86vh;max-height:86vh}

/* poignée de préhension — l'affordance « ceci se tire vers le bas » */
body.mobile .pop:before,body.tablet .pop:before,
body.mobile .panel:before,body.tablet .panel:before{
  content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);
  margin:8px auto 2px;flex:none}
body.mobile .rpanel .rin:before,body.tablet .rpanel .rin:before{
  content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);
  margin:0 auto 10px}
body.tablet .rpanel .rin:before{display:none} /* tiroir latéral : pas de poignée bas */

/* visiteur sur mobile : « Se connecter » redescend dans le menu. Les deux boutons
   d'auth mangeaient 191 px et écrasaient la capsule de recherche à 88 px — or c'est
   elle l'entrée du produit, pas le compte. */
body.mobile .authsec{display:none}
body.mobile .mobsearch{min-width:140px}

/* cartes « proposé par N agences » : sur mobile le nom se coupait en deux et le prix
   se collait au chip. On empile — identité, puis prix et lien sur leur propre ligne. */
body.mobile .agrow{flex-wrap:wrap}
body.mobile .agrow > div:first-child{flex:1 1 100%}
body.mobile .agrow > div:last-child{width:100%;justify-content:space-between}

/* les deux chiffres de chaque régime fiscal font 157 + 172 px pour 303 disponibles :
   grille à colonnes contraintes, libellés autorisés à passer à la ligne */
body.mobile .fiscfig{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body.mobile .fiscfig > div{min-width:0}
body.mobile .fiscfig .num{font-size:13px}

/* champ de saisie IA dans la feuille de recherche : la classe était posée dans le
   markup sans aucune règle — le champ s'affichait nu, sans cadre ni hauteur tactile */
.iainwrap{display:flex;align-items:center;gap:9px;border:1.5px solid var(--ink);
  border-radius:var(--r);padding:10px 12px;background:var(--paper);min-height:44px}
.iainwrap:focus-within{box-shadow:0 0 0 3px rgba(17,20,24,.08)}
/* Le champ « où » reste au-dessus de ses propres résultats : on tape, on scrolle pour lire,
   et on doit pouvoir corriger sans remonter à l'aveugle. */
.locsearch{position:sticky;top:0;z-index:3;background:var(--paper)}
/* « tout effacer » passait en tête parce que la bande filait hors écran et qu'il finissait
   hors d'atteinte. La rangée passe maintenant à la ligne : il est visible à sa place
   naturelle, à la fin. Une action destructrice en tête de barre ressemblait à un titre. */
body.mobile .fbar.fcrit .fclear{order:0;margin-left:2px;align-self:center}
body.mobile .fbar:not(.fcrit) .fclear{order:-1;margin-right:2px}

/* Et les pastilles elles-mêmes finissaient au même endroit : 1 216 px de critères dans
   329 px de large, soit un quart de visible. « DPE ≥ D » était à 900 px hors écran — aussi
   inatteignable que dans la popup qu'on refuse d'imposer. Or toute la raison d'être de
   cette barre est qu'un critère se retire LÀ où il se lit. Sur mobile elles passent donc à
   la ligne : les huit sont visibles, chaque ✕ est sous le pouce. Le prix est la hauteur —
   on rend donc le sticky à la seule barre qui peut se le permettre, celle qui ajoute.
   Le défilement horizontal reste bon pour « Affiner » : y manquer une suggestion ne coûte
   rien, manquer un critère actif coûte la recherche. */
body.mobile .fbar.fcrit{flex-wrap:wrap;row-gap:6px;overflow-x:visible;position:static;
  padding-top:0;margin-top:0}

/* états vides : les actions se mettent côte à côte et débordaient de 15 px */
body.mobile .empty .row{flex-wrap:wrap;justify-content:center}
/* jauge d'estimation : les bornes sont centrées sur leur repère, donc elles mordent
   hors du rail. On rétrécit le rail pour leur laisser la place, plutôt que de les tronquer. */
body.mobile .range{margin:10px 10px 4px}
body.mobile .range .lab{font-size:9.5px}

/* fermeture : cible tactile réelle, pas une pastille de 26 px */
body.mobile .pclose,body.tablet .pclose{width:36px;height:36px;font-size:14px}

/* pied de feuille : les actions passent au pouce, pleine largeur */
body.mobile .pop .pfoot .btn{flex:1 1 auto;min-height:44px}
body.tablet .pop .pfoot .btn{min-height:44px}

/* safe areas iOS — la barre proto et les feuilles respectent l'encoche */
.pbar{padding-bottom:calc(9px + env(safe-area-inset-bottom))}
body.mobile .pop .pfoot,body.tablet .pop .pfoot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
body.mobile .pop .pbody{padding-bottom:calc(16px + env(safe-area-inset-bottom))}

/* lisibilité mobile — textes et cibles remontés aux minima tactiles */
body.mobile .txt{font-size:14px}
body.mobile .sub{font-size:12.5px}
body.mobile .lbl{font-size:10.5px}
body.mobile h4.wt{font-size:17px}
body.mobile h5.wt{font-size:13.5px}
body.mobile .big{font-size:26px}
body.mobile .btn{min-height:44px;font-size:13px}
body.mobile .btn.sm{min-height:40px;font-size:12px}
body.mobile .inp{min-height:44px;font-size:13.5px}
body.mobile .iain{font-size:16px} /* < 16px déclenche le zoom auto iOS au focus */
body.mobile .chip{font-size:12px}
body.mobile .fmrow{padding:11px 4px}
body.mobile .rrow{padding:11px 6px}
/* tablette : cibles tactiles aussi — c'est un écran au doigt, pas à la souris */
body.tablet .btn{min-height:42px}
body.tablet .chip{padding:5px 11px}
body.tablet .inp{min-height:42px}

/* tablette : le CTA reste visible sans attendre le scroll — barre flottante compacte,
   même contenu que la barre mobile, ancrée au-dessus des contrôles */
body.tablet .mobcta{display:flex;position:fixed;bottom:calc(var(--pbarH,54px) + 12px);right:16px;
  left:auto;transform:none;width:340px;z-index:45;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;gap:14px;align-items:center;
  box-shadow:0 8px 28px rgba(0,0,0,.16);animation:fadeIn .3s ease-out}
body.tablet .stage{padding-bottom:calc(var(--pbarH,54px) + 96px)}
/* le chiffre de la barre CTA ouvre son détail en bottom sheet : un score affiché en
   permanence sans moyen de savoir d'où il sort est une impasse. Cible tactile pleine
   hauteur de barre, chevron pour l'affordance, retour tactile à l'appui. */
body.mobile .mobcta .msc,body.tablet .mobcta .msc{cursor:pointer;border-radius:8px;
  padding:5px 9px;margin:-5px -9px;min-height:44px;justify-content:center}
body.mobile .mobcta .msc:active,body.tablet .mobcta .msc:active{background:var(--fill)}
.mchev{font-style:normal;font-weight:400;color:var(--ink-3);font-size:15px;margin-left:4px}

/* la barre flottante ne double jamais le bouton de la colonne : elle prend le relais
   dès qu'il quitte l'écran, et s'efface dès qu'il revient. Un seul CTA à la fois. */
.mobcta{transition:opacity .22s ease}
body.mobile .mobcta.off,body.tablet .mobcta.off{opacity:0;visibility:hidden;pointer-events:none}

/* l'URL stable de l'agence est une annotation technique : sous 1080 px elle passe
   à la ligne au lieu d'écraser le nom de l'agence (réduit à 23 px sinon) */
body.tablet .urlchip,body.mobile .urlchip{flex:1 0 100%;justify-content:flex-start;
  white-space:normal;word-break:break-all;font-size:10.5px}

/* composants : les tuiles stats restent scannables en 2 colonnes */
body.mobile .grid4{grid-template-columns:repeat(2,1fr)}
/* 4 tuiles de score dans une colonne de 378 px tronquent « LOCALISATION » : 2 suffisent */
body.tablet .fmtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
/* stepper : l'étape active garde son libellé */
body.mobile .stepper .st.on span{display:inline}
/* cadre mobile bord à bord sur petit viewport réel */
body.mobile .stage{padding:14px 8px calc(var(--pbarH,54px) + 96px)}
/* ---- catalogue d'acheteurs : sélection en place (remplace le panier) ---- */
.ckb{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;background:var(--paper);
  font-size:11px;line-height:1;color:var(--paper);cursor:pointer;align-self:center}
.ckb:hover{border-color:var(--ink)}
.ckb.on{background:var(--ink);border-color:var(--ink)}
.selbar{position:sticky;bottom:12px;z-index:20;box-shadow:0 10px 34px rgba(0,0,0,.16);
  background:var(--paper)}
</style>
</head>
<body>

<main class="stage">
  <div class="frame" id="frame"></div>
</main>

<div class="pop-ov" id="popov"><div class="pop" id="popbox"></div></div>

<div class="pbar">
  <div class="grp">
    <button class="pbtn" id="menu">☰ Écrans</button>
    <button class="pbtn" id="prev">←</button>
    <button class="pbtn" id="next">→</button>
  </div>
  <div class="ptitle">
    <b id="ptitle"></b>
    <span id="ppos"></span>
  </div>
  <div class="sep"></div>
  <div class="grp" style="flex:1;min-width:0">
    <span class="stlbl">État</span>
    <div class="pstates" id="pstates"></div>
  </div>
  <div class="seg" id="auth">
    <button data-a="in" class="on">Connecté</button>
    <button data-a="out">Visiteur</button>
  </div>
  <div class="seg" id="dev">
    <button data-dev="auto" class="on">Auto</button>
    <button data-dev="desktop">Desktop</button>
    <button data-dev="tablet">Tablette</button>
    <button data-dev="mobile">Mobile</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>Tous les écrans du prototype</h2>
    <div class="phint">Cliquer pour ouvrir un écran · flèches ← → pour avancer · touches 1-9 pour changer d'état · Échap pour fermer</div>
    <div id="plist"></div>
  </div>
</div>

<script>
/* =======================================================================
   HELPERS
   ======================================================================= */
const h = (s) => s.join ? s.join('') : s;
const ph = (label, height, extra='') => `<div class="ph ${extra}" style="height:${height}px">${label}</div>`;

/* fausse carte statique — quartier signalé, adresse jamais pointée */
const fakemap = (label, h=230) => `
  <div style="position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden">
    <svg viewBox="0 0 800 ${h}" preserveAspectRatio="xMidYMid slice"
      style="display:block;width:100%;height:${h}px;background:#edeff1">
      <g fill="#e2e5e8">
        <rect x="18" y="14" width="160" height="78" rx="3"/><rect x="18" y="120" width="160" height="90" rx="3"/>
        <rect x="230" y="14" width="100" height="78" rx="3"/><rect x="230" y="120" width="100" height="90" rx="3"/>
        <rect x="370" y="14" width="120" height="78" rx="3"/><rect x="370" y="120" width="120" height="90" rx="3"/>
        <rect x="540" y="14" width="90" height="196" rx="3"/>
      </g>
      <rect x="60" y="128" width="80" height="70" rx="3" fill="#dfe4de"/>
      <g stroke="#fff" stroke-width="11" fill="none">
        <path d="M0 103 H800"/><path d="M205 0 V${h}"/><path d="M515 0 V${h}"/>
      </g>
      <g stroke="#fff" stroke-width="4.5" fill="none">
        <path d="M0 40 H800"/><path d="M0 168 H800"/><path d="M348 0 V${h}"/>
        <path d="M100 0 V${h}"/><path d="M515 ${h} L800 30"/>
      </g>
      <path d="M660 -10 L730 ${h+10} L790 ${h+10} L716 -10 Z" fill="#d8dee5"/>
      <circle cx="330" cy="${Math.round(h/2)}" r="74" fill="rgba(17,20,24,.055)"
        stroke="#111418" stroke-width="1.5" stroke-dasharray="5 4"/>
      <circle cx="330" cy="${Math.round(h/2)}" r="4.5" fill="#111418"/>
    </svg>
    <span class="chip" style="position:absolute;left:10px;bottom:10px;background:var(--paper)">${label} · zone approximative</span>
    <div style="position:absolute;right:10px;top:10px;display:flex;flex-direction:column;border:1px solid var(--line);
      border-radius:5px;overflow:hidden;background:var(--paper)">
      <span style="padding:3px 8px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--line-2)">+</span>
      <span style="padding:3px 8px;font-size:13px;color:var(--ink-2)">−</span>
    </div>
  </div>`;
const pin = n => `<span class="pin">${n}</span>`;
/* la phrase d'exemple du mode « Décrire » parle le langage du mode actif : citer un rendement
   à un acquéreur qui cherche une mensualité rendrait l'interprétation incohérente. */
const IAPHRASE = () => MODE==='home'
  ? 'Un T3 sur Lyon pour y vivre, pas trop de travaux, dans les 1 300 € par mois'
  : 'Un T3 sur Lyon avec un bon rendement, pas trop de travaux, dans les 300 000 €';
const nbsp = s => s.replace(/ (€|%|m²|\/mois)/g,'&nbsp;$1').replace(/(\d) (\d)/g,'$1&nbsp;$2');
/* « 289 000 € » → 289000, pour trier des montants restés lisibles dans la donnée */
const eur = s => parseInt(String(s).replace(/[^\d]/g,''),10) || 0;
const inp = (label, value, opts={}) => `
  <div class="field">
    <div class="lbl">${label}</div>
    <div class="inp ${opts.bad?'bad':''}">
      <span class="${value?'v':''}">${value || opts.placeholder || '—'}</span>
      ${opts.suffix?`<span class="sub">${opts.suffix}</span>`:''}
    </div>
    ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}
    ${opts.err?`<div class="err">${opts.err}</div>`:''}
  </div>`;
/* Le champ qui porte vraiment un critère. `inp` dessine un champ ; celui-ci en est un —
   il écrit dans CRIT à la frappe, et ne re-rend la feuille qu'à la sortie du champ, pour ne
   pas faire sauter le curseur à chaque caractère. */
const inpLive = (label, key, opts={}) => `
  <div class="field">
    <div class="lbl"><label for="in-${key}">${label}</label></div>
    <div class="inp">
      <input id="in-${key}" class="inlive" value="${CRIT[key]||''}"
        placeholder="${opts.placeholder||'—'}" autocomplete="off"
        oninput="critInput('${key}', this.value)"
        onchange="critRedraw('${opts.pop||''}')">
    </div>
    ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}
  </div>`;
/* Une pastille de critère : cochée ou non selon CRIT, cliquable, atteignable au clavier.
   Elle remplace les pastilles décoratives dont l'état était écrit en dur dans le gabarit. */
const critChip = (label, key, val, pop) => `<span class="chip hot ${critHas(key,val)?'k':''}"
  role="button" tabindex="0" aria-pressed="${critHas(key,val)}"
  onclick="critToggle('${key}','${String(val).replace(/'/g,"\\'")}','${pop||''}')"
  onkeydown="kbd(event,()=>critToggle('${key}','${String(val).replace(/'/g,"\\'")}','${pop||''}'))">${label}</span>`;

const conf = (n, label) => `<span class="conf">${[1,2,3,4].map(i=>
  `<i class="${i<=n?'f':''}"></i>`).join('')}<span class="sub" style="margin-left:3px">${label}</span></span>`;

/* jauge circulaire du score global */
const ring = v => { const p = parseFloat(String(v).replace(',','.'))/10, C = 2*Math.PI*26;
  return `<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="26" fill="none" stroke="var(--fill)" stroke-width="6"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="var(--ink)" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}"
      transform="rotate(-90 32 32)"/>
  </svg><b class="num">${v}</b></div>`; };
const stepper = (steps, active) => `
  <div class="stepper">${steps.map((s,i)=>`
    <div class="st ${i===active?'on':''} ${i<active?'done':''}">
      <div class="dot">${i<active?'✓':i+1}</div><span>${s}</span>
    </div>${i<steps.length-1?'<div class="ln"></div>':''}`).join('')}
  </div>`;

const USER_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`;

/* la recherche vit dans la nav — mode + critères, différents selon J'investis / J'habite.
   Switch ⌕ critères / ✦ phrase : en mode phrase la nav se déploie, et se replie au blur. */
const navSearch = () => {
  const modeSeg = `
    <div class="ns-mode" onclick="event.stopPropagation()">
      <button class="${MODE==='invest'?'on':''}" onclick="setMode('invest')">J'investis</button>
      <button class="${MODE==='home'?'on':''}" onclick="setMode('home')">J'habite</button>
    </div>`;
  const tog = on => `<span class="ns-tog ${on?'on':''}" role="button" tabindex="0"
    title="${on?'Revenir à la recherche par critères':'Décrire ce que je cherche en une phrase'}"
    onclick="event.stopPropagation();setSMode('${on?'criteres':'ia'}')"
    onkeydown="kbd(event,()=>setSMode('${on?'criteres':'ia'}'))">✦ Décrire</span>`;

  /* le bloc transformé : la pilule devient champ de saisie, suggestions intégrées */
  if (SMODE==='ia' && IAFOCUS) return `
  <div class="navsearch iaopen" onclick="event.stopPropagation()">
    <div class="ns-r1">
      ${modeSeg}
      <input id="iainput" class="iain" value="${IAQ}"
        placeholder="Décrivez ce que vous cherchez, comme vous l'expliqueriez à un agent immobilier…"
        oninput="IAQ=this.value" onkeydown="if(event.key==='Enter')iaValider()"
        onblur="iaBlur()">
      ${tog(true)}
      <button class="btn sm" style="flex:none" onmousedown="event.preventDefault()"
        onclick="iaValider()">Valider</button>
    </div>
    <div class="ns-sugg">
      <span class="sub" style="flex:none">Suggestions :</span>
      ${(MODE==='home'
        ? ['sans travaux','proche des écoles','avec balcon ou terrasse','dernier étage','avec garage']
        : ['cash-flow positif','immeuble de rapport','DPE D minimum','baisse de prix récente','vendu loué'])
        .map(t=>`<span class="chip hot" onmousedown="event.preventDefault()"
          onclick="iaAdd('${t}')">${t}</span>`).join('')}
    </div>
  </div>`;

  /* mode phrase replié : la pilule montre la phrase, re-clic pour éditer */
  if (SMODE==='ia') return `
  <div class="navsearch" onclick="setIAFocus(true)" title="Reprendre la saisie">
    ${modeSeg}
    <span class="ns-seg mut" style="flex:1">« ${IAQ || IAPHRASE()} »</span>
    ${tog(true)}
    <button class="btn sm" style="flex:none;margin-left:6px"
      onclick="event.stopPropagation();iaValider()">Valider</button>
  </div>`;

  /* pas encore de recherche — arrivée directe sur un bien ou un résultat */
  if (!HASQ) return `
  <div class="navsearch" onclick="POP.recherche()" title="Commencer une recherche">
    ${modeSeg}
    <span class="ns-seg mut" style="flex:1">Commencer une recherche — ville, budget…</span>
    ${tog(false)}
    <div class="ns-go" style="margin-left:6px">⌕</div>
  </div>`;

  /* mode critères — clic : modifier la recherche existante.
     Le segment de gauche ouvre directement le choix de zones : c'est le critère qu'on change le
     plus souvent en cours de session, il ne doit pas coûter un aller-retour par la popup générale.
     Le ↺ donne l'historique sans quitter l'écran — sinon « retrouver ma recherche d'hier » oblige
     à passer par le compte, et personne ne le fait. */
  return `
  <div class="navsearch" onclick="POP.recherche()" title="Modifier ma recherche">
    ${modeSeg}
    <span class="ns-seg hot" role="button" tabindex="0" title="Changer de zone"
      onclick="event.stopPropagation();POP.localisation()"
      onkeydown="kbd(event,()=>POP.localisation())">${zonesLbl()||'Où ?'}</span>
    ${(()=>{
      /* les deux segments suivants montrent les critères RÉELS et s'ouvrent là où on les
         modifie : sinon la barre affiche un budget que la recherche n'a plus. */
      const prix = MODE==='home' ? (CRIT.mens && '≤ '+CRIT.mens) : (CRIT.budget && '≤ '+CRIT.budget);
      const sec  = MODE==='home'
        ? (CRIT.pieces.length ? CRIT.pieces.join(' · ') : '')
        : (CRIT.rdt ? 'Rendement ≥ '+CRIT.rdt : '');
      return `${prix?`<span class="ns-seg opt num hot" role="button" tabindex="0" title="Modifier le budget"
          onclick="event.stopPropagation();POP.recherche()"
          onkeydown="kbd(event,()=>POP.recherche())">${nbsp(prix)}</span>`:''}
        ${sec?`<span class="ns-seg opt mut hot" role="button" tabindex="0" title="Modifier ce critère"
          onclick="event.stopPropagation();POP.recherche()"
          onkeydown="kbd(event,()=>POP.recherche())">${nbsp(sec)}</span>`:''}`;})()}
    ${tog(false)}
    <span class="ns-tog" role="button" tabindex="0" title="Mes recherches récentes"
      onclick="event.stopPropagation();POP.recentes()"
      onkeydown="kbd(event,()=>POP.recentes())">↺</span>
    <div class="ns-go" role="button" tabindex="0" style="margin-left:6px" title="Voir les résultats"
      onclick="event.stopPropagation();go('recherche')"
      onkeydown="kbd(event,()=>go('recherche'))">⌕</div>
  </div>`;
};

/* capsule mobile — une ligne, tap → feuille de recherche complète */
const mobSearch = () => {
  let txt;
  if (SMODE==='ia') txt = '✦ « ' + (IAQ || IAPHRASE()).slice(0,34) + '… »';
  else if (!HASQ) txt = '⌕ Commencer une recherche';
  else txt = '⌕ ' + (zonesLbl()||'Où ?')
    + ((MODE==='home' ? CRIT.mens : CRIT.budget) ? ' · ≤ ' + (MODE==='home'?CRIT.mens:CRIT.budget) : '');
  return `<div class="mobsearch" onclick="POP.recherche()"><span>${nbsp(txt)}</span>
    <span class="ns-tog" style="flex:none" title="Mes recherches récentes"
      onclick="event.stopPropagation();POP.recentes()">↺</span></div>`;
};

/* `auth` peut être forcé : l'accueil pilote ses états lui-même (visiteur vs connecté),
   la nav doit suivre l'état choisi plutôt que la bascule globale de la barre d'outils. */
const appnav = (active, who='customer', auth=AUTH, solde=SOLDE) => {
  if (who==='pro') {
    const links = ['Tableau de bord','Mes biens','Mes leads','Acheteurs','Facturation'];
    return `<div class="appnav">
      <div class="burger"><i></i><i></i><i></i></div>
      <div class="logo hot" onclick="go('pro-dashboard')" title="Retour au tableau de bord">LOGO</div>
      ${links.map(l=>`<div class="lk ${l===active?'on':''}" ${GO[l]?`onclick="go('${GO[l]}')"`:''}>${l}</div>`).join('')}
      <div style="margin-left:auto" class="row mid gap8">
        <span class="chip ${solde===0?'o':'k'} hot num" title="Vos crédits — cliquez pour en acheter"
          onclick="goState('pro-profil','Acheter des crédits')">◈ ${solde} crédit${solde>1?'s':''}</span>
        <span class="chip">Pro vérifié</span>
        <div class="avatar hot" title="Profil de l'agence" onclick="go('pro-profil')"
          style="display:flex;align-items:center;justify-content:center;color:var(--ink-3)">${USER_SVG}</div>
      </div>
    </div>`;
  }
  const home = active==='home';
  return `<div class="appnav" style="gap:14px;flex-wrap:wrap">
    <div class="burger"><i></i><i></i><i></i></div>
    <div class="logo hot" onclick="go('accueil')" title="Retour à l'accueil">LOGO</div>
    ${home ? '<div style="flex:1"></div>'
           : `<div style="flex:1"></div>${navSearch()}${mobSearch()}<div style="flex:1"></div>`}
    <div class="row mid gap8" style="flex:none;margin-left:auto">
      ${auth==='out' ? `
      <button class="btn ghost sm authsec" style="color:var(--ink-2)">Se connecter</button>
      <button class="btn sm hot" onclick="go('inscription')">S'inscrire</button>` : `
      <div class="navico" title="Favoris & mes recherches" onclick="event.stopPropagation();togglePanel()">♡<span class="bdg">3</span></div>
      <div class="navico photo hot" title="Mon compte — Marc D., connecté" onclick="go('compte')">MD</div>`}
    </div>
  </div>`;
};
const GO = {'Recherche':'recherche','Favoris':'favoris','Mes recherches':'recherches',
            'Tableau de bord':'pro-dashboard','Mes biens':'pro-biens','Mes leads':'pro-leads',
            'Acheteurs':'pro-acheteurs','Facturation':'pro-factures'};

/* ---- données réelles (08-CONTENU-EXEMPLE) ----
   Modèle F-010 v2 : UNE annonce par bien, éditée par First Mundi.

/* =======================================================================
   POPUPS DE DÉTAIL — premier niveau minimal, le détail s'ouvre au clic
   ======================================================================= */
function pop(title, sub, body, foot, big){
  const box = document.getElementById('popbox');
  box.classList.toggle('big', !!big);
  /* Une feuille est une boîte de dialogue : elle s'annonce comme telle, elle porte son titre,
     et elle prend le focus. Sans cela un lecteur d'écran continue de lire la page du dessous. */
  box.setAttribute('role','dialog');
  box.setAttribute('aria-modal','true');
  box.setAttribute('aria-label', String(title).replace(/<[^>]*>/g,''));
  box.innerHTML = `
    <div class="phead"><div><h5>${title}</h5>${sub?`<div class="sub">${sub}</div>`:''}</div>
      <button class="pclose" onclick="closePop()" title="Fermer" aria-label="Fermer">✕</button></div>
    <div class="pbody ${big?'split':''}">${body}</div>
    ${foot?`<div class="pfoot">${foot}</div>`:''}`;
  document.getElementById('popov').classList.add('open');
  document.body.classList.add('popopen');
  clavierPourLesCliquables(box);
  setTimeout(()=>{ if (!box.contains(document.activeElement)) box.querySelector('.pclose')?.focus(); }, 40);
}
function closePop(){ document.getElementById('popov').classList.remove('open');
  document.body.classList.remove('popopen'); }
function popGo(id){ closePop(); go(id); }
function anc(id, instant){ const el = document.getElementById(id);
  const sc = el && el.closest('.pscroll');
  if (!sc) return;
  document.querySelectorAll('#popbox .pmenu a').forEach(a=>a.classList.toggle('on', a.dataset.anc===id));
  window.__ancLock = Date.now() + (instant ? 400 : 900);
  sc.scrollTo({top: el.offsetTop - 8, behavior: instant ? 'auto' : 'smooth'}); }

/* menu latéral des grandes popups : surligne la section lue, saute à l'ancre demandée */
function wireAnc(anchor){
  const sc = document.querySelector('#popbox .pscroll');
  if (!sc) return;
  const links = [...document.querySelectorAll('#popbox .pmenu a')];
  const spy = ()=>{ if (Date.now() < (window.__ancLock||0)) return;
    let c = links[0]?.dataset.anc;
    for (const l of links){ const el = document.getElementById(l.dataset.anc);
      if (el && el.offsetTop <= sc.scrollTop + 80) c = l.dataset.anc; }
    links.forEach(l=>l.classList.toggle('on', l.dataset.anc===c)); };
  sc.addEventListener('scroll', spy);
  if (anchor) anc('anc-'+anchor, true); else { window.__ancLock = 0; spy(); }
}

  /* score — les 4 critères derrière le badge : localisation, rentabilité, marché, risque.

  score(sc){

  /* estimation de prix — le détail derrière la jauge */
  estim(i){ const b = BIENS[i]; const e = b.est;

    pop('Estimation de prix', 'Comparé aux ventes réellement conclues autour de ce bien — pas aux prix affichés.', `
    <div class="range">

      <div class="mk" style="left:${e.pos}%"></div>

    `<button class="btn sec2 sm" onclick="closePop()">Fermer</button>

  /* modifier ou créer la recherche — pilule desktop, capsule mobile.
     Regroupe tout : mode, type de recherche (critères / phrase), champs. */
  recherche(){ const home = MODE==='home';
    const head = `

        <button class="${SMODE!=='ia'?'on':''}" style="padding:5px 13px" onclick="shSMode('criteres')">⌕ Critères</button>
        <button class="${SMODE==='ia'?'on':''}" style="padding:5px 13px" onclick="shSMode('ia')">✦ Décrire</button>
      </div>
    </div>`;
    if (SMODE==='ia'){
      pop('Ma recherche', 'Décrivez ce que vous cherchez — traduit en critères, que vous validez.', head + `
      <div class="iainwrap">
        <span style="flex:none;color:var(--ink-3)">✦</span>
        <input id="iainput" class="iain" value="${IAQ}"

      </div>

        ${(home

          .map(t=>`<span class="chip hot" onclick="iaAdd('${t}')">${t}</span>`).join('')}
      </div>
      <div class="disc mt14">Aucun prix ni rendement n'est estimé ici — l'interprétation vous est
      montrée en critères modifiables avant de lancer.</div>`,

    }
    /* le même compteur que la barre de résultats et que « tous les filtres » : il tient

    const nb = resultCount();
    pop(HASQ?'Modifier ma recherche':'Nouvelle recherche',
      `Les critères s'appliquent au mode « ${home?'J\'habite':'J\'investis'} ».`, head + `

    ${!HASQ && RECENTES.length ? `

      </div>` : ''}

    <div class="field"><div class="row mid" style="justify-content:space-between;gap:8px">
        <div class="lbl">${pin(8)} Où</div>
        ${ZONES.length?`<span class="sub num">${nbsp(nb+' biens')} dans vos zones</span>`:''}
      </div>
      <div class="row gap6 wrap" style="margin-top:6px">
        ${ZONES.map(([n,,km])=>`<span class="chip k hot" onclick="POP.localisation()">${
          n}${km?` +${km} km`:''}</span>`).join('')}
        <span class="chip o hot" onclick="POP.localisation()">${
          ZONES.length?'+ ajouter une zone':'+ ville, arrondissement, quartier, département'}</span>
      </div>
      <div class="hint">Cumulez les zones et réglez un rayon sur chacune —
        <span class="linkish" onclick="POP.localisation()">tout le détail de la localisation</span>.</div>
    </div>

    <div class="grid2 mt14">
      ${home

          + inpLive('Apport disponible', 'apport', {placeholder:'ex. 45 000 €', hint:'sert au calcul de la mensualité', pop:'recherche'})
        : inpLive('Budget max', 'budget', {placeholder:'ex. 300 000 €', pop:'recherche'})
          + inpLive('Rendement brut min', 'rdt', {placeholder:'ex. 4 %', pop:'recherche'})}
    </div>

    <div class="field mt14"><div class="lbl">Type de bien</div>
      <div class="row gap6 wrap">${['Appartement','Maison','Immeuble','Terrain','Local / bureau','Parking']
        .map(t=>critChip(t,'types',t,'recherche')).join('')}</div></div>

    <div class="field mt14"><div class="lbl">Nombre de pièces</div>
      <div class="row gap6 wrap">${['Studio','T2','T3','T4','T5 et +']
        .map(t=>critChip(t,'pieces',t,'recherche')).join('')}</div>
      <div class="hint">Plusieurs tailles possibles — c'est un OU, pas un minimum.
        Il ne s'applique pas aux immeubles, qui se comptent en lots.</div></div>

    <div class="grid2 mt14">
      ${inpLive('Surface min', 'surfMin', {placeholder:'—', pop:'recherche'})}
      ${inpLive('Surface max', 'surfMax', {placeholder:'—', pop:'recherche'})}
    </div>

    <div class="row mid mt14" style="justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span class="sub">Besoin de plus fin ? <span class="linkish hot" onclick="POP.filtres()">Tous les filtres</span> —
        DPE, score, équipements, état, critères ${home?'de vie':'investisseur'}…</span>
      ${(()=>{const n = critActifs().filter(([,k])=>!k.startsWith('zone:')).length;
        return n ? `<span class="chip">${n} critère${n>1?'s':''} actif${n>1?'s':''}</span>` : '';})()}
    </div>`,
    `${HASQ?`<span class="linkish sub hot" role="button" tabindex="0" style="margin-right:auto"
       onclick="critReset('recherche')" onkeydown="kbd(event,()=>critReset('recherche'))"

     <button class="btn sm" ${ZONES.length?`onclick="HASQ=true;PAGE=1;popGo('recherche')"`:'disabled'}>${
       ZONES.length?`Rechercher — ${nbsp(nb+' biens')}`:'Choisissez d\'abord une zone'}</button>`);
  },

  /* interprétation d'une recherche en langage naturel — remplace l'ancien écran dédié.
     Tout tient en une popup : ce que le modèle a compris (critères modifiables), ce qu'il lui
     manque (deux questions fermées), puis le lancement. Aucune estimation ici — l'IA interprète
     une demande, elle ne chiffre rien (contrainte R5 de la conformité). */
  interpretation(){
    if (!IA) IA = iaLire(IAQ || IAPHRASE());
    const c = IA.crit, home = IA.mode==='home';
    /* les critères tirés de la phrase, dans l'ordre où on les lit dans une annonce */
    const lus = [
      ...IA.zones.map(([n,,km])=>['Où', n + (km?` + ${km} km`:''), '__zones', null]),
      ...(c.types.length ? [['Type', c.types.join(' · '), 'types', null]] : []),
      ...(c.pieces.length ? [['Pièces', c.pieces.join(' · '), 'pieces', null]] : []),
      ...(c.surfMin ? [['Surface min', c.surfMin, 'surfMin', null]] : []),
      ...(home && c.mens ? [['Mensualité max', c.mens, 'mens', null]] : []),
      ...(!home && c.budget ? [['Budget max', c.budget, 'budget', null]] : []),
      ...(!home && c.rdt ? [['Rendement brut', '≥ '+c.rdt, 'rdt', null]] : []),
      ...(c.dpe ? [['DPE', c.dpe+' minimum', 'dpe', null]] : []),
      ...c.montage.map(m=>['Montage', m, 'montage', m]),
      ...c.equip.map(e=>['Équipement', e, 'equip', e])
    ];
    const reste = IA.flous.filter(f => !(IA.repondu||{})[f.k]);
    pop('Voici comment j’ai compris votre demande',
      `« ${IAQ || IAPHRASE()} »`, `
    <div class="lbl">Les critères que j’en tire — modifiables</div>
    ${lus.length ? `<div class="row gap6 wrap mt8">
      ${lus.map(([k,v,key,val])=>`<span class="chip hot" role="button" tabindex="0"
        title="Retirer ce critère" data-k="${key}" data-v="${val==null?'':val}"
        onclick="iaRetirer(this.dataset.k, this.dataset.v||null)"
        onkeydown="kbd(event,()=>iaRetirer(this.dataset.k, this.dataset.v||null))">${
        k} : <b style="color:var(--ink)">${nbsp(v)}</b> <b style="opacity:.55">✕</b></span>`).join('')}
      <span class="chip o hot" role="button" tabindex="0" onclick="closePop();POP.filtres()"
        onkeydown="kbd(event,()=>{closePop();POP.filtres()})">+ ajouter un critère</span>
    </div>
    <div class="disc mt8">Retirez ou modifiez un critère : c’est votre lecture qui fait foi,
    pas la mienne.</div>`
    : `<div class="card flat pad mt8"><div class="sub">Je n’ai rien su tirer de cette phrase —
      aucun lieu, aucun budget, aucun type de bien. Dites-moi au moins où vous cherchez, ou
      <span class="linkish hot" onclick="shSMode('criteres')">repassez en filtres</span>.</div></div>`}

    ${reste.length ? `
    <div class="hr" style="margin:16px 0"></div>
    <h5 class="wt">${reste.length===1?'Une précision':'Encore '+reste.length+' précisions'} et je lance la recherche</h5>
    <div class="col gap20 mt14">
      ${reste.map(f=>`
      <div>
        <div class="txt" style="color:var(--ink)">${f.q}</div>
        <div class="row gap6 wrap mt8">
          ${f.opts.map(([lbl,val])=>`<span class="chip hot" role="button" tabindex="0"
            data-k="${f.k}" data-v="${val}"
            onclick="iaRepondre(this.dataset.k, this.dataset.v)"
            onkeydown="kbd(event,()=>iaRepondre(this.dataset.k, this.dataset.v))">${lbl}</span>`).join('')}
        </div>
      </div>`).join('')}
    </div>` : `
    <div class="bandeau mt20">${pin(4)} <b>Rien ne me manque.</b> Vous pouvez lancer —
    et retoucher n’importe quel critère ensuite, la recherche reste la vôtre.</div>`}

    <div class="disc mt20">Aucun prix ni rendement n’est estimé ici : j’interprète une demande,
    je ne chiffre rien. Les chiffres viennent du moteur de calcul, sur les fiches.</div>`,
    `<span class="linkish sub hot" role="button" tabindex="0" style="margin-right:auto"
       onclick="shSMode('criteres')" onkeydown="kbd(event,()=>shSMode('criteres'))">Repasser en filtres</span>
     <button class="btn sec2 sm" onclick="closePop()">Annuler</button>
     <button class="btn sm" ${lus.length?'onclick="iaLancer()"':'disabled'}>Lancer la recherche</button>`);
  },

  /* galerie photos — grille complète */
  photos(i){ const b = BIENS[i];
    if (!b.photo){ pop('Photos', 'Aucune photo ne nous a été transmise avec ce bien.', `
      <div class="empty" style="padding:26px 12px">
        <div class="ico"></div>
        <p>Le texte de cette annonce est le nôtre, mais pas les photos : elles restent la propriété

        <button class="btn sec2 sm">Voir sur le site source ↗</button>
      </div>`,
      `<button class="btn sec2 sm" onclick="closePop()">Fermer</button>`); return; }
    pop(`10 photos — ${b.t}`, 'Transmises avec les données du bien, affichées depuis leur serveur d’origine — jamais stockées chez nous.', `
    <div class="grid2" style="gap:8px">
      ${Array.from({length:10},(_,k)=>`<div class="ph solid" style="height:130px">photo ${k+1}${k===0?' · principale':''}</div>`).join('')}
    </div>`,
    `<button class="btn sec2 sm" onclick="closePop()">Fermer</button>`);
  },

  /* tri des résultats — dropdown */
  /* ---------- OÙ CHERCHER — le choix de localisation, en entier ----------
     C'était le champ le plus expédié de la recherche alors que c'est le premier que l'utilisateur
     remplit et le seul qu'il ne peut pas se contenter d'approximer. Quatre exigences :
     1) on cherche un LIEU TYPÉ, pas une chaîne — le type décide de ce qu'on peut en faire ;
     2) le rayon appartient à la zone, pas à la recherche ;
     3) on annonce ce qu'un rayon ramène AVANT de l'appliquer ;
     4) on dit combien de biens il y a derrière chaque zone, y compris quand la réponse est « trois ». */
  localisation(){
    const total = zonesTotal();
    const pauvre = ZONES.find(([n]) => (LIEUX.find(l=>l[0]===n)||[,, ,999])[3] < 20);

    pop('Où cherchez-vous ?',
      'Ville, arrondissement, quartier ou département — cumulez-en autant que vous voulez.', `
    <div class="iainwrap locsearch" style="margin-bottom:16px">
      <span style="flex:none;color:var(--ink-3)">⌕</span>
      <input id="locinput" class="iain" value="${LQ}"
        placeholder="Ex. : Lyon 7ᵉ, 69007, Jean Macé, Rhône…"
        oninput="locSaisie(this)">
      ${LQ?`<span class="linkish sub" style="flex:none" onclick="LQ='';POP.localisation()">effacer</span>`:''}
    </div>

${LQ ? `<div id="locres">${locResultats()}</div>` : ''}

    <div class="lbl" style="margin-bottom:7px">Vos zones${ZONES.length?` (${ZONES.length})`:''}</div>
    ${ZONES.length ? `<div class="col gap6">${ZONES.map(([n,t,km],i)=>{
      const meta = LIEUX.find(l=>l[0]===n) || [n,t,'',0];
      const eff  = (n==='Lyon 7ᵉ' && RAYON_EFFET[km]) ? RAYON_EFFET[km] : null;
      return `
      <div class="card flat pad">
        <div class="row mid" style="justify-content:space-between;gap:10px">
          <div style="min-width:0">
            <div class="txt" style="font-weight:600;color:var(--ink)">${n}</div>
            <div class="sub">${LTYPE[t]} · ${meta[2]}</div>
          </div>
          <div class="row mid gap8" style="flex:none">
            <span class="sub num">${nbsp(zoneCount(n,t,km)+' biens')}</span>
            <span class="pclose hot" title="Retirer cette zone" onclick="zoneDel(${i})">✕</span>
          </div>
        </div>
        ${/* Le rayon est replié derrière sa valeur courante. Déplié, chaque zone coûtait
             cinq pastilles sur deux lignes — deux zones suffisaient à pousser les résultats
             de recherche hors de l'écran sur mobile, alors que c'est la liste des lieux
             qu'on vient chercher ici. Ce qu'on NE replie pas, c'est l'effet du rayon : la
             phrase « inclut Lyon 3ᵉ, Lyon 8ᵉ… » reste lisible sans rien ouvrir, parce que
             c'est elle qui fait la valeur du réglage, pas la rangée de boutons. */''}
        ${t==='dep' ? `<div class="hint" style="margin-top:8px">Un département se prend en entier —
          le rayon ne s'applique qu'aux communes, arrondissements et quartiers.</div>`
        : `${ZOPEN===i
            ? `<div class="row gap6 wrap" style="margin-top:9px">
                ${RAYONS.map(r=>`<span class="chip hot ${r===km?'k':''}" role="button" tabindex="0"
                  onclick="zoneRayon(${i},${r})" onkeydown="kbd(event,()=>zoneRayon(${i},${r}))">${rayonLbl(r)}</span>`).join('')}
               </div>`
            : `<div class="row mid gap6" style="margin-top:9px">
                <span class="chip hot k" role="button" tabindex="0" title="Changer le rayon"
                  onclick="zoneOuvrir(${i})" onkeydown="kbd(event,()=>zoneOuvrir(${i}))">${rayonLbl(km)} ▾</span>
                <span class="sub">rayon</span>
               </div>`}
          ${km>0 && eff ? `<div class="hint" style="margin-top:7px">Inclut ${eff[0]} —
            ${nbsp(eff[1]+' biens')} au lieu de ${nbsp(meta[3]+' biens')}.</div>`
          : km>0 ? `<div class="hint" style="margin-top:7px">Étend la zone de ${km} km autour de
            ${n} — les communes limitrophes entrent dans les résultats.</div>` : ''}`}
        ${/* l'avertissement de recouvrement appartient à la zone qu'il concerne : en fin de
             liste, il désignait la mauvaise carte dès qu'une troisième zone s'ajoutait */''}
        ${n==='Villeurbanne' && zonesChevauchent() ? `<div class="bandeau" style="margin-top:9px">${pin(4)}
          <b>Villeurbanne est déjà comprise dans « Lyon 7ᵉ + 5 km ».</b>
          Les biens ne sont comptés qu'une fois — vous pouvez laisser les deux, ça ne double rien.</div>` : ''}
      </div>`;}).join('')}</div>`
    : `<div class="card flat pad"><div class="sub">Aucune zone pour l'instant.

    ${pauvre ? `<div class="bandeau mt14">${pin(5)} <b>Nous couvrons mal ${pauvre[0]}.</b>
